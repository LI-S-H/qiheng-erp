  /purchase/orders:
    get:
      tags: [PurchaseOrder]
      summary: 分页查询采购订单
      description: |
        查询未删除的 `purchase_order` 单头数据，列表不返回明细数组；查看、编辑、提交或审核前通过详情接口按订单 ID 获取 `items`。采购单号使用包含匹配，供应商、仓库和状态使用精确匹配，多个有效条件按 AND 组合。
        不接收含义不明确的 `keyword` 参数。列表摘要只展示当前页 `records` 派生的状态、入库等业务指标，不展示当前页行数；不得要求后端为了摘要额外全量聚合。
        本接口需要 `purchase:query` 权限。
      operationId: purchaseOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: purchaseNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 采购单号，对应 `purchase_order.purchase_no`，使用包含匹配
        - name: supplierId
          in: query
          schema: { type: string }
          description: 供应商 ID，对应 `purchase_order.supplier_id`，使用精确匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 入库仓库 ID，对应 `purchase_order.warehouse_id`，使用精确匹配
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_INBOUND, INBOUND_DONE, CANCELLED]
          description: 采购订单状态，对应 `purchase_order.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [PurchaseOrder]
      summary: 新增采购订单草稿
      description: |
        采购单号、供应商和产品快照、订单总金额、创建人和审计字段由后端维护，前端不提交；创建后状态为 `DRAFT`，不生成入库流水。
        草稿阶段 `expectedArrivalDate` 可为空；提交或审核前，后端必须校验单头预计到货日期非空。
        明细数量和金额使用业务真实值传输，数据库按 decimal 保存；`selectedSupplierScore` 按 0-100 业务值提交，后端负责放大 100 倍落库。
        本接口需要 `purchase:create` 权限。
      operationId: purchaseOrderCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}:
    get:
      tags: [PurchaseOrder]
      summary: 获取采购订单详情
      description: 返回 `purchase_order` 主表信息及按 `purchase_order_item.purchase_order_id` 查询的全部明细。本接口需要 `purchase:query` 权限。
      operationId: purchaseOrderDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PurchaseOrder]
      summary: 编辑采购订单
      description: |
        `DRAFT` 状态可由采购创建权限编辑；`SUBMITTED` 状态仍允许具备审核/审批权限的用户编辑供应商、入库仓库、预计到货日期、备注和明细。
        `APPROVED`、`PARTIAL_INBOUND`、`INBOUND_DONE`、`CANCELLED` 不允许通过本接口修改；已审核后的业务纠正应通过仓库出入库、冲销或反向业务单据处理。
        采购单号、状态、已入库数量、创建人、提交人、审核人和审计字段由后端维护，前端不得提交。
        明细传入 `purchaseOrderItemId` 表示更新已有明细，不传表示新增明细，被移除的旧明细由后端物理删除；采购明细不维护单独预计到货日期。
        后端必须重新校验权限、供应商、仓库、产品、供货关系、数量精度和价格，并重算主表 `total_amount`。本接口需要 `purchase:create` 或审核/审批权限。
      operationId: purchaseOrderUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}/submit:
    post:
      tags: [PurchaseOrder]
      summary: 提交采购订单
      description: 仅允许 `DRAFT -> SUBMITTED`；前端调用本接口前必须先通过详情数据向操作人展示完整采购单头和采购明细，并在二次确认后提交。提交时后端重新校验单头预计到货日期非空、供应商、仓库、产品、供货关系和明细数量价格。本接口需要 `purchase:create` 权限并保证重复请求幂等。
      operationId: purchaseOrderSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}/approve:
    post:
      tags: [PurchaseOrder]
      summary: 审核采购订单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。前端调用本接口前必须先通过详情数据向审核人展示完整采购单头和采购明细，并在二次确认后审核通过。审核前后端必须重新校验单头预计到货日期非空、供应商、仓库、产品、供货关系和明细数量价格。
        审核通过后，后端在同一事务内生成仓库模块 `PURCHASE_IN` 待确认入库单，`source_type = PURCHASE_ORDER`、`source_id = purchase_order.id`、`source_no = purchase_order.purchase_no`，并带入供应商、入库仓库、采购数量、累计已入库和剩余未入库数量。
        采购订单审核后不直接改变库存，也不生成库存流水；需要审核/审批权限并保证重复请求幂等。
      operationId: purchaseOrderApprove
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 审核成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}/cancel:
    post:
      tags: [PurchaseOrder]
      summary: 取消采购订单
      description: 仅允许 `DRAFT` 或 `SUBMITTED` 状态取消；取消不改变库存，不生成入库单或库存流水，已审核或已产生入库事实的采购订单不得直接取消。本接口需要 `purchase:create` 权限并保证重复请求幂等。
      operationId: purchaseOrderCancel
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/returns:
    get:
      tags: [PurchaseReturn]
      summary: 分页查询采购退回单
      description: |
        查询未删除且 `return_order.return_type=PURCHASE_RETURN` 的退回单。退回单号和原采购单号分别使用包含匹配，供应商、退货仓库和状态使用精确匹配，多个有效条件按 AND 组合；不接收含义不明的 `keyword`。
        列表只返回退回单头，详情和状态动作前必须通过详情接口读取全部明细。本接口需要 `purchase:query` 权限，后端必须完成数据范围裁剪。
      operationId: purchaseReturnPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 采购退回单号，对应 `return_order.return_no`，使用包含匹配
        - name: sourceOrderNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 原采购单号快照，对应 `return_order.source_order_no`，使用包含匹配
        - name: supplierId
          in: query
          schema: { type: string }
          description: 供应商 ID，对应 `return_order.party_id`，BIGINT 按字符串传输并使用精确匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 退货出库仓库 ID，对应 `return_order.warehouse_id`，BIGINT 按字符串传输并使用精确匹配
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_EXECUTED, COMPLETED, CANCELLED]
          description: 采购退回状态，对应 `return_order.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [PurchaseReturn]
      summary: 新增采购退回草稿
      description: |
        前端 API adapter 固定提交 `returnType=PURCHASE_RETURN`，页面不提供退回类型编辑控件。退回单号、原采购单号、供应商和产品快照、仓库名称、金额、状态与审计字段全部由后端查询或计算，前端不得提交。
        后端必须校验原采购单和明细已有实际入库数量、仓库有效、来源明细不重复及申请数量精度；草稿不占用剩余可退数量。本接口需要 `purchase:create` 权限。
      operationId: purchaseReturnCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseReturnOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/returns/source-orders:
    get:
      tags: [PurchaseReturn]
      summary: 分页查询可退采购来源单
      description: |
        返回至少存在一条 `availableReturnQty > 0` 明细的采购订单。`availableReturnQty` 必须由服务端以 `purchase_order_item.inbound_qty` 减去其他有效采购退回单占用数量后计算，前端不得用普通采购订单详情自行聚合。
        原采购单号使用包含匹配；本接口需要 `purchase:create` 或 `purchase:manage` 权限。
      operationId: purchaseReturnSourceOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: sourceOrderNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 原采购单号，使用包含匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnableSourceOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /purchase/returns/source-orders/{sourceOrderId}/items:
    get:
      tags: [PurchaseReturn]
      summary: 查询原采购单可退明细
      description: |
        返回原采购单中已有实际入库且仍有剩余可退数量的明细。`occupiedQty` 和 `availableReturnQty` 是服务端查询派生字段，不落 `return_order_item`；提交或审核时后端仍须锁定来源明细并重新聚合。
        本接口需要 `purchase:create` 或 `purchase:manage` 权限。
      operationId: purchaseReturnSourceOrderItems
      security:
        - SaTokenAuth: []
      parameters:
        - name: sourceOrderId
          in: path
          required: true
          schema: { type: string }
          description: 原采购订单 ID，对应 `purchase_order.id`，BIGINT 按字符串传输
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReturnableSourceOrderItem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /purchase/returns/{returnOrderId}:
    get:
      tags: [PurchaseReturn]
      summary: 获取采购退回详情
      description: 返回 `return_order` 采购退回单头及全部 `return_order_item` 明细。本接口需要 `purchase:query` 权限。
      operationId: purchaseReturnDetail
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
          description: 退回单 ID，对应 `return_order.id`，BIGINT 按字符串传输
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PurchaseReturn]
      summary: 编辑采购退回草稿
      description: |
        仅 `DRAFT` 可编辑。退回类型创建后不可修改，更新请求不接收 `returnType`；退回单号、来源与供应商快照、产品快照、金额、状态、审计和处理数量不得提交。
        后端必须重新校验 `purchase:manage` 权限、乐观锁、来源订单、仓库、明细重复、数量精度和当前剩余可退数量。
      operationId: purchaseReturnUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderUpdateRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [PurchaseReturn]
      summary: 删除采购退回草稿
      description: 仅 `DRAFT` 可逻辑删除主表，并在同一事务内物理删除对应明细。本接口需要 `purchase:manage` 权限。
      operationId: purchaseReturnDelete
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200": { description: 删除成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/returns/{returnOrderId}/submit:
    post:
      tags: [PurchaseReturn]
      summary: 提交采购退回单
      description: 仅允许 `DRAFT -> SUBMITTED`。提交前必须展示完整详情并二次确认；后端锁定原采购明细，按申请数量重新聚合占用，校验预计退货日期和剩余可退数量。本接口需要 `purchase:manage` 权限并保证幂等。
      operationId: purchaseReturnSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200": { description: 提交成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/returns/{returnOrderId}/approve:
    post:
      tags: [PurchaseReturn]
      summary: 审核通过采购退回单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。审核人逐明细提交审核数量，不提交数据库不存在的普通审核意见；后端锁定来源明细并重新校验占用，按审核数量释放未通过部分。
        审核通过后在同一事务内生成 `outbound_type=PURCHASE_RETURN`、`source_type=PURCHASE_RETURN_ORDER`、`entry_mode=SOURCE_GENERATED` 的待确认出库单，不直接扣减库存。本接口需要 `purchase:manage` 权限并保证幂等。
      operationId: purchaseReturnApprove
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderApproveRequest' }
      responses:
        "200": { description: 审核成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/returns/{returnOrderId}/reject:
    post:
      tags: [PurchaseReturn]
      summary: 审核退回采购退回单
      description: 仅允许 `SUBMITTED -> DRAFT`，退回原因写入 `return_order.status_reason` 并释放申请数量占用。本接口需要 `purchase:manage` 权限。
      operationId: purchaseReturnReject
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderReasonActionRequest' }
      responses:
        "200": { description: 退回成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/returns/{returnOrderId}/cancel:
    post:
      tags: [PurchaseReturn]
      summary: 取消采购退回单
      description: 仅允许 `DRAFT`、`SUBMITTED` 或尚未产生处理数量的 `APPROVED` 进入 `CANCELLED`；取消原因写入 `status_reason`，已生成未确认出库单必须同步取消。部分执行后不得取消。本接口需要 `purchase:manage` 权限。
      operationId: purchaseReturnCancel
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderReasonActionRequest' }
      responses:
        "200": { description: 取消成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/customers:
    get:
      tags: [SalesCustomer]
      summary: 分页查询客户
      description: |
        查询未删除的 `customer` 数据。客户编码、客户名称和联系人分别使用包含匹配，状态使用精确匹配，多个有效条件按 AND 组合。
        不接收含义不明确的 `keyword` 参数；`creditLimit` 按金额真实值返回，对应数据库 `customer.credit_limit`。
        本接口需要 `sales:query` 权限。
      operationId: salesCustomerPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: customerCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 客户编码，对应 `customer.customer_code`，使用包含匹配
        - name: customerName
          in: query
          schema: { type: string, maxLength: 200 }
          description: 客户名称，对应 `customer.customer_name`，使用包含匹配
        - name: contactName
          in: query
          schema: { type: string, maxLength: 100 }
          description: 联系人，对应 `customer.contact_name`，使用包含匹配
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: 状态，对应 `customer.status`，1 启用，0 停用，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesCustomerPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SalesCustomer]
      summary: 新增客户
      description: 客户编码由后端统一生成并通过唯一索引保证不重复，前端创建请求不提交客户编码；信用额度仅记录，不在 MVP 阶段强拦截销售下单。本接口需要 `sales:create` 权限。
      operationId: salesCustomerCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCustomerFormRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesCustomer' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/customers/batch/status:
    patch:
      tags: [SalesCustomer]
      summary: 批量修改客户状态
      description: 停用客户后不得用于新建销售订单，但历史订单继续保留客户快照。本接口需要 `sales:create` 权限。
      operationId: salesCustomerBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCustomerBatchStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/customers/batch/delete:
    post:
      tags: [SalesCustomer]
      summary: 批量删除客户
      description: 批量逻辑删除客户；任一客户存在销售订单时整批返回 409，避免破坏销售追溯链路。本接口需要 `sales:create` 权限。
      operationId: salesCustomerBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCustomerBatchDeleteRequest' }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/customers/{customerId}:
    put:
      tags: [SalesCustomer]
      summary: 编辑客户
      description: 编辑请求不接收 `customerCode`；客户名称修改时，后端同步当前可编辑销售订单快照，历史已审核订单继续保留下单时客户快照。本接口需要 `sales:create` 权限。
      operationId: salesCustomerUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCustomerFormRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesCustomer' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SalesCustomer]
      summary: 删除客户
      description: 逻辑删除客户；存在 `sales_order` 销售订单时返回 409。本接口需要 `sales:create` 权限。
      operationId: salesCustomerDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/customers/{customerId}/status:
    patch:
      tags: [SalesCustomer]
      summary: 修改客户状态
      description: 停用后客户不能用于新建销售订单，历史订单不受影响。本接口需要 `sales:create` 权限。
      operationId: salesCustomerStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesCustomerStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders:
    get:
      tags: [SalesOrder]
      summary: 分页查询销售订单
      description: |
        查询未删除的 `sales_order` 单头数据，列表不返回明细数组；查看、编辑、提交或审核前通过详情接口按订单 ID 获取 `items`。销售单号使用包含匹配，客户、仓库和状态使用精确匹配，多个有效条件按 AND 组合。
        不接收含义不明确的 `keyword` 参数。列表摘要只展示当前页 `records` 派生的状态、出库等业务指标，不展示当前页行数；不得要求后端为了摘要额外全量聚合。
        本接口需要 `sales:query` 权限。
      operationId: salesOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: salesNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 销售单号，对应 `sales_order.sales_no`，使用包含匹配
        - name: customerId
          in: query
          schema: { type: string }
          description: 客户 ID，对应 `sales_order.customer_id`，使用精确匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 出库仓库 ID，对应 `sales_order.warehouse_id`，使用精确匹配
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_OUTBOUND, OUTBOUND_DONE, CANCELLED]
          description: 销售订单状态，对应 `sales_order.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SalesOrder]
      summary: 新增销售订单草稿
      description: |
        销售单号、客户和产品快照、订单总金额、创建人和审计字段由后端维护，前端不提交；创建后状态为 `DRAFT`，不锁定库存、不生成出库单或库存流水。
        草稿阶段 `expectedDeliveryDate` 可为空；提交或审核前，后端必须校验单头预计发货日期非空。
        明细数量和金额使用业务真实值传输，数据库按 decimal 保存；后端必须校验客户、仓库、产品启用状态、产品数量精度，并重算主表 `total_amount`。
        本接口需要 `sales:create` 权限。
      operationId: salesOrderCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}:
    get:
      tags: [SalesOrder]
      summary: 获取销售订单详情
      description: 返回 `sales_order` 主表信息及按 `sales_order_item.sales_order_id` 查询的全部明细。本接口需要 `sales:query` 权限。
      operationId: salesOrderDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [SalesOrder]
      summary: 编辑销售订单
      description: |
        `DRAFT` 状态可由销售创建权限编辑；`SUBMITTED` 状态仍允许具备审核/审批权限的用户编辑客户、出库仓库、预计发货日期、备注和明细。
        `APPROVED`、`PARTIAL_OUTBOUND`、`OUTBOUND_DONE`、`CANCELLED` 不允许通过本接口修改；已产生出库事实的业务纠正应通过仓库出入库、冲销或反向业务单据处理。
        销售单号、状态、已锁定数量、已出库数量、创建人、提交人、审核人和审计字段由后端维护，前端不得提交。
        明细传入 `salesOrderItemId` 表示更新已有明细，不传表示新增明细，被移除的旧草稿明细由后端物理删除。
        后端必须重新校验权限、客户、仓库、产品、数量精度和价格，并重算主表 `total_amount`。本接口需要 `sales:create` 或审核/审批权限。
      operationId: salesOrderUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}/submit:
    post:
      tags: [SalesOrder]
      summary: 提交销售订单
      description: |
        仅允许 `DRAFT -> SUBMITTED`。前端调用本接口前必须先通过详情数据向操作人展示完整销售单头和销售明细，并在二次确认后提交。
        提交时后端重新校验单头预计发货日期非空、客户、仓库、产品、数量价格和可用库存 `warehouse_stock.stock_qty - warehouse_stock.locked_qty`；锁定成功后更新 `warehouse_stock.locked_qty`、`sales_order_item.locked_qty` 和 `sales_order.locked_at`。
        本接口需要 `sales:create` 权限并保证重复请求幂等。
      operationId: salesOrderSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}/approve:
    post:
      tags: [SalesOrder]
      summary: 审核销售订单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。前端调用本接口前必须先通过详情数据向审核人展示完整销售单头和销售明细，并在二次确认后审核通过。
        审核前后端必须重新校验预计发货日期、客户、仓库、产品、明细数量价格和库存锁定结果；如尚未锁定库存，审核流程必须在同一事务内先完成库存锁定。
        审核通过后，后端在同一事务内生成仓库模块 `SALES_OUT` 待确认出库单，`source_type = SALES_ORDER`、`source_id = sales_order.id`、`source_no = sales_order.sales_no`，并带入客户、出库仓库、销售数量、累计已出库和剩余未出库数量。
        销售订单审核后不直接扣减库存，也不生成库存流水；需要审核/审批权限并保证重复请求幂等。
      operationId: salesOrderApprove
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 审核成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}/cancel:
    post:
      tags: [SalesOrder]
      summary: 取消销售订单
      description: 仅允许 `DRAFT` 或 `SUBMITTED` 状态取消；若订单已锁定库存，后端必须在同一事务内释放 `warehouse_stock.locked_qty` 和 `sales_order_item.locked_qty`。已审核或已产生出库事实的销售订单不得直接取消。本接口需要 `sales:create` 权限并保证重复请求幂等。
      operationId: salesOrderCancel
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/returns:
    get:
      tags: [SalesReturn]
      summary: 分页查询销售退货单
      description: |
        查询未删除且 `return_order.return_type=SALES_RETURN` 的退货单。退货单号和原销售单号分别使用包含匹配，客户、退货仓库和状态使用精确匹配，多个有效条件按 AND 组合；不接收含义不明的 `keyword`。
        列表只返回退货单头，详情和状态动作前必须通过详情接口读取全部明细。本接口需要 `sales:query` 权限，后端必须完成数据范围裁剪。
      operationId: salesReturnPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 销售退货单号，对应 `return_order.return_no`，使用包含匹配
        - name: sourceOrderNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 原销售单号，对应 `return_order.source_order_no`，使用包含匹配
        - name: customerId
          in: query
          schema: { type: string }
          description: 客户 ID，对应 `return_order.party_id`，使用精确匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 退货入库仓库 ID，对应 `return_order.warehouse_id`，使用精确匹配
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_EXECUTED, COMPLETED, CANCELLED]
          description: 销售退货状态，对应 `return_order.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SalesReturn]
      summary: 新增销售退货草稿
      description: |
        前端 API adapter 固定提交 `returnType=SALES_RETURN`，页面不提供退货类型编辑控件。退货单号、原销售单号、客户和产品快照、仓库名称、金额、状态与审计字段全部由后端查询或计算，前端不得提交。
        后端必须校验原销售单和明细已有实际出库数量、仓库有效、来源明细不重复及申请数量精度；草稿不占用剩余可退数量。本接口需要 `sales:create` 权限。
      operationId: salesReturnCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesReturnOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/returns/source-orders:
    get:
      tags: [SalesReturn]
      summary: 分页查询可退销售来源单
      description: |
        返回至少存在一条 `availableReturnQty > 0` 明细的销售订单。`availableReturnQty` 必须由服务端以 `sales_order_item.outbound_qty` 减去其他有效销售退货单占用数量后计算，前端不得用普通销售订单详情自行聚合。
        原销售单号使用包含匹配；本接口需要 `sales:create` 或 `sales:manage` 权限。
      operationId: salesReturnSourceOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: sourceOrderNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 原销售单号，使用包含匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnableSourceOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /sales/returns/source-orders/{sourceOrderId}/items:
    get:
      tags: [SalesReturn]
      summary: 查询原销售单可退明细
      description: |
        返回原销售单中已有实际出库且仍有剩余可退数量的明细。`occupiedQty` 和 `availableReturnQty` 是服务端查询派生字段，不落 `return_order_item`；提交或审核时后端仍须锁定来源明细并重新聚合。
        本接口需要 `sales:create` 或 `sales:manage` 权限。
      operationId: salesReturnSourceOrderItems
      security:
        - SaTokenAuth: []
      parameters:
        - name: sourceOrderId
          in: path
          required: true
          schema: { type: string }
          description: 原销售订单 ID，对应 `sales_order.id`，BIGINT 按字符串传输
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReturnableSourceOrderItem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /sales/returns/{returnOrderId}:
    get:
      tags: [SalesReturn]
      summary: 获取销售退货详情
      description: 返回 `return_order` 销售退货单头及全部 `return_order_item` 明细。本接口需要 `sales:query` 权限。
      operationId: salesReturnDetail
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
          description: 退货单 ID，对应 `return_order.id`，BIGINT 按字符串传输
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [SalesReturn]
      summary: 编辑销售退货草稿
      description: |
        仅 `DRAFT` 可编辑。退货类型创建后不可修改，更新请求不接收 `returnType`；退货单号、来源与客户快照、产品快照、金额、状态、审计和处理数量不得提交。
        后端必须重新校验 `sales:manage` 权限、乐观锁、来源订单、仓库、明细重复、数量精度和当前剩余可退数量。
      operationId: salesReturnUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderUpdateRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SalesReturn]
      summary: 删除销售退货草稿
      description: 仅 `DRAFT` 可逻辑删除主表，并在同一事务内物理删除对应明细。本接口需要 `sales:manage` 权限。
      operationId: salesReturnDelete
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200": { description: 删除成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/returns/{returnOrderId}/submit:
    post:
      tags: [SalesReturn]
      summary: 提交销售退货单
      description: 仅允许 `DRAFT -> SUBMITTED`。提交前必须展示完整详情并二次确认；后端锁定原销售明细，按申请数量重新聚合占用，校验预计退货日期和剩余可退数量。本接口需要 `sales:manage` 权限并保证幂等。
      operationId: salesReturnSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200": { description: 提交成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/returns/{returnOrderId}/approve:
    post:
      tags: [SalesReturn]
      summary: 审核通过销售退货单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。审核人逐明细提交审核数量，不提交数据库不存在的普通审核意见；后端锁定来源明细并重新校验占用，按审核数量释放未通过部分。
        审核通过后在同一事务内生成 `inbound_type=SALES_RETURN`、`source_type=SALES_RETURN_ORDER`、`entry_mode=SOURCE_GENERATED` 的待确认入库单，不直接增加库存。本接口需要 `sales:manage` 权限并保证幂等。
      operationId: salesReturnApprove
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderApproveRequest' }
      responses:
        "200": { description: 审核成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/returns/{returnOrderId}/reject:
    post:
      tags: [SalesReturn]
      summary: 审核退回销售退货单
      description: 仅允许 `SUBMITTED -> DRAFT`，退回原因写入 `return_order.status_reason` 并释放申请数量占用。本接口需要 `sales:manage` 权限。
      operationId: salesReturnReject
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderReasonActionRequest' }
      responses:
        "200": { description: 退回成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/returns/{returnOrderId}/cancel:
    post:
      tags: [SalesReturn]
      summary: 取消销售退货单
      description: 仅允许 `DRAFT`、`SUBMITTED` 或尚未产生处理数量的 `APPROVED` 进入 `CANCELLED`；取消原因写入 `status_reason`，已生成未确认入库单必须同步取消。部分执行后不得取消。本接口需要 `sales:manage` 权限。
      operationId: salesReturnCancel
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderReasonActionRequest' }
      responses:
        "200": { description: 取消成功, content: { application/json: { schema: { $ref: '#/components/schemas/EmptyResult' } } } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stocks:
    get:
      tags: [WarehouseStock]
      summary: 分页查询当前库存
      description: |
        查询 `warehouse_stock` 当前库存余额，并关联 `product.safety_stock_qty` 用于库存健康判断。
        `availableQty` 由服务层按 `stock_qty - locked_qty` 计算；不同单位的库存数量不得跨产品汇总。
        仓库使用 `warehouseId` 精确匹配，产品编码和产品名称分别使用包含匹配；库存健康与占用情况是两个独立派生维度，多个有效条件按 AND 组合。
        库存健康：`NORMAL` 表示 `available_qty > safety_stock_qty`，`LOW_STOCK` 表示 `0 < available_qty <= safety_stock_qty`，`NO_AVAILABLE` 表示 `stock_qty > 0` 且 `available_qty = 0`，`OUT_OF_STOCK` 表示 `stock_qty = 0`。
        占用情况：`UNLOCKED` 表示 `locked_qty = 0`，`PARTIALLY_LOCKED` 表示 `0 < locked_qty < stock_qty`，`FULLY_LOCKED` 表示 `stock_qty > 0` 且 `locked_qty = stock_qty`。
        上述状态均为查询时派生，不在 `warehouse_stock` 中增加单一状态字段。
        库存余额列表使用无总数分页，后端不需要返回精确 `total`，也不需要为了分页执行额外 `COUNT(*)`；前端只展示当前页、上一页和下一页。
        本接口需要 `warehouse:query` 权限。
      operationId: warehouseStockPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `warehouse_stock.warehouse_id`，使用精确匹配
        - name: productCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 产品编码，对应 `warehouse_stock.product_code`，使用包含匹配
        - name: productName
          in: query
          schema: { type: string, maxLength: 200 }
          description: 产品名称，对应 `warehouse_stock.product_name`，使用包含匹配
        - name: inventoryHealth
          in: query
          schema:
            type: string
            enum: [NORMAL, LOW_STOCK, NO_AVAILABLE, OUT_OF_STOCK]
          description: 库存健康，由可用库存、当前库存和产品安全库存派生
        - name: reservationState
          in: query
          schema:
            type: string
            enum: [UNLOCKED, PARTIALLY_LOCKED, FULLY_LOCKED]
          description: 占用情况，由当前库存和锁定库存派生
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WarehouseStockPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /warehouse/inbound-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询入库单
      description: |
        查询 `inbound_bill` 入库单主表，并按 `inbound_bill_item.inbound_bill_id` 聚合返回明细条数和入库量摘要。
        入库单承接采购入库、销售退货入库和调整入库；采购订单审核后生成 `PENDING_CONFIRM` 入库单，但不直接改变库存。
        系统生成的待确认入库单初始本次入库量为 0 或空业务值，由仓库人员在确认前按实物到货数量填写；确认后剩余未入库由后端按采购数量、累计已入库和本次入库量计算。
        入库列表的“来源对象”列按单据类型显示供应商、客户或调整单的来源仓库；库存调整不自动生成反向入库单或出库单；列表只显示入库量摘要和状态；采购数量、累计已入库、本次入库量和确认后剩余未入库通过详情接口返回，并可在前端展开行中按需展示。
        本接口需要 `warehouse:query` 权限。
      operationId: inboundBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 入库单号，对应 `inbound_bill.inbound_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源单号，对应 `inbound_bill.source_no`，使用包含匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `inbound_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [PURCHASE_IN, SALES_RETURN, ADJUST_IN]
          description: 入库类型，对应 `inbound_bill.inbound_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `inbound_bill.entry_mode`
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED]
          description: 入库单状态，对应 `inbound_bill.status`
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InboundBillPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WarehouseStockBill]
      summary: 新增手工入库单草稿
      description: 创建调整入库或补录采购入库、销售退货入库草稿。保存后不改变库存，确认入库后才生成库存流水。前端必须通过搜索下拉选择来源对象：采购入库选供应商、销售退货选客户、调整入库选来源仓库；`sourcePartyId` 和 `sourcePartyName` 由前端提交，后端直接存入主表快照。本接口需要 `warehouse:manage` 权限。
      operationId: inboundBillCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundBillCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/outbound-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询出库单
      description: |
        查询 `outbound_bill` 出库单主表，并按 `outbound_bill_item.outbound_bill_id` 聚合返回明细条数和出库量摘要。
        出库单承接销售出库、采购退货出库和调整出库；销售订单审核后生成 `PENDING_CONFIRM` 出库单，但不直接扣减库存。
        系统生成的待确认出库单初始本次出库量为 0 或空业务值，由仓库人员在确认前按实物发货数量填写；确认后剩余未出库由后端按销售数量、累计已出库和本次出库量计算。
        出库列表的“来源对象”列按单据类型显示客户、供应商或调整单的来源仓库；库存调整不自动生成反向入库单或出库单；列表只显示出库量摘要和状态；销售数量、累计已出库、本次出库量和确认后剩余未出库通过详情接口返回，并可在前端展开行中按需展示。
        本接口需要 `warehouse:query` 权限。
      operationId: outboundBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 出库单号，对应 `outbound_bill.outbound_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源单号，对应 `outbound_bill.source_no`，使用包含匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `outbound_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [SALES_OUT, PURCHASE_RETURN, ADJUST_OUT]
          description: 出库类型，对应 `outbound_bill.outbound_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `outbound_bill.entry_mode`
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED]
          description: 出库单状态，对应 `outbound_bill.status`
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OutboundBillPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WarehouseStockBill]
      summary: 新增手工出库单草稿
      description: 创建调整出库或补录销售出库、采购退货出库草稿。保存后不改变库存，确认出库后才生成库存流水。前端必须通过搜索下拉选择来源对象：销售出库选客户、采购退货选供应商、调整出库选来源仓库；`sourcePartyId` 和 `sourcePartyName` 由前端提交，后端直接存入主表快照。本接口需要 `warehouse:manage` 权限。
      operationId: outboundBillCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundBillCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询库存流水记录
      description: |
        查询 `stock_bill` 已确认库存流水主表，并按 `stock_bill_item.bill_id` 聚合返回 `itemCount`；列表不跨不同产品单位汇总数量。
        入库单和出库单的创建、编辑、提交与确认使用 `/warehouse/inbound-bills`、`/warehouse/outbound-bills` 及工作单操作接口；本路径只读返回已经确认并实际改变库存的流水事实。
        流水号和来源业务单号分别使用包含匹配，仓库、来源业务类型、出入库类型和录入方式使用精确匹配，多个有效条件按 AND 组合。来源业务类型是由出入库类型稳定推导的展示字段，不作为 `stock_bill` 的持久化列；后端实现 `sourceType` 查询时必须映射为对应的 `billType` 集合后过滤。列表只返回单头和 `itemCount`；需要产品变动前后数量时按流水 ID 调用详情接口，避免分页列表重复携带明细数组。
        入库类型为 `PURCHASE_IN`、`SALES_RETURN`、`ADJUST_IN`；出库类型为 `SALES_OUT`、`PURCHASE_RETURN`、`ADJUST_OUT`。
        本接口只用于追溯库存凭证，需要 `warehouse:query` 权限。
      operationId: stockBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 库存流水号，对应 `stock_bill.bill_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源业务单号，对应 `stock_bill.business_source_no`，使用包含匹配
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [PURCHASE_ORDER, SALES_ORDER, PURCHASE_RETURN_ORDER, SALES_RETURN_ORDER, STOCK_ADJUST]
          description: |
            来源业务类型，精确匹配；这是派生查询参数，不对应 `stock_bill` 持久化列。
            后端实现备注：`PURCHASE_ORDER -> PURCHASE_IN`、`SALES_ORDER -> SALES_OUT`、`PURCHASE_RETURN_ORDER -> PURCHASE_RETURN`、`SALES_RETURN_ORDER -> SALES_RETURN`、`STOCK_ADJUST -> ADJUST_IN/ADJUST_OUT`，再按映射后的 `billType IN (...)` 过滤。
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `stock_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT]
          description: 出入库类型，对应 `stock_bill.bill_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `stock_bill.entry_mode`，使用精确匹配；分别表示系统自动录入、人工补录和人工调整
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockLedgerPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /warehouse/stock-bills/{stockLedgerId}:
    get:
      tags: [WarehouseStockBill]
      summary: 获取库存流水变动明细
