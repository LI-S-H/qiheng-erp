        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Product]
      summary: 编辑产品档案
      description: 产品编码创建后不可修改，编辑请求不接收产品编码；启用产品不能归属停用分类。通过编辑接口停用产品时遵守与状态接口相同的业务规则。本接口需要 `product:manage` 权限。
      operationId: productUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductFormRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Product]
      summary: 删除产品档案
      description: 逻辑删除产品；仍存在未删除的供货关系，或已被库存、采购或销售业务数据引用时返回 409，避免破坏主数据关联和历史业务链路。本接口需要 `product:manage` 权限。
      operationId: productDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /products/{productId}/status:
    patch:
      tags: [Product]
      summary: 修改产品状态
      description: 停用产品后不能用于新建采购单或销售单，历史单据不受影响；启用时必须校验所属分类为启用状态。本接口需要 `product:manage` 权限。
      operationId: productStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories:
    get:
      tags: [ProductCategory]
      summary: 查询产品分类列表
      description: |
        返回 `product_category` 未删除数据的扁平数组，并通过一次可执行的聚合查询返回每个分类直接关联的 `productCount`。
        后端不组装 `children`、上级分类名称或层级路径；前端根据 `parentId` 构建分类树、计算路径。
        支持 `categoryName`、`status` 两个独立查询参数：分类名称使用包含匹配，状态使用精确匹配；多个有效条件按 AND 组合。
        前端必须把有效筛选条件作为查询参数传给后端，不能拉取全量分类后再按名称或状态二次筛选；空字符串、`all` 和未选择状态不得发送。
        命中分类的祖先会与命中行一同返回，便于前端按 `parentId` 计算层级路径；后端不返回预组装的层级路径。
        本接口需要 `product:query` 权限。
      operationId: productCategoryList
      security:
        - SaTokenAuth: []
      parameters:
        - name: categoryName
          in: query
          schema:
            type: string
            maxLength: 100
          description: 分类名称，对应 `product_category.category_name`，提交前由前端去除首尾空格，使用包含匹配；不传表示不过滤名称，前端不得发送空字符串
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
          description: 分类状态，对应 `product_category.status`，精确匹配；不传表示不过滤状态，前端的“全部状态”只作为展示选项，不得发送 `all`
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductCategory' }
              example:
                code: 0
                message: success
                data:
                  - categoryId: "1910000000000000100"
                    parentId: "0"
                    categoryName: 食品饮料
                    status: 1
                    productCount: 0
                    createTime: "2026-06-09 09:10:00"
                    updateTime: "2026-06-12 14:20:00"
                  - categoryId: "1910000000000000101"
                    parentId: "1910000000000000100"
                    categoryName: 饮料冲调
                    status: 1
                    productCount: 18
                    createTime: "2026-06-09 09:20:00"
                    updateTime: "2026-06-12 10:16:00"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ProductCategory]
      summary: 新增产品分类
      description: 同一上级分类下的分类名称不能重复；新增启用分类时，其上级分类必须已启用。本接口需要 `product:manage` 权限。
      operationId: productCategoryCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryCreateRequest' }
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductCategory' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/batch/status:
    patch:
      tags: [ProductCategory]
      summary: 批量修改产品分类状态
      description: 停用父级分类时，后端必须在同一事务内级联停用全部下级分类，并停用当前分类和全部下级分类直接关联的未删除产品；启用分类不会自动重新启用产品。启用下级分类时，其全部上级必须已启用或包含在同一次启用请求中。本接口需要 `product:manage` 权限。
      operationId: productCategoryBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryBatchStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /product/categories/batch/delete:
    post:
      tags: [ProductCategory]
      summary: 批量删除产品分类
      description: 逻辑删除分类；存在下级分类或仍有产品直接关联的分类不能删除。本接口需要 `product:manage` 权限。
      operationId: productCategoryBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryBatchDeleteRequest' }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/{categoryId}:
    get:
      tags: [ProductCategory]
      summary: 获取产品分类详情
      description: 本接口需要 `product:query` 权限。
      operationId: productCategoryDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductCategory' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ProductCategory]
      summary: 编辑产品分类
      description: 禁止把上级分类设置为自身或自身下级；同级分类名称不能重复；通过编辑接口停用分类时必须执行与状态接口相同的下级分类和关联产品级联规则。本接口需要 `product:manage` 权限。
      operationId: productCategoryUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductCategory' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [ProductCategory]
      summary: 删除产品分类
      description: 逻辑删除分类；存在下级分类或仍有产品直接关联时返回 409。本接口需要 `product:manage` 权限。
      operationId: productCategoryDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/{categoryId}/status:
    patch:
      tags: [ProductCategory]
      summary: 修改产品分类状态
      description: 停用父级分类时，后端必须在同一事务内级联停用全部下级分类和关联产品；上级分类停用时禁止单独启用下级分类。启用分类不会自动重新启用产品。本接口需要 `product:manage` 权限。
      operationId: productCategoryStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    SaTokenAuth:
      type: apiKey
      in: header
      name: satoken
      description: Sa-Token 原始 token。当前默认请求头为 satoken，实际调用以前端登录响应中的 tokenName 为准
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: 用户 ID，对应 `sys_user.id`
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: 角色 ID，对应 `sys_role.id`
    DeptId:
      name: deptId
      in: path
      required: true
      schema:
        type: string
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
      description: 权限 ID，对应 `sys_permission.id`
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
      description: 产品分类 ID，对应 `product_category.id`
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: 产品 ID，对应 `product.id`
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        type: string
      description: 仓库 ID，对应 `warehouse.id`
    StockBillId:
      name: stockBillId
      in: path
      required: true
      schema:
        type: string
      description: 入库单、出库单或库存流水 ID，BIGINT 按字符串传输
    InboundBillId:
      name: inboundBillId
      in: path
      required: true
      schema:
        type: string
      description: 入库单 ID，对应 `inbound_bill.id`，BIGINT 按字符串传输
    OutboundBillId:
      name: outboundBillId
      in: path
      required: true
      schema:
        type: string
      description: 出库单 ID，对应 `outbound_bill.id`，BIGINT 按字符串传输
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
      description: 供应商 ID，对应 `supplier.id`，BIGINT 按字符串传输
    SupplierProductId:
      name: supplierProductId
      in: path
      required: true
      schema:
        type: string
      description: 供应商供货产品 ID，对应 `supplier_product.id`，BIGINT 按字符串传输
    PurchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema:
        type: string
      description: 采购订单 ID，对应 `purchase_order.id`，BIGINT 按字符串传输
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      description: 客户 ID，对应 `customer.id`，BIGINT 按字符串传输
    SalesOrderId:
      name: salesOrderId
      in: path
      required: true
      schema:
        type: string
      description: 销售订单 ID，对应 `sales_order.id`，BIGINT 按字符串传输
  responses:
    StockBillDetailSuccess:
      description: 单据详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Result'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/StockBillDetail' }
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Unauthorized:
      description: 未登录或登录态已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Forbidden:
      description: 没有访问权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    NotFound:
      description: 数据不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Conflict:
      description: 唯一字段冲突，例如登录账号或角色编码已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    ServiceUnavailable:
      description: AI 模型或受控业务 Tool 尚未启用或临时不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    AiAssistantOverview:
      type: object
      required: [refreshedAt, quickPrompts, conversations]
      properties:
        refreshedAt: { type: string, description: 概览刷新时间，后端生成 }
        quickPrompts:
          type: array
          description: 参数化快捷任务。前端点击后展示参数弹窗，确认后发送由后端可识别的完整提示词，但对话中只显示任务卡片。调拨类快捷任务不得要求用户填写预测天数，应基于已完成销量预测、库存缺口和跨仓可用库存生成调出仓、调入仓和调拨数量建议。
          items: { $ref: '#/components/schemas/AiQuickPrompt' }
        conversations:
          type: array
          description: 当前用户最近的会话摘要，用于左侧会话管理
          items: { $ref: '#/components/schemas/AiConversationSummary' }

    AiConversationSummary:
      type: object
      required: [conversationId, title, description, updatedAt]
      properties:
        conversationId: { type: string, description: 会话 ID }
        title: { type: string, description: 会话标题 }
        description: { type: string, description: 会话摘要 }
        updatedAt: { type: string, description: 最近更新时间 }

    AiConversationUpdateRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 40, description: 会话标题；前端提交前 trim }

    AiConversationMessagePage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/AiChatMessage' }
        total: { type: integer, minimum: 0, description: 当前用户该会话的未删除消息总数 }
        hasNext: { type: boolean, description: 可选兼容字段；未返回时前端根据 total、pageNum 和 pageSize 判断 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }

    AiAgentProfile:
      type: object
      required: [agentCode, agentName, role, description, status]
      properties:
        agentCode: { type: string, description: 智能体编码 }
        agentName: { type: string, description: 智能体名称 }
        role:
          type: string
          enum: [ROUTER, ANALYSIS, PURCHASE, INVENTORY, SALES, SUPPLIER]
          description: 智能体角色；主控智能体使用 `ROUTER`
        description: { type: string, description: 智能体职责说明 }
        status: { type: string, enum: [ONLINE, BUSY, IDLE], description: 展示状态 }

    AiQuickPrompt:
      type: object
      required: [promptId, title, description, intentCode, promptTemplate, fields]
      description: |
        快捷分析入口配置。每个入口应落到明确业务下一步，例如库存筛选、采购草稿、调拨草稿、锁定库存复核或预测报告。
        `transfer`/调拨类入口的 `fields` 只采集调拨商品和参与仓库，不采集 `DAYS`；预测窗口由销量预测智能体结果或后端任务上下文提供。
      properties:
        promptId: { type: string, description: 快捷提示稳定标识 }
        title: { type: string, description: 快捷提示标题 }
        description: { type: string, description: 快捷提示说明 }
        intentCode: { type: string, description: 建议触发的多智能体任务编码，仅用于后端路由或观测，不允许前端绕过后端校验直接执行 }
        promptTemplate: { type: string, description: "后端可识别的提示词模板，使用 `{{fieldKey}}` 占位" }
        fields:
          type: array
          description: 前端需要用户填写的参数字段；调拨类快捷任务禁止返回预测天数字段
          items: { $ref: '#/components/schemas/AiPromptField' }
        actionPreview:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiActionPreview'
          description: 可选的受控下一步预览；缺失或校验失败时前端不得自行按标题或提示词推断动作

    AiPromptField:
      type: object
      required: [fieldKey, label, fieldType, required, placeholder, defaultValue]
      properties:
        fieldKey: { type: string, description: 字段键，对应 promptTemplate 占位符 }
        label: { type: string, description: 表单标签 }
        fieldType: { type: string, enum: [PRODUCT_MULTI, WAREHOUSE_MULTI, DAYS, TEXT], description: 字段控件类型 }
        required: { type: boolean, description: 是否必填 }
        placeholder: { type: string, description: 占位提示 }
        defaultValue:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: 默认值；多选字段使用字符串数组

    AiContextSource:
      type: object
      required: [sourceId, sourceType, title, description, freshness]
      properties:
        sourceId: { type: string, description: 上下文来源稳定标识 }
        sourceType: { type: string, enum: [TOOL, WORKFLOW, KNOWLEDGE, TASK], description: 来源类型 }
        title: { type: string, description: 来源标题 }
        description: { type: string, description: 来源说明 }
        freshness: { type: string, description: 数据新鲜度或索引状态文案 }

    AiChartSpec:
      type: object
      required: [chartId, type, title, description, xField, yFields, nameField, valueField, data]
      description: |
        AI 回复或任务执行结果附带的图表规格。后端只返回图表语义、字段映射和已经由业务 Tool/Service 计算出的数据行，不返回图片或前端样式。
        `line`/`bar` 使用 `xField` 和 `yFields`；`pie` 使用 `nameField` 和 `valueField`。字段名必须能在 `data` 行中找到。
        `fieldLabels` 用于声明图例名称，例如 `{ "forecastQty": "预测销量", "safetyStockQty": "安全库存" }`；`yUnit` 用于声明 Y 轴单位，例如 `件`、`卷`、`%`、`元`。折线图和柱状图的 Y 轴刻度、网格线、柱形底线和折线样式由前端统一渲染；后端只负责保证数值字段为可解析数字。锁定库存处理建议应优先返回按来源单据或商品展开的 `bar` 数据，不使用饼图掩盖具体处理对象。
      properties:
        chartId: { type: string, description: 图表稳定 ID }
        type: { type: string, enum: [line, bar, pie], description: 图表类型 }
        title: { type: string, description: 图表标题 }
        description: { type: string, description: 图表说明或口径备注，可为空字符串 }
        xField:
          type: string
          nullable: true
          description: 折线图/柱状图横轴字段；饼图返回 `null`
        yFields:
          type: array
          description: 折线图/柱状图数值字段，可支持多条折线；饼图返回空数组
          items: { type: string }
        fieldLabels:
          type: object
          additionalProperties: { type: string }
          description: 可选。数值字段到中文图例名称的映射；未返回时前端可按字段名兜底展示
        yUnit:
          type: string
          nullable: true
          description: 可选。Y 轴单位，例如 `件`、`卷`、`%`、`元`；前端用于坐标轴单位和数值格式化
        nameField:
          type: string
          nullable: true
          description: 饼图分类字段；折线图/柱状图返回 `null`
        valueField:
          type: string
          nullable: true
          description: 饼图数值字段；折线图/柱状图通常返回 `null`
        data:
          type: array
          description: 图表数据行。每行只允许字符串、数字或 null；数字必须由后端业务服务计算，不能由大模型编造
          items:
            type: object
            additionalProperties: true

    AiChatStreamEvent:
      type: object
      required: [requestId, eventType, conversationId]
      description: |
        智能经营助手流式响应事件。`MESSAGE_DELTA` 只承载文本增量；`MESSAGE_FINAL` 必须承载完整 `AiChatMessage`，前端以最终消息中的 charts/sources/actionCards 为准渲染结构化内容。
      properties:
        requestId: { type: string, description: 本次请求 ID }
        eventType: { type: string, enum: [MESSAGE_DELTA, MESSAGE_FINAL, ERROR], description: 流式事件类型 }
        conversationId: { type: string, description: 会话 ID }
        contentDelta: { type: string, description: 文本增量，仅 MESSAGE_DELTA 使用 }
        message:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiChatMessage'
          description: 完整助手消息，仅 MESSAGE_FINAL 使用
        errorMessage: { type: string, description: 错误信息，仅 ERROR 使用 }

    AiChatRequest:
      type: object
      required: [message]
      properties:
        conversationId:
          type: string
          nullable: true
          description: 会话 ID；新会话传 `null`，已有会话传后端返回值
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: 用户输入的经营问题或指令；前端提交前 trim，空字符串不提交

    AiChatResponse:
      type: object
      required: [conversationId, message]
      properties:
        conversationId: { type: string, description: 会话 ID }
        message: { $ref: '#/components/schemas/AiChatMessage' }

    AiChatMessage:
      type: object
      required: [messageId, role, content, createdAt, charts, actionCards, sources, agentTraces, taskCard]
      properties:
        messageId: { type: string, description: 消息 ID }
        role: { type: string, enum: [assistant, user], description: 消息角色 }
        content: { type: string, description: 消息正文；后端应返回经过权限裁剪和必要脱敏后的内容 }
        createdAt: { type: string, description: 消息创建时间 }
        charts:
          type: array
          description: 随消息附带的图表规格；后端返回数据和字段映射，前端负责渲染。没有图表时返回空数组。流式场景下只在 `MESSAGE_FINAL` 返回完整数组
          items: { $ref: '#/components/schemas/AiChartSpec' }
        actionCards:
          type: array
          description: 助手建议的可执行动作。写业务数据的动作只能是草稿、预览或跳转，不能直接提交正式业务单据；调拨建议在独立调拨单接口接入前可落到调出/调入库存草稿
          items: { $ref: '#/components/schemas/AiActionCard' }
        sources:
          type: array
          description: 本轮回复实际使用的 Tool、知识库或任务上下文来源；页面可不展示，但后端应保留用于追溯
          items: { $ref: '#/components/schemas/AiContextSource' }
        agentTraces:
          type: array
          description: 本轮多智能体协同轨迹，用于展示主控智能体如何分派专家智能体
          items: { $ref: '#/components/schemas/AiAgentTrace' }
        taskCard:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiTaskCard'
          description: 用户通过常用任务发起分析时的对话卡片；普通文本消息返回 `null`
        workbench:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiAssistantWorkbench'
          description: 后端业务 Tool 生成并校验的只读工作框；未接入真实 Tool 时返回 `null` 或不返回，前端不得从自然语言补造

    AiTaskCard:
      type: object
      required: [title, description, parameters]
      properties:
        title: { type: string, description: 任务卡片标题 }
        description: { type: string, description: 任务卡片说明 }
        parameters:
          type: array
          description: 前端展示的参数摘要，不包含完整隐藏提示词
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }

    AiAgentTrace:
      type: object
      required: [traceId, agentCode, agentName, summary, status]
      properties:
        traceId: { type: string, description: 协同轨迹 ID }
        agentCode: { type: string, description: 智能体编码 }
        agentName: { type: string, description: 智能体名称 }
        summary: { type: string, description: 该智能体本轮处理摘要 }
        status: { type: string, enum: [PLANNED, RUNNING, DONE, FAILED], description: 协同步骤状态 }

    AiActionCard:
      type: object
      required: [actionId, title, description, actionType, route, riskLevel]
      properties:
        actionId: { type: string, description: 动作稳定标识 }
        title: { type: string, description: 动作标题 }
        description: { type: string, description: 动作说明 }
        actionType: { type: string, enum: [NAVIGATE, WORKFLOW, PREVIEW], description: 动作类型；`WORKFLOW` 保留为兼容命名，实际表示触发受控多智能体任务 }
        route:
          type: string
          nullable: true
          description: 前端内部跳转路由；非跳转动作返回 `null`
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH], description: 动作风险等级；中高风险动作前端应展示确认或进入业务草稿页面 }
        preview:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AiActionPreview'
          description: 受控动作预览；为空时只能按 route 导航，不能在前端生成业务载荷

    AiActionPreview:
      type: object
      required: [title, description, steps, route, confirmLabel]
      properties:
        title: { type: string }
        description: { type: string }
        steps:
          type: array
          items: { type: string }
        route: { type: string, nullable: true, description: 仅允许应用内部路由 }
        confirmLabel: { type: string }

    AiAssistantWorkbench:
      type: object
      required: [workbenchId, title, description, workbenchType, route, lines, sections]
      description: |
        只读业务建议 DTO，必须由后端受控 Tool/Service 查询并校验后生成。当前采购、仓储业务 Service 尚未接入 AI 动作执行，前端只能预览或导航，不得直接调用业务写接口。
      properties:
        workbenchId: { type: string }
        title: { type: string }
        description: { type: string }
        workbenchType: { type: string, enum: [PURCHASE_DRAFT, TRANSFER_DRAFT, LOCK_RELEASE, STOCK_FILTER] }
        route: { type: string, nullable: true, description: 仅允许应用内部路由 }
        lines:
          type: array
          items: { $ref: '#/components/schemas/AiWorkbenchLine' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/AiWorkbenchSection' }

    AiWorkbenchLine:
      type: object
      required: [lineId, productId, productName, warehouseId, warehouseName, suggestedQty, reason]
      properties:
        lineId: { type: string }
        productId: { type: string, description: 由后端业务 Service 校验后的产品 ID }
        productName: { type: string }
        warehouseId: { type: string, description: 由后端业务 Service 校验后的仓库 ID }
        warehouseName: { type: string }
        suggestedQty: { type: number, minimum: 0, exclusiveMinimum: true }
        reason: { type: string }
        supplierProductId: { type: string, nullable: true }
        supplierId: { type: string, nullable: true }
        supplierName: { type: string, nullable: true }
        unitPrice: { type: string, nullable: true, pattern: '^\d+(\.\d{1,2})?$', description: 建议单价金额字符串；交易金额按分存储，避免 JSON number 丢失精度 }
        selectedSupplierScore: { type: number, minimum: 0, maximum: 100, nullable: true }
        targetWarehouseId: { type: string, nullable: true }
        targetWarehouseName: { type: string, nullable: true }

    AiWorkbenchSection:
      type: object
      required: [title, items]
      properties:
        title: { type: string }
        items:
          type: array
          items: { type: string }

    AiScheduledTaskPage:
      type: object
      required: [refreshedAt, summary, templates, tasks, recentExecutions]
      properties:
        refreshedAt: { type: string, description: 任务中心刷新时间 }
        summary: { $ref: '#/components/schemas/AiScheduledTaskSummary' }
        templates:
          type: array
          description: 内置任务模板，前端可一键带入新增任务表单
          items: { $ref: '#/components/schemas/AiScheduledTaskTemplate' }
        tasks:
          type: array
          description: 当前已配置的经营任务
          items: { $ref: '#/components/schemas/AiScheduledTask' }
        recentExecutions:
          type: array
          description: 最近执行记录，用于前端展示运行结果和失败状态
          items: { $ref: '#/components/schemas/AiTaskExecution' }

    AiScheduledTaskSummary:
      type: object
      required: [totalCount, enabledCount, failedCount, nextRunCount]
      properties:
        totalCount: { type: integer, minimum: 0, description: 任务总数 }
        enabledCount: { type: integer, minimum: 0, description: 已启用任务数 }
        failedCount: { type: integer, minimum: 0, description: 最近处于失败状态的任务数 }
        nextRunCount: { type: integer, minimum: 0, description: 已排入后续调度的任务数 }

    AiScheduledTaskTemplate:
      type: object
      required: [templateId, taskName, category, frequency, description, defaultCronExpression, agentCodes, defaultProductScope, defaultWarehouseScope, defaultAnalysisGoal, outputFormat]
      properties:
        templateId: { type: string, description: 模板 ID }
        taskName: { type: string, description: 模板任务名称 }
        category: { $ref: '#/components/schemas/AiScheduledTaskCategory' }
        frequency: { $ref: '#/components/schemas/AiScheduledTaskFrequency' }
        description: { type: string, description: 模板说明 }
        defaultCronExpression: { type: string, description: 默认 cron 表达式 }
        agentCodes:
          type: array
          description: 默认参与的智能体编码
          items: { type: string }
        defaultProductScope:
          type: array
          description: 模板默认关注商品
          items: { type: string }
        defaultWarehouseScope:
          type: array
          description: 模板默认关注仓库
          items: { type: string }
        defaultAnalysisGoal: { type: string, description: 模板默认分析目标 }
        outputFormat: { $ref: '#/components/schemas/AiScheduledTaskOutputFormat' }

    AiScheduledTask:
      type: object
      required: [taskId, taskName, category, frequency, cronExpression, productIds, warehouseIds, recipientRoleIds, productScope, warehouseScope, analysisGoal, nextRunAt, lastRunAt, lastResultSummary, recipients, status, agentCodes, painPoint, outputFormat, editable]
      properties:
        taskId: { type: string, description: AI 任务 ID，BIGINT 或稳定编码按字符串传输 }
        taskName: { type: string, description: 任务名称 }
        category: { $ref: '#/components/schemas/AiScheduledTaskCategory' }
        frequency: { $ref: '#/components/schemas/AiScheduledTaskFrequency' }
        cronExpression: { type: string, description: cron 表达式，由后端调度器解析 }
        productIds:
          type: array
          description: 任务关注产品的稳定 ID；空数组表示不限制产品
          items: { type: string }
        warehouseIds:
          type: array
          description: 任务关注仓库的稳定 ID；空数组表示不限制仓库
          items: { type: string }
        recipientRoleIds:
          type: array
          description: 接收任务结果的角色稳定 ID
          items: { type: string }
        productScope:
          type: array
          readOnly: true
          description: 由 `productIds` 解析得到的产品展示名称
          items: { type: string }
        warehouseScope:
          type: array
          readOnly: true
          description: 由 `warehouseIds` 解析得到的仓库展示名称
          items: { type: string }
        analysisGoal: { type: string, description: 分析目标，由用户配置；后端用于构造多智能体任务上下文 }
        nextRunAt: { type: string, description: 下次执行时间 }
        lastRunAt:
          type: string
          nullable: true
          description: 最近执行时间；从未执行返回 `null`
        lastResultSummary: { type: string, description: 最近执行结果摘要，不保存大量明细 }
        recipients:
          type: array
          readOnly: true
          description: 由 `recipientRoleIds` 解析得到的角色展示名称
          items: { type: string }
        status: { type: string, enum: [ENABLED, DISABLED, RUNNING, FAILED], description: 任务状态 }
        agentCodes:
          type: array
          description: 参与该任务的智能体编码
          items: { type: string }
        painPoint: { type: string, description: 任务解决的 ERP 使用者痛点，用于页面解释 }
        outputFormat: { $ref: '#/components/schemas/AiScheduledTaskOutputFormat' }
        editable: { type: boolean, description: 当前用户是否可编辑该任务配置 }

    AiTaskExecution:
      type: object
      required: [executionId, taskId, taskName, startedAt, finishedAt, status, resultSummary, agents, findings, suggestions, metrics, charts, nextActions]
      properties:
        executionId: { type: string, description: 执行记录 ID }
        taskId: { type: string, description: 任务 ID }
        taskName: { type: string, description: 任务名称快照 }
        startedAt: { type: string, description: 开始时间 }
        finishedAt:
          type: string
          nullable: true
          description: 结束时间；执行中返回 `null`
        status: { type: string, enum: [SUCCESS, FAILED, RUNNING], description: 执行状态 }
        resultSummary: { type: string, description: 执行结果摘要 }
        agents:
          type: array
          description: 本次实际参与的智能体名称快照
          items: { type: string }
        findings:
          type: array
          description: 关键发现，页面在执行结果详情中展示
          items: { type: string }
        suggestions:
          type: array
          description: 建议动作，页面在执行结果详情中展示
          items: { type: string }
        metrics:
          type: array
          description: 执行报告顶部指标
          items: { $ref: '#/components/schemas/AiTaskExecutionMetric' }
        charts:
          type: array
          description: 任务结果附带图表规格；没有图表时返回空数组
          items: { $ref: '#/components/schemas/AiChartSpec' }
        nextActions:
          type: array
          description: 报告建议用户跳转处理的业务入口
          items: { $ref: '#/components/schemas/AiTaskExecutionAction' }

    AiTaskExecutionMetric:
      type: object
      required: [label, value, tone]
      properties:
        label: { type: string, description: 指标名称 }
        value: { type: string, description: 指标展示值 }
        tone: { type: string, enum: [neutral, good, watch, risk], description: 指标视觉语义 }

    AiTaskExecutionAction:
      type: object
      required: [actionId, title, description, route]
      properties:
        actionId: { type: string, description: 动作 ID }
        title: { type: string, description: 动作标题 }
        description: { type: string, description: 动作说明 }
        route:
          type: string
          nullable: true
          description: 前端路由；仅跳转到业务模块，不直接写业务数据

    AiScheduledTaskUpdateRequest:
      type: object
      required: [taskName, category, frequency, cronExpression, productIds, warehouseIds, recipientRoleIds, analysisGoal, outputFormat]
      properties:
        taskName: { type: string, minLength: 1, maxLength: 100, description: 任务名称 }
        category: { $ref: '#/components/schemas/AiScheduledTaskCategory' }
        frequency: { $ref: '#/components/schemas/AiScheduledTaskFrequency' }
        cronExpression: { type: string, minLength: 1, maxLength: 100, description: cron 表达式 }
        productIds:
          type: array
          description: 关注产品稳定 ID；复用产品分页查询结果，不提交名称
          items: { type: string }
        warehouseIds:
          type: array
          description: 关注仓库稳定 ID；复用仓库分页查询结果，不提交名称
          items: { type: string }
        recipientRoleIds:
          type: array
          description: 接收角色稳定 ID；复用系统角色 options 接口，不提交角色名称
          items: { type: string }
        analysisGoal: { type: string, minLength: 1, maxLength: 1000, description: 分析目标 }
        outputFormat: { $ref: '#/components/schemas/AiScheduledTaskOutputFormat' }

    AiScheduledTaskStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ENABLED, DISABLED]
          description: 目标任务状态；前端启停开关只提交这两个状态，`RUNNING` 和 `FAILED` 由后端执行状态产生

    AiScheduledTaskRunAccepted:
      type: object
      required: [executionId, taskId, status, acceptedAt]
      properties:
        executionId: { type: string, description: 本次异步执行记录稳定 ID }
        taskId: { type: string, description: 被执行任务稳定 ID }
        status: { type: string, enum: [RUNNING] }
        acceptedAt: { type: string, description: 后端受理时间 }

    AiScheduledTaskCategory:
      type: string
      enum: [REPORT, INVENTORY, PURCHASE, SALES, SUPPLIER]
      description: 经营任务分类

    AiScheduledTaskFrequency:
      type: string
      enum: [DAILY, WEEKLY, MONTHLY]
      description: 经营任务频率

    AiScheduledTaskOutputFormat:
      type: string
      enum: [CHAT_CARD, REPORT]
      description: 任务输出形态；页面报告用于任务中心完整阅读，对话卡片用于助手会话摘要

    DashboardInventoryStatus:
      type: object
      required: [distribution, riskPreview, access]
      properties:
        distribution:
          type: array
          minItems: 4
          maxItems: 4
          description: One bucket per inventory-health state, empty when access.state is DENIED. Every count is a warehouse-product inventory record count, not a distinct product count.
          items:
            type: object
            required: [status, recordCount]
            properties:
              status: { type: string, enum: [NORMAL, LOW_STOCK, NO_AVAILABLE, OUT_OF_STOCK] }
              recordCount: { type: integer, format: int64, minimum: 0 }
        riskPreview:
          type: object
          required: [items, hasMore]
          properties:
            items:
              type: array
              maxItems: 5
              items: { $ref: '#/components/schemas/DashboardInventoryRiskPreviewItem' }
            hasMore: { type: boolean, description: True when the filtered result has more than the returned five records. }
        access: { $ref: '#/components/schemas/DashboardSectionAccess' }

    DashboardInventoryRiskPreviewItem:
      type: object
      required: [stockId, productCode, productName, warehouseName, unitName, quantityPrecision, availableQty, safetyStockQty, severity]
      properties:
        stockId: { type: string, description: Corresponding warehouse_stock.id; BIGINT is serialized as a string. }
        productCode: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 200 }
        warehouseName: { type: string, maxLength: 100 }
        unitName: { type: string, maxLength: 32 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 取自 product.quantity_precision；前端按此固定展示可用库存和安全库存的小数位 }
        availableQty: { type: number, format: double, minimum: 0, description: Derived from stock_qty - locked_qty. }
        safetyStockQty: { type: number, format: double, minimum: 0 }
        severity:
          type: string
          enum: [OUT_OF_STOCK, NO_AVAILABLE, LOW_STOCK]
          description: OUT_OF_STOCK means stock_qty=0; NO_AVAILABLE means stock_qty>0 and available_qty<=0; LOW_STOCK means 0<available_qty<=safety_stock_qty.
    DashboardOverview:
      type: object
      required: [refreshedAt, pendingCount, metrics, trend, todos, stockAlerts, orderStages, orderStagePeriod, topProducts, supplierPerformance, access]
      properties:
        refreshedAt:
          type: string
          description: 工作台数据刷新时间，后端生成
        pendingCount:
          type: integer
          minimum: 0
          description: |
            权限裁剪和业务去重后的待处理事项总量，由后端基于 `todos` 聚合累加；
            顶栏铃铛直接复用本字段显示徽标数字，不再调用独立通知接口。
        metrics:
          type: array
          description: 首屏经营指标，按当前用户权限裁剪；无权子项的 value、changeRate、compareText 显式返回 null，具体状态见 access.metrics
          items: { $ref: '#/components/schemas/DashboardMetric' }
        trend:
          type: array
          description: |
            近 30 日经营趋势，销售额、采购额和毛利额均来自可执行聚合查询；
            完全无 sales:query 与 purchase:query 时返回空数组，前端应整卡降级。
            前端在工作台卡片内提供 7 天、15 天、30 天切换，只做本地截取、
            x 轴标签降密和轻量过渡，不额外调用详情接口。
          items: { $ref: '#/components/schemas/DashboardTrendPoint' }
        access:
          allOf:
            - $ref: '#/components/schemas/DashboardOverviewAccess'
          description: |
            除经营趋势外，各指标与业务面板的访问状态。前端必须以该对象渲染，不能用 0 或空数组推断权限。
            DENIED 时指标 value、changeRate、compareText 为 null，列表仅返回空数组；EMPTY 表示已获准范围暂无数据；ALLOWED 表示已返回当前账号可查看口径的数据。
        trendPermissions:
          allOf:
            - $ref: '#/components/schemas/DashboardTrendPermissions'
          description: |
            经营趋势可见维度标记；前端按其决定哪些 series 渲染；
            旧版本接口不返回时前端回退为全 true。
        todos:
          type: array
          description: |
            当前用户需要优先处理的业务待办完整数组。前端主卡展示前 8 条，详情弹窗展示本接口返回的全部待办。
            待办可以来自单据状态机、库存风险、价格偏离、客户信用、系统异常或其他需要人工审核/人工复核/系统追踪的业务事件。AI/MCP 调用失败、消息队列死信、第三方回调失败、定时任务失败和数据补偿失败等系统问题应统一聚合为 `SYSTEM_EXCEPTION` 待办。
            业务类待办按 manage / query 权限裁剪；系统异常依赖 `dashboard:exception:query`。
          items: { $ref: '#/components/schemas/DashboardTodoItem' }
        stockAlerts:
          type: array
          description: 库存风险 SKU 完整数组，来自 `warehouse_stock` 可用库存和产品安全库存的派生判断；工作台主页表格展示该数组
          items: { $ref: '#/components/schemas/DashboardStockAlert' }
        orderStages:
          type: array
          description: |
            仅统计 orderStagePeriod 所定义的本自然月内新建的采购单和销售单，按其当前状态聚合。
            完全无权时返回空数组，前端应整卡降级；仅在工作台主卡展示全部阶段，不提供详情弹窗。
          items: { $ref: '#/components/schemas/DashboardOrderStage' }
        orderStagePeriod:
          allOf:
            - $ref: '#/components/schemas/DashboardOrderStagePeriod'
          description: 订单流转实际统计期间；前端按 type 显示“当月”口径，startAt/endAtExclusive 用于接口对账。
        orderStagePermissions:
          allOf:
            - $ref: '#/components/schemas/DashboardOrderStagePermissions'
          description: 订单流转可见维度标记；旧版本接口不返回时前端回退为全 true。
        topProducts:
          type: array
          description: 近 30 日销售商品排行完整数组，按 `salesAmount` 降序返回；前端主卡展示前 5 名，详情弹窗展示全部
          items: { $ref: '#/components/schemas/DashboardTopProduct' }
        supplierPerformance:
          type: array
          description: 核心供应商履约表现完整数组，按综合履约表现降序返回；前端主卡展示前 5 名，详情弹窗展示全部
          items: { $ref: '#/components/schemas/DashboardSupplierPerformance' }

    DashboardOverviewAccess:
      type: object
      required: [metrics, todos, stockAlerts, orderStages, topProducts, supplierPerformance]
      properties:
        metrics:
          type: object
          required: [MONTH_SALES, MONTH_GROSS_PROFIT, PENDING_ORDERS, STOCK_RISK_SKU]
          additionalProperties: { $ref: '#/components/schemas/DashboardSectionAccess' }
          properties:
            MONTH_SALES: { $ref: '#/components/schemas/DashboardSectionAccess' }
            MONTH_GROSS_PROFIT: { $ref: '#/components/schemas/DashboardSectionAccess' }
            PENDING_ORDERS: { $ref: '#/components/schemas/DashboardSectionAccess' }
            STOCK_RISK_SKU: { $ref: '#/components/schemas/DashboardSectionAccess' }
        todos: { $ref: '#/components/schemas/DashboardSectionAccess' }
        stockAlerts: { $ref: '#/components/schemas/DashboardSectionAccess' }
        orderStages: { $ref: '#/components/schemas/DashboardSectionAccess' }
        topProducts: { $ref: '#/components/schemas/DashboardSectionAccess' }
        supplierPerformance: { $ref: '#/components/schemas/DashboardSectionAccess' }

    DashboardSectionAccess:
      type: object
      required: [state]
      description: 工作台统一状态。DENIED 不泄露未授权数据；EMPTY 表示当前授权范围暂无数据；ALLOWED 表示已返回当前账号可查看口径的数据。
      properties:
        state:
          type: string
          enum: [ALLOWED, EMPTY, DENIED]
    DashboardTrendPermissions:
      type: object
      description: |
        经营趋势可见维度标记，由后端按当前用户的 `sales:query` /
        `purchase:query` 计算下发。前端根据本对象决定哪些 series 渲染；
        两边都不可见时前端应整卡降级为"暂无访问权限"占位，不渲染图表。
      required: [canViewSales, canViewPurchase, canViewGross]
      properties:
        canViewSales:
          type: boolean
          description: 是否可见销售曲线；对应 `sales:query` 权限
        canViewPurchase:
          type: boolean
          description: 是否可见采购曲线；对应 `purchase:query` 权限
        canViewGross:
          type: boolean
          description: 是否可见毛利曲线；同时需要 `sales:query` 与 `purchase:query` 才为 true

    DashboardOrderStagePeriod:
      type: object
      required: [type, startAt, endAtExclusive]
      description: 订单流转实际统计期间，采用左闭右开边界。
      properties:
        type: { type: string, enum: [CURRENT_CALENDAR_MONTH], description: 当前自然月 }
        startAt: { type: string, format: date-time, description: 统计起始时间（含） }
        endAtExclusive: { type: string, format: date-time, description: 统计结束时间（不含） }

    DashboardOrderStagePermissions:
      type: object
      description: |
        订单流转可见维度标记，由后端按当前用户的 `purchase:query` /
        `sales:query` 计算下发。前端根据本对象决定图例、计数和条形按列裁剪；
        两边都不可见时前端应整卡降级为"暂无访问权限"占位。
      required: [canViewPurchase, canViewSales]
      properties:
        canViewPurchase:
          type: boolean
          description: 是否可见采购订单流转；对应 `purchase:query` 权限
        canViewSales:
          type: boolean
          description: 是否可见销售订单流转；对应 `sales:query` 权限

    DashboardMetric:
      type: object
      required: [key, label, value, unit, changeRate, compareText, status]
      properties:
        key:
          type: string
          enum: [MONTH_SALES, MONTH_GROSS_PROFIT, PENDING_ORDERS, STOCK_RISK_SKU]
          description: 指标稳定编码，前端不得依据中文 label 判断业务含义。
        label: { type: string, description: 指标名称，后端按工作台展示口径返回 }
        value:
          type: number
          format: double
          nullable: true
          description: 指标数值；毛利额允许为负数表示亏损。对应 access 为 DENIED 时必须为 null，不能钳制为 0。
        unit: { type: string, description: 指标单位，例如 `元`、`单`、`个` }
        changeRate:
          type: number
          format: double
          nullable: true
          description: |
            对比周期变化率，单位为百分比数值，公式为（本期 - 上期）/ abs(上期) × 100；保留正负号，前端不得重新计算。
            上期缺失、聚合失败，或上期为 0 且本期非 0 时不可比较，返回 null；上期与本期均为 0 时返回 0。
            因此亏损从 -100 收窄至 -50 时返回 +50，跨零从 -100 变为 50 时返回 +150。
            `PENDING_ORDERS` 按当前用户可见的采购待审、销售待审、待确认入库、待确认出库来源组合，与昨日同一来源组合的快照比较；不使用全公司总数替代受限账号的基线。
        compareText:
          type: string
          nullable: true
          description: 对比周期文案；无权限或不展示环比时返回 null。
        status:
          type: string
          enum: [good, watch, risk, neutral]
          description: |
            指标趋势语义，仅用于数值下方的环比徽标：good 绿色、watch 琥珀色、risk 红色、neutral 灰色。
            正向指标（销售额、毛利额）上升为改善；反向指标（待处理订单、库存风险 SKU）下降为改善。
            变化幅度按指标方向折算后，绝对值大于等于 5% 时为 good 或 risk，0 为 neutral，其余非零为 watch；changeRate 为 null 时返回 neutral，前端不显示方向和百分比徽标，但可展示“暂无可比基线”的中性提示。
    DashboardTrendPoint:
      type: object
      required: [date, salesAmount, purchaseAmount, grossMarginAmount]
      properties:
        date: { type: string, description: 趋势日期标签，建议使用 `MM-DD` }
        salesAmount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$', description: 净销售额聚合金额字符串；已审核销售订单金额减去按退货审批日期归属的已审批销售退货金额，允许为负数 }
        purchaseAmount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$', description: 净采购额聚合金额字符串；已审核采购订单金额减去按退货审批日期归属的已审批采购退货金额，允许为负数 }
        grossMarginAmount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$', description: 毛利额字符串；净销售额减净采购额，允许负值 }

    DashboardTodoItem:
      type: object
      required: [todoId, businessType, businessLabel, title, description, count, priority, sortWeight, completionMode, resolveHint, detail]
      properties:
        todoId: { type: string, description: 待办项稳定标识 }
        businessType: { type: string, description: 待办所属业务域或事件源编码，例如 `PURCHASE`、`SALES`、`WAREHOUSE`、`INVENTORY`、`SYSTEM` }
        businessLabel: { type: string, description: 待办类型展示标签 }
        title: { type: string, description: 待办标题 }
        description: { type: string, description: 待办业务影响说明 }
        count: { type: integer, minimum: 0, description: 待处理数量 }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW], description: 待办优先级 }
        sortWeight: { type: integer, minimum: 0, description: 同一优先级内的排序权重，数值越小越靠前 }
        completionMode: { type: string, enum: [AUTO, TRACKED], description: "AUTO 表示可前往对应业务列表处理；TRACKED 表示仅查看异常详情，由异常中心处理" }
        resolveHint: { type: string, nullable: true, description: 处理建议；普通业务待办说明完成条件，系统异常可为 null }
        detail:
          description: 详情由 `model` 判别。前端必须按对应模型的固定字段布局展示，不得依赖拼接文本或通用键值指标。
          oneOf:
            - $ref: '#/components/schemas/DashboardPurchaseOrderApprovalDetail'
            - $ref: '#/components/schemas/DashboardSalesOrderApprovalDetail'
            - $ref: '#/components/schemas/DashboardPurchaseReturnApprovalDetail'
            - $ref: '#/components/schemas/DashboardSalesReturnApprovalDetail'
            - $ref: '#/components/schemas/DashboardInboundConfirmDetail'
            - $ref: '#/components/schemas/DashboardOutboundConfirmDetail'
            - $ref: '#/components/schemas/DashboardStockRiskReviewDetail'
            - $ref: '#/components/schemas/DashboardSystemExceptionDetail'

    DashboardPurchaseOrderApprovalDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [PURCHASE_ORDER_APPROVAL] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoDocumentItem' } }
    DashboardSalesOrderApprovalDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [SALES_ORDER_APPROVAL] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoDocumentItem' } }
    DashboardPurchaseReturnApprovalDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [PURCHASE_RETURN_APPROVAL] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoDocumentItem' } }
    DashboardSalesReturnApprovalDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [SALES_RETURN_APPROVAL] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoDocumentItem' } }
    DashboardInboundConfirmDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [INBOUND_CONFIRM] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoDocumentItem' } }
    DashboardOutboundConfirmDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [OUTBOUND_CONFIRM] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoDocumentItem' } }

    DashboardTodoDocumentItem:
      type: object
      required: [documentNo, documentStatus]
      properties:

        documentNo: { type: string, description: 当前业务单号；采购退货/销售退货分别为 PR/SR 单号 }
        sourceDocumentNo: { type: string, nullable: true, description: 来源业务单号；采购退货为原采购单号，销售退货为原销售单号，出入库为来源单号 }
        counterpartyName: { type: string, nullable: true, description: 往来方或仓库名称；标签由 detail.model 固定 }
        amountFen: { type: integer, format: int64, nullable: true, description: 金额存储值，单位为分；前端按金额格式化，不接受后端拼接货币文案 }
        waitHours: { type: integer, format: int64, nullable: true, minimum: 0, description: 从提交或创建至当前的等待时长，单位为小时 }
        waitLevel: { type: string, nullable: true, enum: [NORMAL, WARNING, OVERDUE], description: 等待分级：小于 24 小时、24 至 72 小时、72 小时及以上 }
        documentStatus: { type: string, description: 当前单据业务状态；这是单据事实，不是聚合待办状态 }

    DashboardStockRiskReviewDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [STOCK_RISK_REVIEW] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoStockRiskItem' } }
    DashboardTodoStockRiskItem:
      type: object
      required: [id, productCode, productName, warehouseName, unitName, availableQty, safetyStockQty, suggestedPurchaseQty, severity]
      properties:
        id: { type: string }
        productCode: { type: string }
        productName: { type: string }
        warehouseName: { type: string }
        unitName: { type: string }
        availableQty: { type: number, format: double }
        safetyStockQty: { type: number, format: double }
        suggestedPurchaseQty: { type: number, format: double }
        severity: { type: string, enum: [HIGH, MEDIUM] }

    DashboardSystemExceptionDetail:
      type: object
      required: [model, items]
      properties:
        model: { type: string, enum: [SYSTEM_EXCEPTION] }
        items: { type: array, items: { $ref: '#/components/schemas/DashboardTodoSystemExceptionItem' } }
    DashboardTodoSystemExceptionItem:
      type: object
      required: [id, exceptionNo, summary, exceptionType, sourceModule, occurredAt, severity]
      properties:
        id: { type: string }
        exceptionNo: { type: string, description: 系统异常编号 }
        summary: { type: string, description: 异常摘要 }
        exceptionType: { type: string, description: 面向用户的异常类型 }
        sourceModule: { type: string, description: 面向用户的来源模块 }
        occurredAt: { type: string, nullable: true, description: 异常发生时间 }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
    DashboardStockAlert:
      type: object
      required: [stockId, productId, productCode, productName, warehouseId, warehouseName, unitName, availableQty, safetyStockQty, suggestedPurchaseQty, severity, latestOutboundAt]
      properties:
        stockId: { type: string, description: 对应 `warehouse_stock.id`，BIGINT 按字符串传输 }
        productId: { type: string, description: 对应 `product.id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 产品编码快照 }
        productName: { type: string, maxLength: 200, description: 产品名称快照 }
        warehouseId: { type: string, description: 对应 `warehouse.id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 仓库名称快照 }
        unitName: { type: string, maxLength: 32, description: 计量单位 }
        availableQty: { type: number, format: double, minimum: 0, description: 可用库存，按 `stock_qty - locked_qty` 派生 }
        safetyStockQty: { type: number, format: double, minimum: 0, description: 产品安全库存 }
        suggestedPurchaseQty: { type: number, format: double, minimum: 0, description: 建议补货数量，由安全库存、在途采购和近期销售速度派生 }
        severity:
          type: string
          enum: [OUT_OF_STOCK, NO_AVAILABLE, LOW_STOCK]
          description: 库存健康状态；OUT_OF_STOCK 表示 stock_qty=0（零库存），NO_AVAILABLE 表示 stock_qty>0 且 available_qty=0（无可用库存），LOW_STOCK 表示 0<available_qty<=safety_stock_qty（低库存）。
        latestOutboundAt: { type: string, nullable: true, description: 最近出库时间；无出库记录返回 `null` }

    DashboardOrderStage:
      type: object
      required: [stage, purchaseCount, salesCount]
      properties:
        stage: { type: string, description: 状态展示名称，例如 `待审核`、`已审核`、`已完成` }
        purchaseCount: { type: integer, minimum: 0, description: 本自然月新建的采购订单数量 }
        salesCount: { type: integer, minimum: 0, description: 本自然月新建的销售订单数量 }

    DashboardTopProduct:
      type: object
      required: [productId, productCode, productName, salesAmount, salesQty, availableQty]
      properties:
        productId: { type: string, description: 对应 `product.id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 200 }
        salesAmount: { type: string, pattern: '^\d+(\.\d{1,2})?$', description: 近 30 日销售额字符串；用于排行排序，前端按人民币格式化 }
        salesQty: { type: number, format: double, minimum: 0, description: 近 30 日销量，不同单位不得跨产品混加；前端只展示数值，不跨产品汇总 }
        availableQty: { type: number, format: double, minimum: 0, description: 当前可用库存；用于提示热销商品是否存在库存压力 }

    DashboardSupplierPerformance:
      type: object
      required: [supplierId, supplierCode, supplierName, deliveryScore, qualityScore, onTimeRate]
      properties:
        supplierId: { type: string, description: 对应 `supplier.id`，BIGINT 按字符串传输 }
        supplierCode: { type: string, maxLength: 64 }
        supplierName: { type: string, maxLength: 200 }
        deliveryScore: { type: number, format: double, minimum: 0, maximum: 100, description: 供应商交付评分；主卡和详情弹窗均展示 }
        qualityScore: { type: number, format: double, minimum: 0, maximum: 100, description: 供应商质量评分；主卡和详情弹窗均展示 }
        onTimeRate: { type: number, format: double, minimum: 0, maximum: 100, description: 准时交付率百分比数值；用于供应商履约排行辅助判断 }

    Result:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          description: 响应消息
          example: success
        data:
          description: 响应数据，类型由具体接口定义

    EmptyResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          description: 登录账号，对应 `sys_user.username`
          example: admin
        password:
          type: string
          format: password
          description: 登录密码，后端与 `sys_user.password_hash` 比对
          example: "123456"

    LoginResponse:
      type: object
      required:
        - token
        - tokenName
        - user
      properties:
        token:
          type: string
          description: Sa-Token 原始 token
        tokenName:
          type: string
          example: satoken
