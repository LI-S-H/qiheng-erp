    post:
      tags: [WarehouseStockBill]
      summary: 新增手工入库单草稿
      description: 创建调整入库或补录采购入库、销售退货入库草稿。保存后不改变库存，确认入库后才生成库存流水。本接口需要 `warehouse:manage` 权限。
