    post:
      tags: [WarehouseStockBill]
      summary: 新增手工出库单草稿
      description: 创建调整出库或补录销售出库、采购退货出库草稿。保存后不改变库存，确认出库后才生成库存流水。本接口需要 `warehouse:manage` 权限。
      operationId: outboundBillCreate
      security:
        - SaTokenAuth: []
