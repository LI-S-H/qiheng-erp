                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询库存流水记录
      description: |
        查询 `stock_bill` 已确认库存流水主表，并按 `stock_bill_item.bill_id` 聚合返回 `itemCount`；列表不跨不同产品单位汇总数量。
        入库单和出库单的业务操作请优先使用 `/warehouse/inbound-bills`、`/warehouse/outbound-bills`。本路径仅用于已确认库存事实追溯或旧前端兼容。
        流水号和来源单号分别使用包含匹配，仓库、出入库类型、录入方式和状态使用精确匹配，多个有效条件按 AND 组合。
        列表摘要只统计当前页 `records` 的待确认数、已确认数、已取消数和来源生成数，不展示当前页单据数，不要求后端为了摘要额外全量聚合。
        入库类型为 `PURCHASE_IN`、`SALES_RETURN`、`ADJUST_IN`；出库类型为 `SALES_OUT`、`PURCHASE_RETURN`、`ADJUST_OUT`。
        本接口只用于追溯库存凭证，需要 `warehouse:query` 权限。
      operationId: stockBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 库存流水号，对应 `stock_bill.bill_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源单号，对应 `stock_bill.source_no`，使用包含匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `stock_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT]
          description: 出入库类型，对应 `stock_bill.bill_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `stock_bill.entry_mode`，使用精确匹配；分别表示系统自动录入、人工补录和人工调整
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED]
          description: 状态，兼容入库单/出库单查询时可为 `PENDING_CONFIRM`
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WarehouseStockBill]
      summary: 新增手工入库单/出库单草稿（兼容路径）
      description: |
        兼容旧前端的统一创建路径。新接口应按方向使用 `/warehouse/inbound-bills` 或 `/warehouse/outbound-bills`。
        允许创建 `ADJUST_IN`、`ADJUST_OUT` 库存调整，或在原采购、销售、退货业务遗漏登记时补录对应入库单/出库单。
        非调整类型必须提交原业务单号和补录原因，后端设置 `entryMode=MANUAL_SUPPLEMENT`、按 `billType` 推导 `sourceType`，且 `sourceId` 为空；调整类型由后端生成调整单号并设置 `entryMode=MANUAL_ADJUSTMENT`。
        `billNo`、负责人、创建人、创建时间和产品快照由后端生成或按当前登录上下文填充；负责人字段不接受前端提交。
        保存后状态为 `DRAFT`，不立即改变库存；确认入库/出库后才生成库存流水。需要 `warehouse:manage` 权限。
      operationId: stockBillCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockBillCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills/{stockBillId}:
    get:
      tags: [WarehouseStockBill]
      summary: 获取入库单、出库单或库存流水详情
      description: 返回入库单、出库单或库存流水主表信息及全部明细，用于追溯来源单据、供应商或客户、确认信息、产品数量和库存变动。本接口需要 `warehouse:query` 权限。
      operationId: stockBillDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [WarehouseStockBill]
      summary: 编辑入库单/出库单草稿或待确认单
      description: |
        `DRAFT` 和 `PENDING_CONFIRM` 状态允许编辑数量、质量数量和备注；提交后或来源生成单据需要具备仓库确认/审核权限。
        `DRAFT` 状态允许修改仓库；进入 `PENDING_CONFIRM` 后仓库、来源信息、产品结构均锁定，只允许调整本次数量、合格数量、不合格数量和备注。
        来源业务单据生成的单据不能在本接口增删或更换产品，也不能修改来源和出入库类型；手工补录或库存调整草稿允许维护产品明细。
        流水号、来源信息、审计字段、变动前后库存均由后端维护，前端不得提交；需要 `warehouse:manage` 权限。
      operationId: stockBillUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockBillUpdateRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills/{stockBillId}/submit:
    post:
      tags: [WarehouseStockBill]
      summary: 提交入库单/出库单草稿为待确认
      description: |
        仅允许 `DRAFT -> PENDING_CONFIRM`。提交不改变库存、不生成库存流水，只表示单据明细已完成录入并进入仓库确认队列。
        前端必须先展示入库单/出库单详情及全部产品明细，再在详情页提供提交确认按钮并进行二次确认。
        提交前后端必须重新校验仓库、产品明细、本次数量、质检数量、手工补录原业务单号和补录/调整原因；来源生成单据还必须保留来源计划数量、生成本单前累计已处理数量和确认后剩余未处理数量。
        待确认状态仍允许具备仓库管理权限的人员调整本次数量、质检数量和备注；确认后才禁止修改。接口需要 `warehouse:manage` 权限并保证重复请求幂等。
      operationId: stockBillSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills/{stockBillId}/confirm:
    post:
      tags: [WarehouseStockBill]
      summary: 确认入库/出库
      description: |
        仅允许 `PENDING_CONFIRM -> CONFIRMED`。前端必须先展示入库单/出库单详情及全部产品明细，再在详情页提供确认按钮并进行二次确认。
        后端必须锁定入库单/出库单和相关库存记录，在同一事务内重新校验仓库、产品、库存和锁定库存，生成 `stock_bill` / `stock_bill_item`，更新 `warehouse_stock`，写入明细变动前后数量并回写采购或销售来源单据的已入库/已出库数量。
        来源生成的待确认单确认时，后端必须校验本次入库/出库数量大于 0 且不超过来源明细剩余数量，并重新计算确认后的剩余未入库/未出库数量；`pendingQty` 是只读结果，前端不得作为提交字段传入。
        已确认单据不得直接改回草稿或取消；错误凭证通过反向库存调整纠正。接口需要 `warehouse:manage` 权限并保证重复请求幂等。
      operationId: stockBillConfirm
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 确认成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills/{stockBillId}/cancel:
    post:
      tags: [WarehouseStockBill]
      summary: 取消入库单/出库单草稿或待确认单
      description: 仅允许 `DRAFT/PENDING_CONFIRM -> CANCELLED`，取消不改变库存，取消后的单据保留追溯且不能再次编辑或确认。接口需要 `warehouse:manage` 权限并保证重复请求幂等。
      operationId: stockBillCancel
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/warehouses:
    get:
      tags: [Warehouse]
      summary: 分页查询仓库
      description: |
        查询未删除的 `warehouse` 数据。仓库编码、仓库名称、联系人和联系电话分别使用包含匹配，状态使用精确匹配，多个有效条件按 AND 组合。
        仓库列表使用无总数分页，后端不需要返回精确 `total`，也不需要为了分页执行额外 `COUNT(*)`；前端只展示当前页、上一页和下一页。
        不接收含义不明确的 `keyword` 参数。本接口需要 `warehouse:query` 权限。
      operationId: warehousePage
      security:
        - SaTokenAuth: []
      parameters:
        - name: warehouseCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 仓库编码，对应 `warehouse.warehouse_code`，使用包含匹配
        - name: warehouseName
          in: query
          schema: { type: string, maxLength: 100 }
          description: 仓库名称，对应 `warehouse.warehouse_name`，使用包含匹配
        - name: contactName
          in: query
          schema: { type: string, maxLength: 100 }
          description: 联系人，对应 `warehouse.contact_name`，使用包含匹配
        - name: contactPhone
