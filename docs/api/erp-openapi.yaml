              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders:
    get:
      tags: [PurchaseOrder]
      summary: 分页查询采购订单
      description: |
        查询未删除的 `purchase_order` 单头数据，列表不返回明细数组；查看、编辑、提交或审核前通过详情接口按订单 ID 获取 `items`。采购单号使用包含匹配，供应商、仓库和状态使用精确匹配，多个有效条件按 AND 组合。
        不接收含义不明确的 `keyword` 参数。列表摘要只展示当前页 `records` 派生的状态、入库等业务指标，不展示当前页行数；不得要求后端为了摘要额外全量聚合。
        本接口需要 `purchase:query` 权限。
      operationId: purchaseOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: purchaseNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 采购单号，对应 `purchase_order.purchase_no`，使用包含匹配
        - name: supplierId
          in: query
          schema: { type: string }
          description: 供应商 ID，对应 `purchase_order.supplier_id`，使用精确匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 入库仓库 ID，对应 `purchase_order.warehouse_id`，使用精确匹配
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_INBOUND, INBOUND_DONE, CANCELLED]
          description: 采购订单状态，对应 `purchase_order.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [PurchaseOrder]
      summary: 新增采购订单草稿
      description: |
        采购单号、供应商和产品快照、订单总金额、创建人和审计字段由后端维护，前端不提交；创建后状态为 `DRAFT`，不生成入库流水。
        草稿阶段 `expectedArrivalDate` 可为空；提交或审核前，后端必须校验单头预计到货日期非空。
        明细数量和金额使用业务真实值传输，数据库按 decimal 保存；`selectedSupplierScore` 按 0-100 业务值提交，后端负责放大 100 倍落库。
        本接口需要 `purchase:create` 权限。
      operationId: purchaseOrderCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}:
    get:
      tags: [PurchaseOrder]
      summary: 获取采购订单详情
      description: |
        返回 `purchase_order` 主表、按 `purchase_order_item.purchase_order_id` 查询的全部明细，以及只读的履约摘要和流程记录。本接口需要 `purchase:query` 权限。
        `fulfillmentSummary` 必须由服务端按每条明细 `min(inbound_qty, quantity) * unit_price` 汇总为累计入库金额，再除以订单总金额得到 `completionRate`；不得跨不同单位直接相加数量。单条商品的数量完成率由前端使用本明细 `inboundQty / quantity` 展示。
        `timeline` 不新增操作日志表：创建、提交、审核节点来自 `purchase_order` 审计字段；入库单生成与确认节点来自关联 `inbound_bill`（`source_type=PURCHASE_ORDER` 且 `source_id=purchase_order.id`）的创建和确认字段，按发生时间升序返回。
      operationId: purchaseOrderDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [PurchaseOrder]
      summary: 编辑采购订单
      description: |
        `DRAFT` 状态可由采购创建权限编辑；`SUBMITTED` 状态仍允许具备审核/审批权限的用户编辑供应商、入库仓库、预计到货日期、备注和明细。
        `APPROVED`、`PARTIAL_INBOUND`、`INBOUND_DONE`、`CANCELLED` 不允许通过本接口修改；已审核后的业务纠正应通过仓库出入库、冲销或反向业务单据处理。
        采购单号、状态、已入库数量、创建人、提交人、审核人和审计字段由后端维护，前端不得提交。
        明细传入 `purchaseOrderItemId` 表示更新已有明细，不传表示新增明细，被移除的旧明细由后端物理删除；采购明细不维护单独预计到货日期。
        后端必须重新校验权限、供应商、仓库、产品、供货关系、数量精度和价格，并重算主表 `total_amount`。本接口需要 `purchase:create` 或审核/审批权限。
      operationId: purchaseOrderUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseOrderUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}/submit:
    post:
      tags: [PurchaseOrder]
      summary: 提交采购订单
      description: 仅允许 `DRAFT -> SUBMITTED`；前端调用本接口前必须先通过详情数据向操作人展示完整采购单头和采购明细，并在二次确认后提交。提交时后端重新校验单头预计到货日期非空、供应商、仓库、产品、供货关系和明细数量价格。本接口需要 `purchase:create` 权限并保证重复请求幂等。
      operationId: purchaseOrderSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}/approve:
    post:
      tags: [PurchaseOrder]
      summary: 审核采购订单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。前端调用本接口前必须先通过详情数据向审核人展示完整采购单头和采购明细，并在二次确认后审核通过。审核前后端必须重新校验单头预计到货日期非空、供应商、仓库、产品、供货关系和明细数量价格。
        审核通过后，后端在同一事务内生成仓库模块 `PURCHASE_IN` 待确认入库单，`source_type = PURCHASE_ORDER`、`source_id = purchase_order.id`、`source_no = purchase_order.purchase_no`，并带入供应商、入库仓库、采购数量、累计已入库和剩余未入库数量。
        采购订单审核后不直接改变库存，也不生成库存流水；需要审核/审批权限并保证重复请求幂等。
      operationId: purchaseOrderApprove
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 审核成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /purchase/orders/{purchaseOrderId}/cancel:
    post:
      tags: [PurchaseOrder]
      summary: 取消采购订单
      description: 允许 `DRAFT`、`SUBMITTED` 取消，也允许尚未发生任何确认入库事实的 `APPROVED` 取消。取消 `APPROVED` 订单时，后端在同一事务内作废全部 `source_type = PURCHASE_ORDER` 的 `DRAFT`、`PENDING_CONFIRM` 入库工作单；取消不改变实物库存、不生成库存流水。`PARTIAL_INBOUND`、`INBOUND_DONE`，或存在任一已确认入库工作单时返回 `409`。已取消订单重复调用按幂等成功处理且不会重复作废工作单；未取消订单版本过期或与入库确认并发时返回 `409`。本接口需要 `purchase:create` 权限。
      operationId: purchaseOrderCancel
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/PurchaseOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /returns:
    get:
      tags: [Return]
      summary: 分页查询统一退货单
      description: 通过必填的 `returnType` 区分采购退货与销售退货；所有筛选条件按 AND 组合。采购前端固定传 `PURCHASE_RETURN`，销售前端固定传 `SALES_RETURN`，页面不允许用户自行切换类型。退货查询需要 `return:query` 权限，不区分采购/销售方向。采购与销售来源能力均已部署。
      operationId: returnOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnType
          in: query
          required: true
          schema: { type: string, enum: [PURCHASE_RETURN, SALES_RETURN] }
        - name: returnNo
          in: query
          schema: { type: string, maxLength: 64 }
        - name: sourceOrderNo
          in: query
          schema: { type: string, maxLength: 64 }
        - name: partyId
          in: query
          schema: { type: string }
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_EXECUTED, COMPLETED, CANCELLED] }
        - name: pageNum
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderPage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Return]
      summary: 创建统一退货单草稿
      description: |
        前端适配器固定提交业务方向；单号、来源单号、往来对象和商品快照、金额、状态及审计字段均由后端生成或查询，前端不得提交。
        `PURCHASE_RETURN` 仅可引用已有实际入库数量的采购订单，创建需要 `purchase:create`；`SALES_RETURN` 仅可引用已有实际出库数量的销售订单，创建需要 `sales:create`。草稿不占用剩余可退数量。后端须根据 `returnType` 校验来源明细、仓库、数量精度和明细唯一性。
      operationId: returnOrderCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /returns/source-orders:
    get:
      tags: [Return]
      summary: 搜索可退货来源订单
      description: 返回至少存在一条 `availableReturnQty > 0` 明细的来源订单。可退数量由服务端按来源实际履约数量减去同类型有效退货单占用数量聚合，前端不得自行跨单计算。
      operationId: returnSourceOrderSearch
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnType
          in: query
          required: true
          schema: { type: string, enum: [PURCHASE_RETURN, SALES_RETURN] }
        - name: sourceOrderNo
          in: query
          schema: { type: string, maxLength: 64 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReturnableSourceOrder' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /returns/source-orders/{sourceOrderId}/items:
    get:
      tags: [Return]
      summary: 查询来源订单可退明细
      description: 返回指定来源单中所有已实际履约的明细；即使 `availableReturnQty` 为 0，明细仍会返回。`occupiedQty` 与 `availableReturnQty` 为服务端派生字段；前端仅允许选择 `availableReturnQty > 0` 的明细，提交、审核时后端仍须锁定来源明细并重新校验。
      operationId: returnSourceItemList
      security:
        - SaTokenAuth: []
      parameters:
        - name: sourceOrderId
          in: path
          required: true
          schema: { type: string }
        - name: returnType
          in: query
          required: true
          schema: { type: string, enum: [PURCHASE_RETURN, SALES_RETURN] }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ReturnableSourceOrderItem' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /returns/{returnOrderId}:
    get:
      tags: [Return]
      summary: 获取统一退货单详情
      operationId: returnOrderDetail
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Return]
      summary: 编辑统一退货单草稿
      description: '`DRAFT` 和 `SUBMITTED` 可编辑，审核（`APPROVED`）后不可编辑；创建后的 `returnType` 不可修改。采购退货需要 `purchase:manage`，销售退货需要 `sales:manage`；后端同时校验乐观锁、来源订单、仓库、数量精度、预计执行日期和当前剩余可退数量。'
      operationId: returnOrderUpdate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderUpdateRequest' }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ReturnOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Return]
      summary: 删除统一退货单草稿
      description: 仅 `DRAFT` 可逻辑删除主单，并在同一事务内删除对应明细；后端按退货方向校验 `purchase:manage`/`sales:manage` 和乐观锁。
      operationId: returnOrderDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /returns/{returnOrderId}/submit:
    post:
      tags: [Return]
      summary: 提交统一退货单
      description: 仅允许 `DRAFT -> SUBMITTED`。后端按退货方向校验 `purchase:manage`/`sales:manage`、预计执行日期和剩余可退数量，并保证重复请求幂等。
      operationId: returnOrderSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
