openapi: 3.0.3
info:
  title: 启衡 ERP 接口文档
  version: 0.5.0
  description: |
    本文档用于启衡 ERP 前后端接口约定，可直接导入 Apifox 使用。
    当前版本包含登录模块、系统权限模块、产品模块、仓库管理和库存管理页面。
    MVP 阶段认证使用 Sa-Token 原始 token。登录接口返回 `token` 和 `tokenName`，前端后续请求必须使用返回的 `tokenName` 作为请求头名称、`token` 作为请求头值；当前默认配置为 `satoken`。
servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
tags:
  - name: Auth
    description: 登录、退出和当前用户接口
  - name: SystemUser
    description: 系统权限 - 用户管理
  - name: SystemRole
    description: 系统权限 - 角色管理
  - name: SystemDept
    description: 系统权限 - 部门管理
  - name: SystemPermission
    description: 系统权限 - 权限码配置
  - name: SystemOption
    description: 系统权限 - 页面下拉选项
  - name: ProductCategory
    description: 产品中心 - 产品分类管理
  - name: Product
    description: 产品中心 - 产品档案管理
  - name: Warehouse
    description: 仓储库存 - 仓库管理
  - name: WarehouseStock
    description: 仓储库存 - 当前库存余额查询
  - name: PurchaseSupplier
    description: 采购管理 - 供应商管理
  - name: PurchaseSupplierProduct
    description: 采购管理 - 供货产品管理
  - name: PurchaseOrder
    description: 采购管理 - 采购订单管理
  - name: SalesCustomer
    description: 销售管理 - 客户管理
  - name: SalesOrder
    description: 销售管理 - 销售订单管理
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                code: 0
                message: success
                data:
                  token: 5f4dcc3b-0000-4000-9000-000000000001
                  tokenName: satoken
                  user:
                    userId: "1900000000000000001"
                    username: admin
                    realName: 系统管理员
                    deptId: "1900000000000000100"
                    deptName: 行政部
                    isAdmin: true
                    roleCodes:
                      - SUPER_ADMIN
                    permissionCodes:
                      - "*"
                    lastLoginAt: "2026-06-08 09:12:30"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags:
        - Auth
      summary: 获取当前登录用户
      operationId: authMe
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUser'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 退出登录
      operationId: authLogout
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /system/users:
    get:
      tags:
        - SystemUser
      summary: 分页查询用户
      description: 仅传需要生效的筛选参数；未传参数表示不限制该字段。多个筛选参数同时存在时按 AND 条件组合。
      operationId: systemUserPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: 登录账号，对应 `sys_user.username`，使用包含匹配
        - name: realName
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 用户姓名，对应 `sys_user.real_name`，使用包含匹配
        - name: deptId
          in: query
          required: false
          schema:
            type: string
          description: 所属部门 ID，对应 `sys_user.dept_id`
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: 绑定角色 ID，对应 `sys_user_role.role_id`
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: 状态，1 启用，0 停用；不筛选状态时不传该参数
        - name: pageNum
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每页条数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUserPage'
              example:
                code: 0
                message: success
                data:
                  records:
                    - userId: "1900000000000000001"
                      username: admin
                      realName: 系统管理员
                      deptId: "1900000000000000100"
                      deptName: 行政部
                      isAdmin: true
                      status: 1
                      roleIds:
                        - "1900000000000001001"
                      roleNames:
                        - 超级管理员
                      lastLoginAt: "2026-06-08 09:12:30"
                      createTime: "2026-06-05 20:30:00"
                      updateTime: "2026-06-08 09:12:30"
                  total: 1
                  pageNum: 1
                  pageSize: 10
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - SystemUser
      summary: 新增用户
      operationId: systemUserCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserCreateRequest'
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUser'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /system/users/batch/status:
    patch:
      tags:
        - SystemUser
      summary: 批量修改用户状态
      description: 根据用户 ID 列表批量启用或停用账号
      operationId: systemUserBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserBatchStatusRequest'
      responses:
        "200":
          description: 批量修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/batch/password:
    patch:
      tags:
        - SystemUser
      summary: 批量重置用户密码
      description: 根据用户 ID 列表批量设置新密码
      operationId: systemUserBatchPassword
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserBatchPasswordResetRequest'
      responses:
        "200":
          description: 批量重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/batch/delete:
    post:
      tags:
        - SystemUser
      summary: 批量删除用户
      description: 根据用户 ID 列表批量逻辑删除账号，对应 `sys_user.deleted = 1`
      operationId: systemUserBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserBatchDeleteRequest'
      responses:
        "200":
          description: 批量删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/{userId}:
    get:
      tags:
        - SystemUser
      summary: 获取用户详情
      operationId: systemUserDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUser'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - SystemUser
      summary: 编辑用户
      operationId: systemUserUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserUpdateRequest'
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUser'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - SystemUser
      summary: 删除用户
      description: 逻辑删除用户，对应 `sys_user.deleted = 1`
      operationId: systemUserDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/users/{userId}/status:
    patch:
      tags:
        - SystemUser
      summary: 修改用户状态
      operationId: systemUserStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserStatusRequest'
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/users/{userId}/password:
    patch:
      tags:
        - SystemUser
      summary: 重置用户密码
      operationId: systemUserPassword
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserPasswordResetRequest'
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/users/{userId}/roles:
    put:
      tags:
        - SystemUser
      summary: 绑定用户角色
      operationId: systemUserBindRoles
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserRoleBindRequest'
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/roles:
    get:
      tags:
        - SystemRole
      summary: 分页查询角色
      description: 仅传需要生效的筛选参数；未传参数表示不限制该字段。多个筛选参数同时存在时按 AND 条件组合。
      operationId: systemRolePage
      security:
        - SaTokenAuth: []
      parameters:
        - name: roleCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: 角色编码筛选，对应 `sys_role.role_code`
        - name: roleName
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 角色名称筛选，对应 `sys_role.role_name`
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: 状态，1 启用，0 停用；不筛选状态时不传该参数
        - name: pageNum
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每页条数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRolePage'
              example:
                code: 0
                message: success
                data:
                  records:
                    - roleId: "1900000000000001001"
                      roleCode: SUPER_ADMIN
                      roleName: 超级管理员
                      permissionCodes:
                        - "*"
                      status: 1
                      remark: 拥有系统全部访问和维护权限
                      userCount: 1
                      createTime: "2026-06-05 20:30:00"
                      updateTime: "2026-06-08 09:12:30"
                  total: 1
                  pageNum: 1
                  pageSize: 10
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - SystemRole
      summary: 新增角色
      operationId: systemRoleCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleCreateRequest'
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRole'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          $ref: '#/components/responses/Conflict'

  /system/roles/batch/status:
    patch:
      tags:
        - SystemRole
      summary: 批量修改角色状态
      operationId: systemRoleBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleBatchStatusRequest'
      responses:
        "200":
          description: 批量修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/roles/batch/delete:
    post:
      tags:
        - SystemRole
      summary: 批量删除角色
      description: 逻辑删除角色，对应 `sys_role.deleted = 1`。已绑定用户的角色需要先解除 `sys_user_role` 关系后再删除。
      operationId: systemRoleBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleBatchDeleteRequest'
      responses:
        "200":
          description: 批量删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/roles/{roleId}:
    get:
      tags:
        - SystemRole
      summary: 获取角色详情
      operationId: systemRoleDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRole'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - SystemRole
      summary: 编辑角色
      operationId: systemRoleUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleUpdateRequest'
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRole'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - SystemRole
      summary: 删除角色
      description: 逻辑删除角色，对应 `sys_role.deleted = 1`。已绑定用户的角色需要先解除 `sys_user_role` 关系后再删除。
      operationId: systemRoleDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /system/roles/{roleId}/status:
    patch:
      tags:
        - SystemRole
      summary: 修改角色状态
      operationId: systemRoleStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleStatusRequest'
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /system/roles/{roleId}/permissions:
    patch:
      tags:
        - SystemRole
      summary: 配置角色权限码
      description: 除保留值 `*` 外，权限码必须存在于 `sys_permission` 且状态为启用；更新成功后应清理受影响用户的权限 Session。
      operationId: systemRolePermissions
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRolePermissionUpdateRequest'
      responses:
        "200":
          description: 配置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /system/depts:
    get:
      tags:
        - SystemDept
      summary: 查询部门列表
      description: 返回 `sys_dept` 扁平列表即可，前端根据 `parentId` 构建树形结构和层级路径，不要求后端组装 `children` 或路径字符串。仅传需要生效的筛选参数，多个筛选参数按 AND 条件组合。权限：仅需登录态（Sa-Token 有效），不校验具体权限码。
      operationId: systemDeptList
      security:
        - SaTokenAuth: []
      parameters:
        - name: deptName
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 部门名称筛选，对应 `sys_dept.dept_name`
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: 状态，1 启用，0 停用；不筛选状态时不传该参数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SystemDept'
              example:
                code: 0
                message: success
                data:
                  - deptId: "1900000000000000100"
                    parentId: "0"
                    ancestors: "0"
                    deptName: 行政部
                    status: 1
                    userCount: 1
                    createTime: "2026-06-05 20:10:00"
                    updateTime: "2026-06-08 09:10:00"
                  - deptId: "1900000000000000102"
                    parentId: "0"
                    ancestors: "0"
                    deptName: 采购部
                    status: 1
                    userCount: 1
                    createTime: "2026-06-05 20:13:00"
                    updateTime: "2026-06-07 17:24:11"
