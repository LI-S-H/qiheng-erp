                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductCategory' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/batch/status:
    patch:
      tags: [ProductCategory]
      summary: 批量修改产品分类状态
      description: 停用父级分类时，后端必须在同一事务内级联停用全部下级分类，并停用当前分类和全部下级分类直接关联的未删除产品；启用分类不会自动重新启用产品。启用下级分类时，其全部上级必须已启用或包含在同一次启用请求中。本接口需要 `product:manage` 权限。
      operationId: productCategoryBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryBatchStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /product/categories/batch/delete:
    post:
      tags: [ProductCategory]
      summary: 批量删除产品分类
      description: 逻辑删除分类；存在下级分类或仍有产品直接关联的分类不能删除。本接口需要 `product:manage` 权限。
      operationId: productCategoryBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryBatchDeleteRequest' }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/{categoryId}:
    get:
      tags: [ProductCategory]
      summary: 获取产品分类详情
      description: 本接口需要 `product:query` 权限。
      operationId: productCategoryDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductCategory' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [ProductCategory]
      summary: 编辑产品分类
      description: 禁止把上级分类设置为自身或自身下级；同级分类名称不能重复；通过编辑接口停用分类时必须执行与状态接口相同的下级分类和关联产品级联规则。本接口需要 `product:manage` 权限。
      operationId: productCategoryUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductCategory' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [ProductCategory]
      summary: 删除产品分类
      description: 逻辑删除分类；存在下级分类或仍有产品直接关联时返回 409。本接口需要 `product:manage` 权限。
      operationId: productCategoryDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/{categoryId}/status:
    patch:
      tags: [ProductCategory]
      summary: 修改产品分类状态
      description: 停用父级分类时，后端必须在同一事务内级联停用全部下级分类和关联产品；上级分类停用时禁止单独启用下级分类。启用分类不会自动重新启用产品。本接口需要 `product:manage` 权限。
      operationId: productCategoryStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    SaTokenAuth:
      type: apiKey
      in: header
      name: satoken
      description: Sa-Token 原始 token。当前默认请求头为 satoken，实际调用以前端登录响应中的 tokenName 为准
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: 用户 ID，对应 `sys_user.id`
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: 角色 ID，对应 `sys_role.id`
    DeptId:
      name: deptId
      in: path
      required: true
      schema:
        type: string
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
      description: 权限 ID，对应 `sys_permission.id`
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
      description: 产品分类 ID，对应 `product_category.id`
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: 产品 ID，对应 `product.id`
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        type: string
      description: 仓库 ID，对应 `warehouse.id`
    StockBillId:
      name: stockBillId
      in: path
      required: true
      schema:
        type: string
      description: 出入库流水 ID，对应 `stock_bill.id`
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Unauthorized:
      description: 未登录或登录态已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Forbidden:
      description: 没有访问权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    NotFound:
      description: 数据不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Conflict:
      description: 唯一字段冲突，例如登录账号或角色编码已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    Result:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          description: 响应消息
          example: success
        data:
          description: 响应数据，类型由具体接口定义

    EmptyResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          description: 登录账号，对应 `sys_user.username`
          example: admin
        password:
          type: string
          format: password
          description: 登录密码，后端与 `sys_user.password_hash` 比对
          example: "123456"

    LoginResponse:
      type: object
      required:
        - token
        - tokenName
        - user
      properties:
        token:
          type: string
          description: Sa-Token 原始 token
        tokenName:
          type: string
          example: satoken
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required:
        - userId
        - username
        - realName
        - deptId
        - deptName
        - isAdmin
        - roleCodes
        - permissionCodes
      properties:
        userId:
          type: string
          description: 用户 ID，对应 `sys_user.id`
        username:
          type: string
          description: 登录账号
        realName:
          type: string
          description: 用户姓名
        deptId:
          type: string
          description: 部门 ID
        deptName:
          type: string
          description: 部门名称
        isAdmin:
          type: boolean
          description: 是否超级管理员
        roleCodes:
          type: array
          items:
            type: string
          description: 角色编码列表
        permissionCodes:
          type: array
          items:
            type: string
          description: 权限码列表
        lastLoginAt:
          type: string
          nullable: true
          example: "2026-06-08 09:12:30"

    SystemUserPage:
      type: object
      required:
        - records
        - total
        - pageNum
        - pageSize
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SystemUser'
        total:
          type: integer
          example: 1
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10

    SystemUser:
      type: object
      required:
        - userId
        - username
        - realName
        - deptId
        - deptName
        - isAdmin
        - status
        - roleIds
        - roleNames
        - createTime
        - updateTime
      properties:
        userId:
          type: string
          description: 用户 ID，对应 `sys_user.id`
        username:
          type: string
          description: 登录账号，对应 `sys_user.username`
        realName:
          type: string
          description: 用户姓名，对应 `sys_user.real_name`
        deptId:
          type: string
          description: 部门 ID，对应 `sys_user.dept_id`
        deptName:
          type: string
          description: 由后端通过 `sys_user.dept_id = sys_dept.id` 关联返回 `sys_dept.dept_name`
        isAdmin:
          type: boolean
          description: 是否超级管理员，对应 `sys_user.is_admin`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        roleIds:
          type: array
          items:
            type: string
          description: 由后端查询 `sys_user_role` 返回用户绑定角色 ID 列表
        roleNames:
          type: array
          items:
            type: string
          description: 由后端通过 `sys_user_role.role_id = sys_role.id` 关联返回角色名称列表
        lastLoginAt:
          type: string
          nullable: true
          description: 最近登录时间
        createTime:
          type: string
          description: 创建时间
        updateTime:
          type: string
          description: 更新时间

    SystemUserCreateRequest:
      type: object
      required:
        - username
        - realName
        - password
        - deptId
        - isAdmin
        - status
        - roleIds
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{2,63}$'
          description: 登录账号
        realName:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户姓名
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 初始密码
        deptId:
          type: string
          description: 部门 ID
        isAdmin:
          type: boolean
          description: 是否超级管理员
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 绑定角色 ID 列表

    SystemUserUpdateRequest:
      type: object
      required:
        - username
        - realName
        - deptId
        - isAdmin
        - status
        - roleIds
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{2,63}$'
          description: 登录账号
        realName:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户姓名
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 新密码，不传表示不修改密码
        deptId:
          type: string
          description: 部门 ID
        isAdmin:
          type: boolean
          description: 是否超级管理员
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 绑定角色 ID 列表

    SystemUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemUserPasswordResetRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 新密码

    SystemUserBatchStatusRequest:
      type: object
      required:
        - userIds
        - status
      properties:
        userIds:
          type: array
          minItems: 1
          description: 用户 ID 列表，对应 `sys_user.id`
          items:
            type: string
          example:
            - "1900000000000000001"
            - "1900000000000000002"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemUserBatchPasswordResetRequest:
      type: object
      required:
        - userIds
        - password
      properties:
        userIds:
          type: array
          minItems: 1
          description: 用户 ID 列表，对应 `sys_user.id`
          items:
            type: string
          example:
            - "1900000000000000001"
            - "1900000000000000002"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 新密码

    SystemUserBatchDeleteRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          minItems: 1
          description: 用户 ID 列表，对应 `sys_user.id`
          items:
            type: string
          example:
            - "1900000000000000001"
            - "1900000000000000002"

    SystemUserRoleBindRequest:
      type: object
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 角色 ID 列表

    SystemRolePage:
      type: object
      required:
        - records
        - total
        - pageNum
        - pageSize
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
        total:
          type: integer
          example: 1
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10

    SystemRole:
      type: object
      required:
        - roleId
        - roleCode
        - roleName
        - permissionCodes
        - status
        - remark
        - userCount
        - createTime
        - updateTime
      properties:
        roleId:
          type: string
          description: 角色 ID，对应 `sys_role.id`
        roleCode:
          type: string
          maxLength: 64
          description: 角色编码，对应 `sys_role.role_code`
          example: SUPER_ADMIN
        roleName:
          type: string
          minLength: 1
          maxLength: 100
          description: 角色名称，对应 `sys_role.role_name`
          example: 超级管理员
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`；除 `*` 外必须引用启用且未删除的 `sys_permission.permission_code`
          example:
            - "*"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        remark:
          type: string
          maxLength: 500
          description: 备注，对应 `sys_role.remark`
        userCount:
          type: integer
          description: 当前绑定用户数量，由 `sys_user_role` 按角色聚合得到
        createTime:
          type: string
          description: 创建时间，对应 `sys_role.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `sys_role.update_time`

    SystemRoleCreateRequest:
      type: object
      required:
        - roleCode
        - roleName
        - permissionCodes
        - status
        - remark
      properties:
        roleCode:
          type: string
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          description: 角色编码，对应 `sys_role.role_code`
        roleName:
          type: string
          minLength: 1
          maxLength: 100
          description: 角色名称，对应 `sys_role.role_name`
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`；除 `*` 外必须引用启用且未删除的 `sys_permission.permission_code`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        remark:
          type: string
          maxLength: 500
          description: 备注，对应 `sys_role.remark`，无备注时传空字符串

    SystemRoleUpdateRequest:
      type: object
      required:
        - roleCode
        - roleName
        - permissionCodes
        - status
        - remark
      properties:
        roleCode:
          type: string
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          description: 角色编码，对应 `sys_role.role_code`
        roleName:
          type: string
          maxLength: 100
          description: 角色名称，对应 `sys_role.role_name`
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        remark:
          type: string
          maxLength: 500
          description: 备注，对应 `sys_role.remark`，无备注时传空字符串

    SystemRoleStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemRolePermissionUpdateRequest:
      type: object
      required:
        - permissionCodes
      properties:
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`

    SystemRoleBatchStatusRequest:
      type: object
      required:
        - roleIds
        - status
      properties:
        roleIds:
          type: array
          minItems: 1
          description: 角色 ID 列表，对应 `sys_role.id`
          items:
            type: string
          example:
            - "1900000000000001001"
            - "1900000000000001002"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemRoleBatchDeleteRequest:
      type: object
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          minItems: 1
          description: 角色 ID 列表，对应 `sys_role.id`
          items:
            type: string
          example:
            - "1900000000000001001"
            - "1900000000000001002"

    SystemDept:
      type: object
      required:
        - deptId
        - parentId
        - ancestors
        - deptName
        - status
        - userCount
        - createTime
        - updateTime
      properties:
        deptId:
          type: string
          description: 部门 ID，对应 `sys_dept.id`
        parentId:
          type: string
          description: 上级部门 ID，对应 `sys_dept.parent_id`；无上级部门时为 `"0"`
        ancestors:
          type: string
          maxLength: 500
          description: 祖级路径，对应 `sys_dept.ancestors`；前端不依赖该字段组装展示路径，展示路径按 `parentId` 递归计算
        deptName:
          type: string
          minLength: 1
          maxLength: 100
          description: 部门名称，对应 `sys_dept.dept_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        userCount:
          type: integer
          description: 当前员工数量，由 `sys_user.dept_id` 按部门聚合得到
        createTime:
          type: string
          description: 创建时间，对应 `sys_dept.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `sys_dept.update_time`

    SystemDeptCreateRequest:
      type: object
      required:
        - parentId
        - deptName
        - status
      properties:
        parentId:
          type: string
          description: 上级部门 ID，对应 `sys_dept.parent_id`；无上级部门时传 `"0"`
        deptName:
          type: string
          minLength: 1
          maxLength: 100
          description: 部门名称，对应 `sys_dept.dept_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemDeptUpdateRequest:
      type: object
      required:
        - parentId
        - deptName
        - status
      properties:
        parentId:
          type: string
          description: 上级部门 ID，对应 `sys_dept.parent_id`；无上级部门时传 `"0"`；后端需禁止设置为自身或自身下级
        deptName:
          type: string
          minLength: 1
          maxLength: 100
          description: 部门名称，对应 `sys_dept.dept_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用；停用时级联下级，启用时校验全部上级已启用

    SystemDeptStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemDeptBatchStatusRequest:
      type: object
      required:
        - deptIds
        - status
      properties:
        deptIds:
          type: array
          minItems: 1
          description: 部门 ID 列表，对应 `sys_dept.id`
          items:
            type: string
          example:
            - "1900000000000000102"
            - "1900000000000000103"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemDeptBatchDeleteRequest:
      type: object
      required:
        - deptIds
      properties:
        deptIds:
          type: array
          minItems: 1
          description: 部门 ID 列表，对应 `sys_dept.id`
          items:
            type: string
          example:
            - "1900000000000000102"
            - "1900000000000000103"

    PermissionActionType:
      type: string
      enum: [query, create, update, delete, manage, execute]

    SystemPermissionPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SystemPermission' }
        total: { type: integer, format: int64 }
        pageNum: { type: integer }
        pageSize: { type: integer }

    SystemPermission:
      type: object
      required: [permissionId, permissionCode, permissionName, moduleCode, actionType, status, sortOrder, description, roleCount, createTime, updateTime]
      properties:
        permissionId: { type: string }
        permissionCode:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z][a-z0-9]*(?::[a-z][a-z0-9]*){1,3}$'
        permissionName: { type: string, minLength: 1, maxLength: 100 }
        moduleCode: { type: string, minLength: 1, maxLength: 64 }
        actionType: { $ref: '#/components/schemas/PermissionActionType' }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        description: { type: string, maxLength: 500 }
        roleCount: { type: integer, minimum: 0, description: 由后端使用 sys_role.permission_codes JSON 聚合得到；通配符 * 视为引用全部权限码 }
        createTime: { type: string }
        updateTime: { type: string }

    SystemPermissionCreateRequest:
      type: object
      required: [permissionCode, permissionName, moduleCode, actionType, status, sortOrder, description]
      properties:
        permissionCode:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z][a-z0-9]*(?::[a-z][a-z0-9]*){1,3}$'
        permissionName: { type: string, minLength: 1, maxLength: 100 }
        moduleCode: { type: string, minLength: 1, maxLength: 64 }
        actionType: { $ref: '#/components/schemas/PermissionActionType' }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        description: { type: string, maxLength: 500 }

    SystemPermissionUpdateRequest:
      type: object
      description: permissionCode 用于鉴权且创建后不可修改，因此更新请求不接收该字段。
      required: [permissionName, moduleCode, actionType, status, sortOrder, description]
      properties:
        permissionName: { type: string, minLength: 1, maxLength: 100 }
        moduleCode: { type: string, minLength: 1, maxLength: 64 }
        actionType: { $ref: '#/components/schemas/PermissionActionType' }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        description: { type: string, maxLength: 500 }

    SystemPermissionStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1] }

    SystemPermissionBatchStatusRequest:
      type: object
      required: [permissionIds, status]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { type: string }
        status: { type: integer, enum: [0, 1] }

    SystemPermissionBatchDeleteRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { type: string }

    PermissionOptionGroup:
      type: object
      required: [group, codes]
      properties:
        group: { type: string }
        codes:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string }
              label: { type: string }

    RoleOption:
      type: object
      required:
        - roleId
        - roleCode
        - roleName
        - status
      properties:
        roleId:
          type: string
        roleCode:
          type: string
        roleName:
          type: string
        status:
          type: integer
          enum: [0, 1]

    DeptOption:
      type: object
      required:
        - deptId
        - deptName
        - parentId
        - status
      properties:
        deptId:
          type: string
        deptName:
          type: string
        parentId:
          type: string
        status:
          type: integer
          enum: [0, 1]

    WarehouseStockPage:
      type: object
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/WarehouseStock' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/WarehouseStockSummary' }

    StockBillDraftItemRequest:
      type: object
      required: [productId, quantity, qualifiedQty, defectiveQty, remark]
      properties:
        stockBillItemId: { type: string, nullable: true, description: 编辑草稿时传明细 ID；新增明细时不传 }
        productId: { type: string, description: 产品 ID，后端保存当前产品编码、名称和单位快照 }
        quantity: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.01, description: 本次出入库业务真实值，最多两位小数；后端按产品数量精度校验并按 100 倍整数持久化 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 采购入库或销售退货的合格数量，其他类型传 0 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 采购入库或销售退货的不合格数量，其他类型传 0 }
        remark: { type: string, maxLength: 500 }

    StockBillCreateRequest:
      type: object
      required: [billType, sourceNo, warehouseId, manualReason, items, remark]
      properties:
        billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT], description: 手工补录或库存调整类型 }
        sourceNo: { type: string, maxLength: 64, description: 非调整类型必填原业务单号；调整类型传空字符串，由后端生成调整单号 }
        warehouseId: { type: string, description: 启用状态的仓库 ID }
        manualReason: { type: string, minLength: 1, maxLength: 500, description: 补录原因或库存调整原因，必填 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StockBillDraftItemRequest' }
        remark: { type: string, maxLength: 500 }

    StockBillUpdateRequest:
      type: object
      required: [sourceNo, manualReason, items, remark]
      properties:
        sourceNo: { type: string, maxLength: 64, description: 手工补录草稿可维护原业务单号；其他录入方式保持原值 }
        manualReason: { type: string, maxLength: 500, description: 手工补录或调整草稿必填；来源生成草稿保持原值 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StockBillDraftItemRequest' }
        remark: { type: string, maxLength: 500 }

    StockBillPage:
      type: object
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StockBill' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/StockBillSummary' }

    StockBillSummary:
      type: object
      required: [stockBillCount, inboundCount, outboundCount, confirmedCount]
      properties:
        stockBillCount: { type: integer, minimum: 0, description: 当前筛选范围内出入库流水数 }
        inboundCount: { type: integer, minimum: 0, description: 当前筛选范围内入库类型流水数 }
        outboundCount: { type: integer, minimum: 0, description: 当前筛选范围内出库类型流水数 }
        confirmedCount: { type: integer, minimum: 0, description: 当前筛选范围内状态为 CONFIRMED 的流水数 }

    StockBill:
      type: object
      required: [stockBillId, billNo, billType, sourceType, sourceId, sourceNo, entryMode, warehouseId, warehouseName, status, itemCount, confirmedById, confirmedByName, confirmedAt, createdById, createdByName, responsibleById, responsibleByName, createTime, updateTime]
      properties:
        stockBillId: { type: string, description: 对应 `stock_bill.id`，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 对应 `stock_bill.bill_no` }
        billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT], description: 对应 `stock_bill.bill_type` }
        sourceType: { type: string, enum: [PURCHASE_ORDER, SALES_ORDER, PURCHASE_RETURN_ORDER, SALES_RETURN_ORDER, STOCK_ADJUST], description: 对应 `stock_bill.source_type` }
        sourceId: { type: string, nullable: true, description: 对应 `stock_bill.source_id`，BIGINT 按字符串传输 }
        sourceNo: { type: string, maxLength: 64, description: 对应 `stock_bill.source_no` }
        entryMode: { type: string, enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT], description: 对应 `stock_bill.entry_mode`，区分来源生成、手工补录和手工调整 }
        warehouseId: { type: string, description: 对应 `stock_bill.warehouse_id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 对应 `stock_bill.warehouse_name` }
        status: { type: string, enum: [DRAFT, CONFIRMED, CANCELLED], description: 对应 `stock_bill.status` }
        itemCount: { type: integer, minimum: 0, description: 按 `stock_bill_item.bill_id` 聚合的明细条数 }
        confirmedById: { type: string, nullable: true, description: 对应 `stock_bill.confirmed_by_id`，BIGINT 按字符串传输 }
        confirmedByName: { type: string, maxLength: 100, description: 对应 `stock_bill.confirmed_by_name` }
        confirmedAt: { type: string, nullable: true, description: 对应 `stock_bill.confirmed_at` }
        createdById: { type: string, nullable: true, description: 对应 `stock_bill.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 对应 `stock_bill.created_by_name` }
        responsibleById: { type: string, description: 对应 `stock_bill.responsible_by_id`；手工单据由后端取当前登录用户 }
        responsibleByName: { type: string, maxLength: 100, description: 对应 `stock_bill.responsible_by_name` }
        createTime: { type: string, description: 对应 `stock_bill.create_time` }
        updateTime: { type: string, description: 对应 `stock_bill.update_time` }

    StockBillDetail:
      allOf:
        - $ref: '#/components/schemas/StockBill'
        - type: object
          required: [manualReason, remark, items]
          properties:
            manualReason: { type: string, maxLength: 500, description: 对应 `stock_bill.manual_reason`；来源生成凭证为空字符串 }
            remark: { type: string, maxLength: 500, description: 对应 `stock_bill.remark` }
            items:
              type: array
              items: { $ref: '#/components/schemas/StockBillItem' }

    StockBillItem:
      type: object
      required: [stockBillItemId, stockBillId, billNo, sourceItemId, productId, productCode, productName, unitName, quantityPrecision, quantity, qualifiedQty, defectiveQty, beforeQty, changeQty, afterQty, createTime, updateTime, remark]
      properties:
        stockBillItemId: { type: string, description: 对应 `stock_bill_item.id`，BIGINT 按字符串传输 }
        stockBillId: { type: string, description: 对应 `stock_bill_item.bill_id`，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 对应 `stock_bill_item.bill_no` }
        sourceItemId: { type: string, nullable: true, description: 对应 `stock_bill_item.source_item_id`，BIGINT 按字符串传输 }
        productId: { type: string, description: 对应 `stock_bill_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `stock_bill_item.product_code` }
        productName: { type: string, maxLength: 200, description: 对应 `stock_bill_item.product_name` }
        unitName: { type: string, maxLength: 32, description: 对应 `stock_bill_item.unit_name` }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 对应 `stock_bill_item.quantity_precision`，产品数量精度快照 }
        quantity: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.quantity` 按 100 倍整数存储，Service 层负责转换 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.qualified_qty` 按 100 倍整数存储 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.defective_qty` 按 100 倍整数存储 }
        beforeQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.before_qty` 按 100 倍整数存储 }
        changeQty: { type: number, format: double, multipleOf: 0.01, description: 业务真实值，入库为正、出库为负；数据库按 100 倍整数存储 }
        afterQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.after_qty` 按 100 倍整数存储 }
        createTime: { type: string, description: 对应 `stock_bill_item.create_time` }
        updateTime: { type: string, description: 对应 `stock_bill_item.update_time` }
        remark: { type: string, maxLength: 500, description: 对应 `stock_bill_item.remark` }

    WarehouseStock:
      type: object
      required: [stockId, warehouseId, warehouseCode, warehouseName, productId, productCode, productName, unitName, stockQty, lockedQty, availableQty, safetyStockQty, updateTime]
      properties:
        stockId:
          type: string
          description: 库存 ID，对应 `warehouse_stock.id`，BIGINT 按字符串传输
        warehouseId:
          type: string
          description: 仓库 ID，对应 `warehouse_stock.warehouse_id`，BIGINT 按字符串传输
        warehouseCode: { type: string, maxLength: 64, description: 对应 `warehouse_stock.warehouse_code` }
        warehouseName: { type: string, maxLength: 100, description: 对应 `warehouse_stock.warehouse_name` }
        productId:
          type: string
          description: 产品 ID，对应 `warehouse_stock.product_id`，BIGINT 按字符串传输
        productCode: { type: string, maxLength: 64, description: 对应 `warehouse_stock.product_code` }
        productName: { type: string, maxLength: 200, description: 对应 `warehouse_stock.product_name` }
        unitName: { type: string, maxLength: 32, description: 对应 `warehouse_stock.unit_name` }
        stockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 当前库存业务真实值；数据库 `warehouse_stock.stock_qty` 按 100 倍整数存储 }
        lockedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 锁定库存业务真实值；数据库 `warehouse_stock.locked_qty` 按 100 倍整数存储 }
        availableQty: { type: number, format: double, minimum: 0, description: 服务层计算 `stock_qty - locked_qty` }
        safetyStockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 安全库存业务真实值；数据库 `product.safety_stock_qty` 按 100 倍整数存储 }
        updateTime: { type: string, description: 对应 `warehouse_stock.update_time` }

    WarehouseStockSummary:
      type: object
      required: [stockRecordCount, warehouseCount, productCount, lowStockCount]
      properties:
        stockRecordCount: { type: integer, minimum: 0, description: 当前筛选范围内库存余额记录数 }
        warehouseCount: { type: integer, minimum: 0, description: 当前筛选范围内去重仓库数 }
        productCount: { type: integer, minimum: 0, description: 当前筛选范围内去重产品数 }
        lowStockCount: { type: integer, minimum: 0, description: 当前筛选范围内 `0 < available_qty <= safety_stock_qty` 的记录数 }

    WarehousePage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Warehouse' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    Warehouse:
      type: object
      required: [warehouseId, warehouseCode, warehouseName, contactName, contactPhone, address, status, remark, createTime, updateTime]
      properties:
        warehouseId:
          type: string
          description: 仓库 ID，对应 `warehouse.id`，BIGINT 按字符串传输
        warehouseCode:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
          description: 仓库编码，对应 `warehouse.warehouse_code`，由后端生成、全局唯一且创建后不可修改
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }
        createTime: { type: string }
        updateTime: { type: string }

    WarehouseCreateRequest:
      type: object
      required: [warehouseName, contactName, contactPhone, address, status, remark]
      properties:
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    WarehouseUpdateRequest:
      type: object
      required: [warehouseName, contactName, contactPhone, address, status, remark]
      properties:
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    WarehouseStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1] }

    WarehouseBatchStatusRequest:
      type: object
      required: [warehouseIds, status]
      properties:
        warehouseIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status: { type: integer, enum: [0, 1] }

    WarehouseBatchDeleteRequest:
      type: object
      required: [warehouseIds]
      properties:
        warehouseIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    ProductPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    Product:
      type: object
      required:
        - productId
        - productCode
        - productName
        - categoryName
        - brandName
        - unitName
        - quantityPrecision
        - specification
        - referencePurchasePrice
        - referenceSalePrice
        - safetyStockQty
        - status
        - remark
        - createTime
        - updateTime
      properties:
        productId:
          type: string
          description: 产品 ID，对应 `product.id`
        productCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 产品编码，对应 `product.product_code`，由后端生成、全局唯一且创建后不可修改
        productName:
          type: string
          minLength: 1
          maxLength: 200
          description: 产品名称，对应 `product.product_name`
        categoryId:
          type: string
          nullable: true
          description: 分类 ID，对应 `product.category_id`
        categoryName:
          type: string
          nullable: true
          readOnly: true
          description: 分类展示名称，由后端按 `category_id` 关联 `product_category.category_name` 返回，不在产品表冗余存储；未分类时返回 `null`，无需拼装为空字符串或层级路径
        brandName:
          type: string
          maxLength: 100
        unitName:
          type: string
          minLength: 1
          maxLength: 32
        quantityPrecision:
          type: integer
          minimum: 0
          maximum: 2
          description: 产品数量允许的小数位，箱、瓶、个等离散单位通常为 0，最多保留两位小数
        specification:
          type: string
          maxLength: 255
        barcode:
          type: string
          nullable: true
          maxLength: 64
        referencePurchasePrice:
          type: number
          format: double
          minimum: 0
        referenceSalePrice:
          type: number
          format: double
          minimum: 0
        safetyStockQty:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: 业务真实值；数据库按 100 倍整数存储
        status:
          type: integer
          enum: [0, 1]
        remark:
          type: string
          maxLength: 500
        createTime: { type: string }
        updateTime: { type: string }

    ProductFormRequest:
      type: object
      required:
        - productName
        - categoryId
        - brandName
        - unitName
        - quantityPrecision
        - specification
        - barcode
        - referencePurchasePrice
        - referenceSalePrice
        - safetyStockQty
        - status
        - remark
      properties:
        productName: { type: string, minLength: 1, maxLength: 200 }
        categoryId:
          type: string
          nullable: true
        brandName: { type: string, maxLength: 100 }
        unitName: { type: string, minLength: 1, maxLength: 32 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2 }
        specification: { type: string, maxLength: 255 }
        barcode:
          type: string
          nullable: true
          maxLength: 64
        referencePurchasePrice: { type: number, format: double, minimum: 0 }
        referenceSalePrice: { type: number, format: double, minimum: 0 }
        safetyStockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库按 100 倍整数存储 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    ProductStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1] }

    ProductBatchStatusRequest:
      type: object
      required: [productIds, status]
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status: { type: integer, enum: [0, 1] }

    ProductBatchDeleteRequest:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    ProductCategory:
      type: object
      required: [categoryId, parentId, categoryName, status, productCount, createTime, updateTime]
      properties:
        categoryId:
          type: string
          description: 分类 ID，对应 `product_category.id`
        parentId:
          type: string
          description: 上级分类 ID，对应 `product_category.parent_id`；顶级分类为 `"0"`
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，对应 `product_category.category_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        productCount:
          type: integer
          minimum: 0
          description: 当前分类直接关联的未删除产品数量，通过 `product.category_id` 聚合，不包含下级分类产品
        createTime:
          type: string
          description: 创建时间，对应 `product_category.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `product_category.update_time`

    ProductCategoryCreateRequest:
      type: object
      required: [parentId, categoryName, status]
      properties:
        parentId:
          type: string
          description: 上级分类 ID；顶级分类传 `"0"`
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，提交前去除首尾空格，同一上级下不能重复
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryUpdateRequest:
      type: object
      required: [parentId, categoryName, status]
      properties:
        parentId:
          type: string
          description: 上级分类 ID；禁止设置为自身或自身下级
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，提交前去除首尾空格，同一上级下不能重复
        status:
          type: integer
          enum: [0, 1]
          description: 状态修改必须遵守分类父子级联约束

    ProductCategoryStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryBatchStatusRequest:
      type: object
      required: [categoryIds, status]
      properties:
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryBatchDeleteRequest:
      type: object
      required: [categoryIds]
      properties:
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
