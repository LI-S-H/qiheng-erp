      operationId: purchaseSupplierProductPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: supplierId
          in: query
          schema: { type: string }
          description: 供应商 ID，对应 `supplier_product.supplier_id`，使用精确匹配
        - name: supplierName
          in: query
          schema: { type: string, maxLength: 200 }
          description: 供应商名称，对应 `supplier_product.supplier_name` 冗余快照，使用包含匹配；采购订单供应商选择按此参数请求第一页候选并提取 distinct 供应商
        - name: productCode
          in: query
