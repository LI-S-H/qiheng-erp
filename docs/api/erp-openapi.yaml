        - $ref: '#/components/parameters/SupplierProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseSupplierProductFormRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseSupplierProduct' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [PurchaseSupplierProduct]
      summary: 删除供货产品
      description: 逻辑删除供货产品；已被采购明细引用时返回 409。本接口 MVP 阶段复用 `purchase:create` 权限。
      operationId: purchaseSupplierProductDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SupplierProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 删除成功
