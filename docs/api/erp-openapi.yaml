openapi: 3.0.3
info:
  title: 启衡 ERP 接口文档
  version: 0.8.0
  description: |
    本文档用于启衡 ERP 前后端接口约定，可直接导入 Apifox 使用。
    当前版本包含登录模块、工作台、系统权限模块、产品模块、仓库库存模块、采购模块、销售模块和统一退货模块。
    MVP 阶段认证使用 Sa-Token 原始 token。登录接口返回 `token` 和 `tokenName`，前端后续请求必须使用返回的 `tokenName` 作为请求头名称、`token` 作为请求头值；当前默认配置为 `satoken`。
servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
tags:
  - name: Dashboard
    description: 工作台与顶栏通知 - 经营概览、待办摘要、库存风险和关键排行
  - name: AIAssistant
    description: 智能助手 - 智能经营助手、经营任务中心和受控 AI Workflow 入口
  - name: Auth
    description: 登录、退出和当前用户接口
  - name: SystemUser
    description: 系统权限 - 用户管理
  - name: SystemRole
    description: 系统权限 - 角色管理
  - name: SystemDept
    description: 系统权限 - 部门管理
  - name: SystemPermission
    description: 系统权限 - 权限码配置
  - name: SystemOption
    description: 系统权限 - 页面下拉选项
  - name: ProductCategory
    description: 产品中心 - 产品分类管理
  - name: Product
    description: 产品中心 - 产品档案管理
  - name: Warehouse
    description: 仓储库存 - 仓库管理
  - name: WarehouseStock
    description: 仓储库存 - 当前库存余额查询
  - name: PurchaseSupplier
    description: 采购管理 - 供应商管理
  - name: PurchaseSupplierProduct
    description: 采购管理 - 供货产品管理
  - name: PurchaseOrder
    description: 采购管理 - 采购订单管理
  - name: SalesCustomer
    description: 销售管理 - 客户管理
  - name: SalesOrder
    description: 销售管理 - 销售订单管理
  - name: Return
    description: 统一退货管理 - 通过 returnType 区分采购退货和销售退货，统一处理申请、审核与仓库执行跟踪
paths:
  /dashboard/inventory-status:
    get:
      tags: [Dashboard]
      summary: Dashboard inventory status
      description: Returns one bucket per inventory-health state and at most five risk previews. Omit warehouseId for all warehouses. Every count and preview row represents one warehouse-product inventory record; inventory is never aggregated across warehouses. When access.state is DENIED both distribution and riskPreview.items are empty arrays - zero-count placeholders are never returned, so callers must branch on access.state instead of reading counts.
      operationId: dashboardInventoryStatus
      security: [{ SaTokenAuth: [] }]
      parameters:
        - name: warehouseId
          in: query
          required: false
          description: Warehouse ID. Omit for all warehouses.
          schema: { type: string }
      responses:
        "200":
          description: Query success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardInventoryStatus' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /ai/assistant/overview:
    get:
      tags: [AIAssistant]
      summary: 获取智能经营助手概览
      description: |
        返回智能经营助手首屏需要的会话列表和参数化快捷任务。页面不再展示“能力边界”“当前上下文”、顶部智能体标签或知识库问答入口。
        推荐后端采用 Spring AI Alibaba 的多智能体能力：主控智能体负责意图识别、任务拆解和结果汇总，数据分析、采购建议、库存分析、销量预测、供应商评估等专家智能体负责各自领域分析。
        实际业务数据查询仍必须由受控 Tool 经过权限校验和 ERP Service 完成，专家智能体不能直接执行自由 SQL 或直接修改正式业务数据。
      operationId: aiAssistantOverview
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiAssistantOverview' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ai/assistant/messages:
    post:
      tags: [AIAssistant]
      summary: 发送智能经营助手消息
      description: |
        统一的经营助手对话入口。后端基于 Spring AI Alibaba 实现多智能体协同：主控智能体路由到数据分析、采购建议、库存分析、销量预测、供应商评估等专家智能体，并在 `agentTraces` 中返回本轮协同轨迹。
        `conversationId` 为空时创建新会话；不为空时追加到已有会话。后端应记录必要的 AI 交互日志，但不再提供独立“AI 调用审计”业务菜单页面。
        回复可以包含 `message.content` 文本和 `message.charts` 图表规格。后端不返回图表图片，只返回图表类型、字段映射和业务数据行；前端按统一样式动态渲染折线图、柱状图或饼图。
        如果使用流式传输，客户端通过 `Accept: text/event-stream` 请求，后端按 `AiChatStreamEvent` 事件推送：先推 `MESSAGE_DELTA` 文本增量，最后通过 `MESSAGE_FINAL` 返回完整 `AiChatMessage`（包含 charts、sources、actionCards），避免模型在流中自由拼装不可校验图表数据。
        需要进入业务动作的回复通过 `actionCards` 表达下一步。前端遵循“AI 建议 -> 用户预览 -> 生成草稿 -> 人工确认 -> 正式单据”的边界；后端不得让智能体直接修改正式业务数据。
      operationId: aiAssistantSendMessage
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
            example:
              conversationId: null
              message: 帮我分析当前库存风险，并给出需要优先补货的商品
      responses:
        "200":
          description: 回复成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiChatResponse' }
            text/event-stream:
              schema:
                type: string
              examples:
                delta:
                  summary: 流式事件示例
                  value: |
                    event: MESSAGE_DELTA
                    data: {"requestId":"req-001","conversationId":"conv-today","contentDelta":"正在分析 USB-C扩展坞库存..."}

                    event: MESSAGE_FINAL
                    data: {"requestId":"req-001","conversationId":"conv-today","message":{"messageId":"msg-001","role":"assistant","content":"建议生成补货草稿。","createdAt":"2026-07-01 10:30:00","charts":[],"actionCards":[],"sources":[],"agentTraces":[],"taskCard":null}}
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /ai/assistant/conversations:
    post:
      tags: [AIAssistant]
      summary: 新建经营助手会话
      description: 创建一个空会话。后端返回会话摘要，前端切换到该会话并显示过渡加载。
      operationId: aiAssistantConversationCreate
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiConversationSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ai/assistant/conversations/{conversationId}:
    patch:
      tags: [AIAssistant]
      summary: 修改经营助手会话名称
      operationId: aiAssistantConversationUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
          description: 会话 ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiConversationUpdateRequest' }
            example:
              title: 今日补货讨论
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiConversationSummary' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [AIAssistant]
      summary: 删除经营助手会话
      operationId: aiAssistantConversationDelete
      security:
        - SaTokenAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
          description: 会话 ID
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /ai/assistant/conversations/{conversationId}/messages:
    get:
      tags: [AIAssistant]
      summary: 分页查询经营助手会话消息
      description: |
        只返回当前登录用户所属且未删除会话的真实持久化消息。不存在、已删除和属于其他用户的会话统一返回 404，避免通过错误差异枚举会话。
        消息按 `create_time ASC, id ASC` 稳定排序。前端从第 1 页开始拉取并根据总数加载全部分页，跨页按 `messageId` 去重；切换会话时必须取消或丢弃旧会话请求结果。
      operationId: aiAssistantConversationMessages
      security:
        - SaTokenAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
          description: 当前用户会话 ID
        - name: pageNum
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功；空会话返回空 records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiConversationMessagePage' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /ai/scheduled-tasks:
    get:
      tags: [AIAssistant]
      summary: 获取经营任务中心数据
      description: |
        返回经营任务中心首屏数据，包括任务摘要、内置模板、已配置任务和最近执行记录。任务由后端调度器触发多智能体协同分析，执行结果直接在本页面展示。
        任务配置必须允许指定商品范围、仓库范围、接收人和分析目标。例如采购补货建议任务应明确关注商品，不能只有一个泛化定时器。
      operationId: aiScheduledTaskPage
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTaskPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [AIAssistant]
      summary: 新增经营任务
      description: 新增用户自定义经营任务。任务可以由内置模板带入，也可以完全自定义；保存后进入调度配置，不立即写入业务单据。
      operationId: aiScheduledTaskCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiScheduledTaskUpdateRequest'
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ai/scheduled-tasks/{taskId}:
    patch:
      tags: [AIAssistant]
      summary: 编辑经营任务配置
      description: |
        修改经营任务的可编辑配置，包括任务名称、执行频率、cron、关注商品、关注仓库、接收人和分析目标。
        不允许通过本接口修改系统生成字段、执行结果、审计字段或任务执行状态；启停状态使用 `/ai/scheduled-tasks/{taskId}/status`。
      operationId: aiScheduledTaskUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
          description: AI 定时任务 ID，BIGINT 或稳定任务编码按字符串传输
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiScheduledTaskUpdateRequest'
            example:
              taskName: 采购补货建议
              frequency: DAILY
              cronExpression: "0 0 10 * * ?"
              productIds: ["1920000000000000007", "1920000000000000013", "1920000000000000008"]
              warehouseIds: ["1930000000000000001", "1930000000000000002"]
              recipientRoleIds: ["1880000000000000002"]
              analysisGoal: 根据指定商品的销量预测、当前库存、安全库存、在途采购和供应商评分给出补货建议。
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /ai/scheduled-tasks/{taskId}/run:
    post:
      tags: [AIAssistant]
      summary: 立即执行经营任务
      description: 手动触发一次定时经营任务。后端创建执行记录并异步调度多智能体协同分析，接口只返回已受理的执行标识；执行结果写入最近执行记录，不直接生成正式业务单据。
      operationId: aiScheduledTaskRun
      security:
        - SaTokenAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
          description: AI 定时任务 ID，BIGINT 或稳定任务编码按字符串传输
      responses:
        "200":
          description: 已受理执行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTaskRunAccepted' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /ai/scheduled-tasks/{taskId}/status:
    patch:
      tags: [AIAssistant]
      summary: 修改经营任务状态
      description: 启用或停用内置经营任务。状态变更是调度配置动作，不代表业务事实变更；后端需要记录操作人和更新时间。
      operationId: aiScheduledTaskStatus
      security:
        - SaTokenAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
          description: AI 定时任务 ID，BIGINT 或稳定任务编码按字符串传输
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiScheduledTaskStatusRequest'
            example:
              status: ENABLED
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                code: 0
                message: success
                data:
                  token: 5f4dcc3b-0000-4000-9000-000000000001
                  tokenName: satoken
                  user:
                    userId: "1900000000000000001"
                    username: admin
                    realName: 系统管理员
                    deptId: "1900000000000000100"
                    deptName: 行政部
                    isAdmin: true
                    roleCodes:
                      - SUPER_ADMIN
                    permissionCodes:
                      - "*"
                    lastLoginAt: "2026-06-08 09:12:30"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags:
        - Auth
      summary: 获取当前登录用户
      operationId: authMe
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUser'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 退出登录
      operationId: authLogout
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /system/users:
    get:
      tags:
        - SystemUser
      summary: 分页查询用户
      description: 仅传需要生效的筛选参数；未传参数表示不限制该字段。多个筛选参数同时存在时按 AND 条件组合。
      operationId: systemUserPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: 登录账号，对应 `sys_user.username`，使用包含匹配
        - name: realName
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 用户姓名，对应 `sys_user.real_name`，使用包含匹配
        - name: deptId
          in: query
          required: false
          schema:
            type: string
          description: 所属部门 ID，对应 `sys_user.dept_id`
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: 绑定角色 ID，对应 `sys_user_role.role_id`
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: 状态，1 启用，0 停用；不筛选状态时不传该参数
        - name: pageNum
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每页条数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUserPage'
              example:
                code: 0
                message: success
                data:
                  records:
                    - userId: "1900000000000000001"
                      username: admin
                      realName: 系统管理员
                      deptId: "1900000000000000100"
                      deptName: 行政部
                      isAdmin: true
                      status: 1
                      roleIds:
                        - "1900000000000001001"
                      roleNames:
                        - 超级管理员
                      lastLoginAt: "2026-06-08 09:12:30"
                      createTime: "2026-06-05 20:30:00"
