                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Warehouse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Warehouse]
      summary: 编辑仓库
      description: 仓库编码创建后不可修改，编辑请求不接收 `warehouseCode`。仓库名称修改时，后端必须在同一事务内同步 `warehouse_stock.warehouse_name`，已生成的出入库凭证继续保留历史快照名称。本接口需要 `warehouse:manage` 权限。
      operationId: warehouseUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Warehouse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Warehouse]
      summary: 删除仓库
      description: 逻辑删除仓库；存在 `warehouse_stock` 库存余额或入库单、出库单、库存流水时返回 409。本接口需要 `warehouse:manage` 权限。
      operationId: warehouseDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/warehouses/{warehouseId}/status:
    patch:
      tags: [Warehouse]
      summary: 修改仓库状态
      description: 停用后仓库不能用于新业务单据和库存调整，历史单据与库存余额不受影响。本接口需要 `warehouse:manage` 权限。
