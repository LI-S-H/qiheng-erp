  /ai/assistant/overview:
    get:
      tags: [AIAssistant]
      summary: 获取智能经营助手概览
      description: |
        返回智能经营助手首屏需要的会话列表和参数化快捷任务。页面不再展示“能力边界”“当前上下文”、顶部智能体标签或知识库问答入口。
        推荐后端采用 Spring AI Alibaba 的多智能体能力：主控智能体负责意图识别、任务拆解和结果汇总，数据分析、采购建议、库存分析、销量预测、供应商评估等专家智能体负责各自领域分析。
        实际业务数据查询仍必须由受控 Tool 经过权限校验和 ERP Service 完成，专家智能体不能直接执行自由 SQL 或直接修改正式业务数据。
      operationId: aiAssistantOverview
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiAssistantOverview' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ai/assistant/messages:
    post:
      tags: [AIAssistant]
      summary: 发送智能经营助手消息
      description: |
        统一的经营助手对话入口。后端基于 Spring AI Alibaba 实现多智能体协同：主控智能体路由到数据分析、采购建议、库存分析、销量预测、供应商评估等专家智能体，并在 `agentTraces` 中返回本轮协同轨迹。
        `conversationId` 为空时创建新会话；不为空时追加到已有会话。后端应记录必要的 AI 交互日志，但不再提供独立“AI 调用审计”业务菜单页面。
        回复可以包含 `message.content` 文本和 `message.charts` 图表规格。后端不返回图表图片，只返回图表类型、字段映射和业务数据行；前端按统一样式动态渲染折线图、柱状图或饼图。
        如果使用流式传输，客户端通过 `Accept: text/event-stream` 请求，后端按 `AiChatStreamEvent` 事件推送：先推 `MESSAGE_DELTA` 文本增量，最后通过 `MESSAGE_FINAL` 返回完整 `AiChatMessage`（包含 charts、sources、actionCards），避免模型在流中自由拼装不可校验图表数据。
        需要进入业务动作的回复通过 `actionCards` 表达下一步。前端遵循“AI 建议 -> 用户预览 -> 生成草稿 -> 人工确认 -> 正式单据”的边界；后端不得让智能体直接修改正式业务数据。
      operationId: aiAssistantSendMessage
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
            example:
              conversationId: null
              message: 帮我分析当前库存风险，并给出需要优先补货的商品
      responses:
        "200":
          description: 回复成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiChatResponse' }
            text/event-stream:
              schema:
                type: string
              examples:
                delta:
                  summary: 流式事件示例
                  value: |
                    event: MESSAGE_DELTA
                    data: {"requestId":"req-001","conversationId":"conv-today","contentDelta":"正在分析 USB-C扩展坞库存..."}

                    event: MESSAGE_FINAL
                    data: {"requestId":"req-001","conversationId":"conv-today","message":{"messageId":"msg-001","role":"assistant","content":"建议生成补货草稿。","createdAt":"2026-07-01 10:30:00","charts":[],"actionCards":[],"sources":[],"agentTraces":[],"taskCard":null}}
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "503": { $ref: '#/components/responses/ServiceUnavailable' }

  /ai/assistant/conversations:
    post:
      tags: [AIAssistant]
      summary: 新建经营助手会话
      description: 创建一个空会话。后端返回会话摘要，前端切换到该会话并显示过渡加载。
      operationId: aiAssistantConversationCreate
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiConversationSummary' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ai/assistant/conversations/{conversationId}:
    patch:
      tags: [AIAssistant]
      summary: 修改经营助手会话名称
      operationId: aiAssistantConversationUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
          description: 会话 ID
      requestBody:
        required: true
        content:
