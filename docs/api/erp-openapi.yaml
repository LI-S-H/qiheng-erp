        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /returns/{returnOrderId}/approve:
    post:
      tags: [Return]
      summary: 审核统一退货单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。审核人逐明细提交审核数量；后端锁定来源明细并重新校验占用与可退数量。采购退货需要 `purchase:manage`，销售退货需要 `sales:manage`。
        审核采购退货时生成 `outbound_type=PURCHASE_RETURN`、`source_type=PURCHASE_RETURN_ORDER`、`entry_mode=SOURCE_GENERATED` 的待确认出库单；审核销售退货时生成 `inbound_type=SALES_RETURN`、`source_type=SALES_RETURN_ORDER`、`entry_mode=SOURCE_GENERATED` 的待确认入库单。审核不直接改变库存，实际库存变化由仓储确认完成。
      operationId: returnOrderApprove
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderApproveRequest' }
      responses:
        "200":
          description: 审核成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /returns/{returnOrderId}/cancel:
    post:
      tags: [Return]
      summary: 取消统一退货单
      description: 仅允许 `DRAFT`、`SUBMITTED` 或尚未产生处理数量的 `APPROVED` 进入 `CANCELLED`；部分执行后不得取消。采购退货需要 `purchase:manage`，销售退货需要 `sales:manage`。已生成但未确认的仓储工作单须在同一事务内取消。
      operationId: returnOrderCancel
      security:
        - SaTokenAuth: []
      parameters:
        - name: returnOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnOrderReasonActionRequest' }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/customers:
