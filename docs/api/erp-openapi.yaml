        - name: status
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: 状态，对应 `supplier_product.status`，1 启用，0 停用，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PurchaseSupplierProductPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
