    post:
      tags: [Warehouse]
      summary: 批量删除仓库
      description: 批量逻辑删除仓库；任一仓库存在 `warehouse_stock` 库存余额或入库单、出库单、库存流水时整批返回 409，避免破坏库存与业务追溯链路。本接口需要 `warehouse:manage` 权限。
