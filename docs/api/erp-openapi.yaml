  /sales/orders:
    get:
      tags: [SalesOrder]
      summary: 分页查询销售订单
      description: |
        查询未删除的 `sales_order` 单头数据，列表不返回明细数组；查看、编辑、提交或审核前通过详情接口按订单 ID 获取 `items`。销售单号使用包含匹配，客户、仓库和状态使用精确匹配，多个有效条件按 AND 组合。
        不接收含义不明确的 `keyword` 参数。列表摘要只展示当前页 `records` 派生的状态、出库等业务指标，不展示当前页行数；不得要求后端为了摘要额外全量聚合。
        本接口需要 `sales:query` 权限。
      operationId: salesOrderPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: salesNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 销售单号，对应 `sales_order.sales_no`，使用包含匹配
        - name: customerId
          in: query
          schema: { type: string }
          description: 客户 ID，对应 `sales_order.customer_id`，使用精确匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 出库仓库 ID，对应 `sales_order.warehouse_id`，使用精确匹配
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_OUTBOUND, OUTBOUND_DONE, CANCELLED]
          description: 销售订单状态，对应 `sales_order.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SalesOrder]
      summary: 新增销售订单草稿
      description: |
        销售单号、客户和产品快照、订单总金额、创建人和审计字段由后端维护，前端不提交；创建后状态为 `DRAFT`，不锁定库存、不生成出库单或库存流水。
        草稿阶段 `expectedDeliveryDate` 可为空；提交或审核前，后端必须校验单头预计发货日期非空。
        明细数量和金额使用业务真实值传输，数据库按 decimal 保存；后端必须校验客户、仓库、产品启用状态、产品数量精度，并重算主表 `total_amount`。
        本接口需要 `sales:create` 权限。
      operationId: salesOrderCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}:
    get:
      tags: [SalesOrder]
      summary: 获取销售订单详情
      description: 返回 `sales_order` 主表信息及按 `sales_order_item.sales_order_id` 查询的全部明细。本接口需要 `sales:query` 权限。
      operationId: salesOrderDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [SalesOrder]
      summary: 编辑销售订单
      description: |
        `DRAFT` 状态可由销售创建权限编辑；`SUBMITTED` 状态仍允许具备审核/审批权限的用户编辑客户、出库仓库、预计发货日期、备注和明细。
        `APPROVED`、`PARTIAL_OUTBOUND`、`OUTBOUND_DONE`、`CANCELLED` 不允许通过本接口修改；已产生出库事实的业务纠正应通过仓库出入库、冲销或反向业务单据处理。
        销售单号、状态、已锁定数量、已出库数量、创建人、提交人、审核人和审计字段由后端维护，前端不得提交。
        明细传入 `salesOrderItemId` 表示更新已有明细，不传表示新增明细，被移除的旧草稿明细由后端物理删除。
        后端必须重新校验权限、客户、仓库、产品、数量精度和价格，并重算主表 `total_amount`。本接口需要 `sales:create` 或审核/审批权限。
      operationId: salesOrderUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrderUpdateRequest' }
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SalesOrderDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}/submit:
    post:
      tags: [SalesOrder]
      summary: 提交销售订单
      description: |
        仅允许 `DRAFT -> SUBMITTED`。前端调用本接口前必须先通过详情数据向操作人展示完整销售单头和销售明细，并在二次确认后提交。
        提交时后端重新校验单头预计发货日期非空、客户、仓库、产品、数量价格和可用库存 `warehouse_stock.stock_qty - warehouse_stock.locked_qty`；锁定成功后更新 `warehouse_stock.locked_qty`、`sales_order_item.locked_qty` 和 `sales_order.locked_at`。
        本接口需要 `sales:create` 权限并保证重复请求幂等。
      operationId: salesOrderSubmit
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}/approve:
    post:
      tags: [SalesOrder]
      summary: 审核销售订单
      description: |
        仅允许 `SUBMITTED -> APPROVED`。前端调用本接口前必须先通过详情数据向审核人展示完整销售单头和销售明细，并在二次确认后审核通过。
        审核前后端必须重新校验预计发货日期、客户、仓库、产品、明细数量价格和库存锁定结果；如尚未锁定库存，审核流程必须在同一事务内先完成库存锁定。
        审核通过后，后端在同一事务内生成仓库模块 `SALES_OUT` 待确认出库单，`source_type = SALES_ORDER`、`source_id = sales_order.id`、`source_no = sales_order.sales_no`，并带入客户、出库仓库、销售数量、累计已出库和剩余未出库数量。
        销售订单审核后不直接扣减库存，也不生成库存流水；需要审核/审批权限并保证重复请求幂等。
      operationId: salesOrderApprove
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 审核成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /sales/orders/{salesOrderId}/cancel:
    post:
      tags: [SalesOrder]
      summary: 取消销售订单
      description: 仅允许 `DRAFT` 或 `SUBMITTED` 状态取消；若订单已锁定库存，后端必须在同一事务内释放 `warehouse_stock.locked_qty` 和 `sales_order_item.locked_qty`。已审核或已产生出库事实的销售订单不得直接取消。本接口需要 `sales:create` 权限并保证重复请求幂等。
      operationId: salesOrderCancel
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' }
      responses:
        "200":
          description: 取消成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stocks:
    get:
      tags: [WarehouseStock]
      summary: 分页查询当前库存
      description: |
        查询 `warehouse_stock` 当前库存余额，并关联 `product.safety_stock_qty` 用于库存健康判断。
        `availableQty` 由服务层按 `stock_qty - locked_qty` 计算；不同单位的库存数量不得跨产品汇总。
        仓库使用 `warehouseId` 精确匹配，产品编码和产品名称分别使用包含匹配；库存健康与占用情况是两个独立派生维度，多个有效条件按 AND 组合。
        库存健康：`NORMAL` 表示 `available_qty > safety_stock_qty`，`LOW_STOCK` 表示 `0 < available_qty <= safety_stock_qty`，`NO_AVAILABLE` 表示 `stock_qty > 0` 且 `available_qty = 0`，`OUT_OF_STOCK` 表示 `stock_qty = 0`。
        占用情况：`UNLOCKED` 表示 `locked_qty = 0`，`PARTIALLY_LOCKED` 表示 `0 < locked_qty < stock_qty`，`FULLY_LOCKED` 表示 `stock_qty > 0` 且 `locked_qty = stock_qty`。
        上述状态均为查询时派生，不在 `warehouse_stock` 中增加单一状态字段。
        库存余额列表使用无总数分页，后端不需要返回精确 `total`，也不需要为了分页执行额外 `COUNT(*)`；前端只展示当前页、上一页和下一页。
        本接口需要 `warehouse:query` 权限。
      operationId: warehouseStockPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `warehouse_stock.warehouse_id`，使用精确匹配
        - name: productCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 产品编码，对应 `warehouse_stock.product_code`，使用包含匹配
        - name: productName
          in: query
          schema: { type: string, maxLength: 200 }
          description: 产品名称，对应 `warehouse_stock.product_name`，使用包含匹配
        - name: inventoryHealth
          in: query
          schema:
            type: string
            enum: [NORMAL, LOW_STOCK, NO_AVAILABLE, OUT_OF_STOCK]
          description: 库存健康，由可用库存、当前库存和产品安全库存派生
        - name: riskOnly
          in: query
          schema: { type: boolean }
          description: 是否仅返回风险库存；true 时返回零库存、无可用库存或可用库存小于等于安全库存的记录，并与 inventoryHealth 按 AND 组合
        - name: reservationState
          in: query
          schema:
            type: string
            enum: [UNLOCKED, PARTIALLY_LOCKED, FULLY_LOCKED]
          description: 占用情况，由当前库存和锁定库存派生
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WarehouseStockPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /warehouse/inbound-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询入库单
      description: |
        查询 `inbound_bill` 入库单主表，并按 `inbound_bill_item.inbound_bill_id` 聚合返回明细条数和入库量摘要。
        入库单承接采购入库、销售退货入库和调整入库；采购订单审核后生成 `PENDING_CONFIRM` 入库单，但不直接改变库存。
        系统生成的待确认入库单初始本次入库量为 0 或空业务值，由仓库人员在确认前按实物到货数量填写；确认后剩余未入库由后端按采购数量、累计已入库和本次入库量计算。
        入库列表的“来源对象”列按单据类型显示供应商、客户或调整单的来源仓库；库存调整不自动生成反向入库单或出库单；列表只显示入库量摘要和状态；采购数量、累计已入库、本次入库量和确认后剩余未入库通过详情接口返回，并可在前端展开行中按需展示。
        人工补录可不关联来源，关联时必须从已有单据搜索选择并与非空 sourceId 同时提交；人工调整和历史迁移数据的 `sourceId`、`sourcePartyId` 可能为 null。前端应优先展示 `sourceNo`、`sourcePartyName` 快照，并将缺少来源关联的历史记录标识为“未关联来源”。
        本接口需要 `warehouse:query` 权限。
      operationId: inboundBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 入库单号，对应 `inbound_bill.inbound_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源单号，对应 `inbound_bill.source_no`，使用包含匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `inbound_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [PURCHASE_IN, SALES_RETURN, ADJUST_IN]
          description: 入库类型，对应 `inbound_bill.inbound_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `inbound_bill.entry_mode`
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED]
          description: 入库单状态，对应 `inbound_bill.status`
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/InboundBillPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WarehouseStockBill]
      summary: 新增手工入库单草稿
      description: 创建调整入库或补录采购入库、销售退货入库草稿。保存后不改变库存，确认入库后才生成库存流水。前端必须通过搜索下拉选择来源对象：采购入库选供应商、销售退货选客户、调整入库选来源仓库；`sourcePartyId` 和 `sourcePartyName` 由前端提交，后端直接存入主表快照。本接口需要 `warehouse:manage` 权限。
      operationId: inboundBillCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InboundBillCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/outbound-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询出库单
      description: |
        查询 `outbound_bill` 出库单主表，并按 `outbound_bill_item.outbound_bill_id` 聚合返回明细条数和出库量摘要。
        出库单承接销售出库、采购退货出库和调整出库；销售订单审核后生成 `PENDING_CONFIRM` 出库单，但不直接扣减库存。
        系统生成的待确认出库单初始本次出库量为 0 或空业务值，由仓库人员在确认前按实物发货数量填写；确认后剩余未出库由后端按销售数量、累计已出库和本次出库量计算。
        出库列表的“来源对象”列按单据类型显示客户、供应商或调整单的来源仓库；库存调整不自动生成反向入库单或出库单；列表只显示出库量摘要和状态；销售数量、累计已出库、本次出库量和确认后剩余未出库通过详情接口返回，并可在前端展开行中按需展示。
        人工补录可不关联来源，关联时必须从已有单据搜索选择并与非空 sourceId 同时提交；人工调整和历史迁移数据的 `sourceId`、`sourcePartyId` 可能为 null。前端应优先展示 `sourceNo`、`sourcePartyName` 快照，并将缺少来源关联的历史记录标识为“未关联来源”。
        本接口需要 `warehouse:query` 权限。
      operationId: outboundBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 出库单号，对应 `outbound_bill.outbound_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源单号，对应 `outbound_bill.source_no`，使用包含匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `outbound_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [SALES_OUT, PURCHASE_RETURN, ADJUST_OUT]
          description: 出库类型，对应 `outbound_bill.outbound_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `outbound_bill.entry_mode`
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED]
          description: 出库单状态，对应 `outbound_bill.status`
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OutboundBillPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WarehouseStockBill]
      summary: 新增手工出库单草稿
      description: 创建调整出库或补录销售出库、采购退货出库草稿。保存后不改变实际库存 `stockQty`，确认出库后才生成库存流水；仅手工调整出库按本次出库数量校验可用库存并预占 `lockedQty`，销售出库和采购退货出库消费来源单审核时已占用的锁定库存。非调整类型必须通过搜索下拉选择来源单据，选中后自动带入来源对象和明细；不支持手动录入来源单号。调整出库选择来源仓库；`sourcePartyId` 和 `sourcePartyName` 由前端提交，后端直接存入主表快照。本接口需要 `warehouse:manage` 权限。
      operationId: outboundBillCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboundBillCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询库存流水记录
      description: |
        查询 `stock_bill` 已确认库存流水主表，并按 `stock_bill_item.bill_id` 聚合返回 `itemCount`；列表不跨不同产品单位汇总数量。
        入库单和出库单的创建、编辑、提交与确认使用 `/warehouse/inbound-bills`、`/warehouse/outbound-bills` 及工作单操作接口；本路径只读返回已经确认并实际改变库存的流水事实。
        流水号和来源业务单号分别使用包含匹配，仓库、来源业务类型、出入库类型和录入方式使用精确匹配，多个有效条件按 AND 组合。来源业务类型是由出入库类型稳定推导的展示字段，不作为 `stock_bill` 的持久化列；后端实现 `sourceType` 查询时必须映射为对应的 `billType` 集合后过滤。列表只返回单头和 `itemCount`；需要产品变动前后数量时按流水 ID 调用详情接口，避免分页列表重复携带明细数组。
        入库类型为 `PURCHASE_IN`、`SALES_RETURN`、`ADJUST_IN`；出库类型为 `SALES_OUT`、`PURCHASE_RETURN`、`ADJUST_OUT`。
        本接口只用于追溯库存凭证，需要 `warehouse:query` 权限。
      operationId: stockBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 库存流水号，对应 `stock_bill.bill_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源业务单号，对应 `stock_bill.business_source_no`，使用包含匹配
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [PURCHASE_ORDER, SALES_ORDER, PURCHASE_RETURN_ORDER, SALES_RETURN_ORDER, STOCK_ADJUST]
          description: |
            来源业务类型，精确匹配；这是派生查询参数，不对应 `stock_bill` 持久化列。
            后端实现备注：`PURCHASE_ORDER -> PURCHASE_IN`、`SALES_ORDER -> SALES_OUT`、`PURCHASE_RETURN_ORDER -> PURCHASE_RETURN`、`SALES_RETURN_ORDER -> SALES_RETURN`、`STOCK_ADJUST -> ADJUST_IN/ADJUST_OUT`，再按映射后的 `billType IN (...)` 过滤。
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `stock_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT]
          description: 出入库类型，对应 `stock_bill.bill_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `stock_bill.entry_mode`，使用精确匹配；分别表示系统自动录入、人工补录和人工调整
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockLedgerPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /warehouse/stock-bills/{stockLedgerId}:
    get:
      tags: [WarehouseStockBill]
      summary: 获取库存流水变动明细
      description: 返回一条已确认库存流水及全部 `stock_bill_item` 明细，用于展开查看产品、单位、变动前数量、合格数量、不合格数量、正负变动数量、变动后数量和备注。该资源只读，需要 `warehouse:query` 权限。
      operationId: stockBillDetail
      security:
        - SaTokenAuth: []
      parameters:
        - name: stockLedgerId
          in: path
          required: true
          schema: { type: string }
          description: 库存流水 ID，对应 `stock_bill.id`，BIGINT 按字符串传输
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockLedgerDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /warehouse/inbound-bills/{inboundBillId}:
    get:
      tags: [WarehouseStockBill]
      summary: 获取入库单详情
      description: 仅查询 `inbound_bill` 及其明细。人工补录可不关联系统来源；未关联时 `sourceId`、`sourceNo` 和明细 `sourceItemId` 为空，来源对象仍保留线下业务快照。关联来源时 ID 与单号成对存在，前端优先展示 `sourceNo`、`sourcePartyName` 快照。已确认库存流水请使用只读的 `/warehouse/stock-bills` 查询接口；需要 `warehouse:query` 权限。
      operationId: inboundBillDetail
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InboundBillId' }]
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [WarehouseStockBill]
      summary: 编辑入库单草稿或待确认单
      description: 仅编辑 `inbound_bill`。`DRAFT` 可修改仓库；人工补录草稿可修改来源对象和来源关联，来源单仅支持搜索选择，可显式清除关联；调整入库草稿可修改来源仓库但调整单号保持不变；系统生成单据必须保持来源不变。`PENDING_CONFIRM` 锁定仓库、来源和产品结构，仅允许调整数量、质量数量和备注；需要 `warehouse:manage` 权限。
      operationId: inboundBillUpdate
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InboundBillId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockBillUpdateRequest' }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/inbound-bills/{inboundBillId}/submit:
    post:
      tags: [WarehouseStockBill]
      summary: 提交入库单草稿为待确认
      description: 仅允许 `DRAFT -> PENDING_CONFIRM`，不改变库存、不生成库存流水；需要 `warehouse:manage` 权限并保证幂等。
      operationId: inboundBillSubmit
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InboundBillId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' } } } }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/inbound-bills/{inboundBillId}/confirm:
    post:
      tags: [WarehouseStockBill]
      summary: 确认入库单
      description: 仅允许 `PENDING_CONFIRM -> CONFIRMED`。后端在同一事务内校验入库单与库存、生成库存流水并增加库存；`pendingQty` 为只读结果，前端不得提交；需要 `warehouse:manage` 权限并保证幂等。
      operationId: inboundBillConfirm
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/InboundBillId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' } } } }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/inbound-bills/{inboundBillId}/cancel:
    post:
      tags: [WarehouseStockBill]
      summary: 取消入库单草稿或待确认单
      description: 仅允许 `DRAFT/PENDING_CONFIRM -> CANCELLED`，不改变库存；需要 `warehouse:manage` 权限并保证幂等。
      operationId: inboundBillCancel
      security: [{ SaTokenAuth: [] }]
