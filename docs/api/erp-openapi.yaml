  /ai/assistant/conversations/{conversationId}/messages:
    get:
      tags: [AIAssistant]
      summary: 分页查询经营助手会话消息
      description: |
        只返回当前登录用户所属且未删除会话的真实持久化消息。不存在、已删除和属于其他用户的会话统一返回 404，避免通过错误差异枚举会话。
        消息按 `create_time ASC, id ASC` 稳定排序。前端从第 1 页开始拉取并根据总数加载全部分页，跨页按 `messageId` 去重；切换会话时必须取消或丢弃旧会话请求结果。
      operationId: aiAssistantConversationMessages
      security:
        - SaTokenAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string }
          description: 当前用户会话 ID
        - name: pageNum
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功；空会话返回空 records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiConversationMessagePage' }
