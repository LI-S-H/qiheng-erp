        updateTime: { type: string, description: 对应 `supplier.update_time` }
        updatedById: { type: string, nullable: true, readOnly: true, description: 对应 `supplier.updated_by_id`，BIGINT 按字符串传输；最后一次创建、编辑或启停操作的人 }
        updatedByName: { type: string, nullable: true, maxLength: 100, readOnly: true, description: 对应 `supplier.updated_by_name`；历史数据未记录时可为空 }

