openapi: 3.0.3
info:
  title: 启衡 ERP 接口文档
  version: 0.8.0
  description: |
    本文档用于启衡 ERP 前后端接口约定，可直接导入 Apifox 使用。
    当前版本包含登录模块、工作台、系统权限模块、产品模块、仓库库存模块、采购模块、采购退回模块、销售模块和销售退货模块。
    MVP 阶段认证使用 Sa-Token 原始 token。登录接口返回 `token` 和 `tokenName`，前端后续请求必须使用返回的 `tokenName` 作为请求头名称、`token` 作为请求头值；当前默认配置为 `satoken`。
servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
tags:
  - name: Dashboard
    description: 工作台与顶栏通知 - 经营概览、待办摘要、库存风险和关键排行
  - name: AIAssistant
    description: 智能助手 - 智能经营助手、经营任务中心和受控 AI Workflow 入口
  - name: Auth
    description: 登录、退出和当前用户接口
  - name: SystemUser
    description: 系统权限 - 用户管理
  - name: SystemRole
    description: 系统权限 - 角色管理
  - name: SystemDept
    description: 系统权限 - 部门管理
  - name: SystemPermission
    description: 系统权限 - 权限码配置
  - name: SystemOption
    description: 系统权限 - 页面下拉选项
  - name: ProductCategory
    description: 产品中心 - 产品分类管理
  - name: Product
    description: 产品中心 - 产品档案管理
  - name: Warehouse
    description: 仓储库存 - 仓库管理
  - name: WarehouseStock
    description: 仓储库存 - 当前库存余额查询
  - name: PurchaseSupplier
    description: 采购管理 - 供应商管理
  - name: PurchaseSupplierProduct
    description: 采购管理 - 供货产品管理
  - name: PurchaseOrder
    description: 采购管理 - 采购订单管理
  - name: PurchaseReturn
    description: 采购管理 - 采购退回申请、审核与仓库执行跟踪
  - name: SalesCustomer
    description: 销售管理 - 客户管理
  - name: SalesOrder
    description: 销售管理 - 销售订单管理
  - name: SalesReturn
    description: 销售管理 - 销售退货申请、审核与仓库执行跟踪
paths:
  /dashboard/notifications:
    get:
      tags: [Dashboard]
      summary: 获取顶栏通知铃铛摘要
      description: |
        返回当前登录用户在顶栏通知铃铛中可见的待处理摘要。该接口只承载待办数量和前 8 条待办，不返回经营趋势、订单流转、商品排行、供应商履约或完整库存预警，避免全局主布局频繁请求较重的 `/dashboard/overview`。
        后端必须按当前用户的模块权限、处理权限、指派用户、指派角色和指派部门裁剪数据；无权模块的数量、标题、描述和证据均不得返回。普通业务事项按采购、销售、仓储等业务状态聚合，系统异常只返回给具备异常处理权限或被指派的用户范围。
        本接口只返回 `status=PENDING` 的事项，并复用 `DashboardTodoItem`。`completionMode=AUTO` 的事项由对应业务状态变化自动完成；`TRACKED` 的系统异常只允许跳转查看详情。
        `pendingCount` 表示权限裁剪和业务去重后的待处理业务事项总量，不是未读数；前端打开弹层不得清零。聚合待办按其 `count` 计入总量，后端必须避免同一业务事实被不同聚合项重复计数。`highPriorityCount` 使用相同口径统计 `priority=HIGH` 的事项总量。
        `items` 最多返回排序后的前 8 条；排序先按 `sortWeight` 升序，再按 `priority`、处理模式和发生时间倒序兜底。完整待办仍通过 `/dashboard/overview` 在工作台查看。
        当前阶段不设计已读、未读、归档、搜索、批量处理或站外推送，因此本接口不返回 read 状态，也没有写操作接口。
      operationId: dashboardNotifications
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardNotificationPopover' }
              example:
                code: 0
                message: success
                data:
                  refreshedAt: "2026-07-10 10:30:00"
                  pendingCount: 15
                  highPriorityCount: 12
                  hasMore: true
                  items:
                    - todoId: todo-sales-approve
                      businessType: SALES
                      businessLabel: 销售
                      title: 销售单待审核
                      description: 还有 12 张销售单需要审核，处理后会自动完成待办。
                      count: 12
                      priority: HIGH
                      sortWeight: 21
                      sourceMode: AGGREGATED
                      completionMode: AUTO
                      status: PENDING
                      errorCode: null
                      errorMessage: null
                      sourceNo: null
                      occurredAt: null
                      resolveHint: 前往销售订单完成审核，审核通过后进入库存锁定和发货准备。
                      evidence: []
                      route: /sales/orders
        "401": { $ref: '#/components/responses/Unauthorized' }

  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: 获取工作台经营概览
      description: |
        返回当前登录用户可见范围内的经营概览数据，用于工作台首屏展示销售、采购、库存、待办和履约风险。
        后端应按当前用户权限裁剪模块数据：没有采购、销售、仓储等查询权限时，对应指标、待办和列表返回空数组或 0 值，不泄露无权业务数据。
        金额指标来自可执行聚合查询；库存风险来自 `warehouse_stock`、产品安全库存和锁定库存的查询时派生结果；待办分为三类：采购/销售/出入库/库存风险等状态类待办按业务状态动态聚合，业务完成后自动消失；价格偏离、客户信用等复核类待办展示证据并跳转对应业务页面；系统异常统一来自数据库异常记录表，聚合为一条 `SYSTEM_EXCEPTION` 待办并展示具体异常详情，不在工作台直接完成。
        本接口为工作台汇总接口，不接收含义不明的 `keyword`，不要求前端自行并发调用多个业务列表接口后拼装经营指标。
        `todos`、`topProducts`、`supplierPerformance`、`stockAlerts` 返回完整工作台明细数组；前端主页面只截取摘要展示，点击对应“详情”按钮时在同页弹窗展示同一数组的完整内容，不额外请求详情接口。经营趋势和订单流转只在主卡展示，不提供详情弹窗。
        当前前端展示规则：经营趋势接口返回近 30 天数据，前端提供 7 天、15 天、30 天切换并在同一卡片内展示，切换只改变前端截取范围和图表过渡效果，不新增请求；业务待办主卡展示前 8 条，订单流转展示全部阶段，销售商品排行主卡展示前 5 名，供应商履约主卡展示前 5 名；详情弹窗展示接口返回的完整明细记录，其中库存预警详情使用窄幅列表卡片承载完整字段，避免横向滚动。
        `todos` 是可扩展事件流，不限于采购、销售、仓储和系统四类。普通业务待办使用 `completionMode=AUTO`，可通过 `evidence[]` 展开少量代表性单据摘要并跳转对应业务页面；系统异常使用 `completionMode=TRACKED`，只展示数据库异常记录详情，不展示“完成处理”按钮。
        待办排序由后端完成并返回 `sortWeight`，前端只做兜底排序。推荐顺序：先按 `sortWeight` 升序，再按 `priority`（HIGH > MEDIUM > LOW），同优先级下人工异常任务优先于普通业务聚合，最后按发生时间倒序。异常/人工修复类待办不能广播给普通员工，只返回给具备处理权限、被指派用户、被指派角色或被指派部门范围内的人员；普通业务聚合待办按模块权限返回。
        工作台只展示复核证据，不在本接口提供产品、仓库、客户、供应商选择器。若待办详情或跳转页面需要选择产品、仓库、客户、供应商，应复用各模块已有分页查询和共享选择组件，例如 `/products`、`/warehouses`、`/sales/customers`、`/purchase/suppliers`，禁止在工作台接口固定返回大量下拉选项。
        后端建议至少返回：业务待办 20 条以内、销售商品排行 10 条以内、供应商履约 10 条以内、库存预警 20 条以内，避免工作台接口过重；超出范围时应按业务优先级、异常严重程度、影响金额或发生时间排序后截断。若异常待办未来明显超过工作台承载范围，应新增独立异常/任务中心分页接口，工作台只展示高优先级摘要。
        系统异常统一聚合为一条 `businessType=SYSTEM_EXCEPTION`、`completionMode=TRACKED` 的工作台待办，主卡只显示总数和最高优先级；具体异常记录通过 `evidence[]` 展示，例如 AI/MCP 工具调用失败、消息队列死信、第三方回调失败、定时任务失败和数据补偿失败。此类数据来自数据库异常记录表，工作台只提供“查看详情”，不展示“完成处理”；异常状态由后台重试、补偿任务或异常中心更新。
      operationId: dashboardOverview
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DashboardOverview' }
              example:
                code: 0
                message: success
                data:
                  refreshedAt: "2026-06-30 09:30:00"
                  metrics:
                    - label: 今日销售额
                      value: 286430
