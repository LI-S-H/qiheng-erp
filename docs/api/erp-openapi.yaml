  /warehouse/warehouses:
    get:
      tags: [Warehouse]
      summary: 分页查询仓库
      description: |
        查询未删除的 `warehouse` 数据。仓库编码、仓库名称、联系人和联系电话分别使用包含匹配，状态使用精确匹配，多个有效条件按 AND 组合。
        仓库列表使用无总数分页，后端不需要返回精确 `total`，也不需要为了分页执行额外 `COUNT(*)`；前端只展示当前页、上一页和下一页。
        不接收含义不明确的 `keyword` 参数。本接口需要 `warehouse:query` 权限。
      operationId: warehousePage
      security:
        - SaTokenAuth: []
      parameters:
        - name: warehouseCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 仓库编码，对应 `warehouse.warehouse_code`，使用包含匹配
        - name: warehouseName
          in: query
          schema: { type: string, maxLength: 100 }
          description: 仓库名称，对应 `warehouse.warehouse_name`，使用包含匹配
        - name: contactName
          in: query
          schema: { type: string, maxLength: 100 }
          description: 联系人，对应 `warehouse.contact_name`，使用包含匹配
        - name: contactPhone
          in: query
          schema: { type: string, maxLength: 32 }
          description: 联系电话，对应 `warehouse.contact_phone`，使用包含匹配
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1] }
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WarehousePage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouse]
      summary: 新增仓库
      description: 仓库编码由后端统一生成并通过唯一索引保证不重复，前端创建请求不提交仓库编码；生成后的编码不可修改。备注为选填字段，未填写时创建请求可以省略 `remark`。本接口需要 `warehouse:manage` 权限。
      operationId: warehouseCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Warehouse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/warehouses/batch/status:
    patch:
      tags: [Warehouse]
      summary: 批量修改仓库状态
      description: 停用后仓库不能再用于新建采购、销售、退货或库存调整业务，但历史单据和现有库存余额继续保留并可查询。本接口需要 `warehouse:manage` 权限。
