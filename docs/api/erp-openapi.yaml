        不接收含义不明确的 `keyword` 参数。评分字段接口按 0-100 业务值返回，数据库按放大 100 倍整数保存。
        采购订单明细产品选择按已选 `supplierId`、`productCode` / `productName` 与 `status=1` 请求第一页候选，默认 `pageSize=10`；前端不得预加载全量启用供货关系后再本地过滤。
