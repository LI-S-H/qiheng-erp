      operationId: purchaseSupplierProductCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseSupplierProductFormRequest' }
      responses:
        "200":
