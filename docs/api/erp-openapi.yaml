        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [ProductCategory]
      summary: 删除产品分类
      description: 逻辑删除分类；存在下级分类或仍有产品直接关联时返回 409。本接口需要 `product:manage` 权限。
      operationId: productCategoryDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /product/categories/{categoryId}/status:
    patch:
      tags: [ProductCategory]
      summary: 修改产品分类状态
      description: 停用父级分类时，后端必须在同一事务内级联停用全部下级分类和关联产品；上级分类停用时禁止单独启用下级分类。启用分类不会自动重新启用产品。本接口需要 `product:manage` 权限。
      operationId: productCategoryStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCategoryStatusRequest' }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmptyResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    SaTokenAuth:
      type: apiKey
      in: header
      name: satoken
      description: Sa-Token 原始 token。当前默认请求头为 satoken，实际调用以前端登录响应中的 tokenName 为准
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: 用户 ID，对应 `sys_user.id`
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: 角色 ID，对应 `sys_role.id`
    DeptId:
      name: deptId
      in: path
      required: true
      schema:
        type: string
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: string
      description: 权限 ID，对应 `sys_permission.id`
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
      description: 产品分类 ID，对应 `product_category.id`
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
      description: 产品 ID，对应 `product.id`
    WarehouseId:
      name: warehouseId
      in: path
      required: true
      schema:
        type: string
      description: 仓库 ID，对应 `warehouse.id`
    StockBillId:
      name: stockBillId
      in: path
      required: true
      schema:
        type: string
      description: 入库单、出库单或库存流水 ID，BIGINT 按字符串传输
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
      description: 供应商 ID，对应 `supplier.id`，BIGINT 按字符串传输
    SupplierProductId:
      name: supplierProductId
      in: path
      required: true
      schema:
        type: string
      description: 供应商供货产品 ID，对应 `supplier_product.id`，BIGINT 按字符串传输
    PurchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema:
        type: string
      description: 采购订单 ID，对应 `purchase_order.id`，BIGINT 按字符串传输
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      description: 客户 ID，对应 `customer.id`，BIGINT 按字符串传输
    SalesOrderId:
      name: salesOrderId
      in: path
      required: true
      schema:
        type: string
      description: 销售订单 ID，对应 `sales_order.id`，BIGINT 按字符串传输
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Unauthorized:
      description: 未登录或登录态已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Forbidden:
      description: 没有访问权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    NotFound:
      description: 数据不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Conflict:
      description: 唯一字段冲突，例如登录账号或角色编码已存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    Result:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          description: 响应消息
          example: success
        data:
          description: 响应数据，类型由具体接口定义

    EmptyResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          description: 登录账号，对应 `sys_user.username`
          example: admin
        password:
          type: string
          format: password
          description: 登录密码，后端与 `sys_user.password_hash` 比对
          example: "123456"

    LoginResponse:
      type: object
      required:
        - token
        - tokenName
        - user
      properties:
        token:
          type: string
          description: Sa-Token 原始 token
        tokenName:
          type: string
          example: satoken
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required:
        - userId
        - username
        - realName
        - deptId
        - deptName
        - isAdmin
        - roleCodes
        - permissionCodes
      properties:
        userId:
          type: string
          description: 用户 ID，对应 `sys_user.id`
        username:
          type: string
          description: 登录账号
        realName:
          type: string
          description: 用户姓名
        deptId:
          type: string
          description: 部门 ID
        deptName:
          type: string
          description: 部门名称
        isAdmin:
          type: boolean
          description: 是否超级管理员
        roleCodes:
          type: array
          items:
            type: string
          description: 角色编码列表
        permissionCodes:
          type: array
          items:
            type: string
          description: 权限码列表
        lastLoginAt:
          type: string
          nullable: true
          example: "2026-06-08 09:12:30"

    SystemUserPage:
      type: object
      required:
        - records
        - total
        - pageNum
        - pageSize
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SystemUser'
        total:
          type: integer
          example: 1
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10

    SystemUser:
      type: object
      required:
        - userId
        - username
        - realName
        - deptId
        - deptName
        - isAdmin
        - status
        - roleIds
        - roleNames
        - createTime
        - updateTime
      properties:
        userId:
          type: string
          description: 用户 ID，对应 `sys_user.id`
        username:
          type: string
          description: 登录账号，对应 `sys_user.username`
        realName:
          type: string
          description: 用户姓名，对应 `sys_user.real_name`
        deptId:
          type: string
          description: 部门 ID，对应 `sys_user.dept_id`
        deptName:
          type: string
          description: 由后端通过 `sys_user.dept_id = sys_dept.id` 关联返回 `sys_dept.dept_name`
        isAdmin:
          type: boolean
          description: 是否超级管理员，对应 `sys_user.is_admin`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        roleIds:
          type: array
          items:
            type: string
          description: 由后端查询 `sys_user_role` 返回用户绑定角色 ID 列表
        roleNames:
          type: array
          items:
            type: string
          description: 由后端通过 `sys_user_role.role_id = sys_role.id` 关联返回角色名称列表
        lastLoginAt:
          type: string
          nullable: true
          description: 最近登录时间
        createTime:
          type: string
          description: 创建时间
        updateTime:
          type: string
          description: 更新时间

    SystemUserCreateRequest:
      type: object
      required:
        - username
        - realName
        - password
        - deptId
        - isAdmin
        - status
        - roleIds
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{2,63}$'
          description: 登录账号
        realName:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户姓名
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 初始密码
        deptId:
          type: string
          description: 部门 ID
        isAdmin:
          type: boolean
          description: 是否超级管理员
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 绑定角色 ID 列表

    SystemUserUpdateRequest:
      type: object
      required:
        - username
        - realName
        - deptId
        - isAdmin
        - status
        - roleIds
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]{2,63}$'
          description: 登录账号
        realName:
          type: string
          minLength: 1
          maxLength: 100
          description: 用户姓名
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 新密码，不传表示不修改密码
        deptId:
          type: string
          description: 部门 ID
        isAdmin:
          type: boolean
          description: 是否超级管理员
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 绑定角色 ID 列表

    SystemUserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemUserPasswordResetRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 新密码

    SystemUserBatchStatusRequest:
      type: object
      required:
        - userIds
        - status
      properties:
        userIds:
          type: array
          minItems: 1
          description: 用户 ID 列表，对应 `sys_user.id`
          items:
            type: string
          example:
            - "1900000000000000001"
            - "1900000000000000002"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemUserBatchPasswordResetRequest:
      type: object
      required:
        - userIds
        - password
      properties:
        userIds:
          type: array
          minItems: 1
          description: 用户 ID 列表，对应 `sys_user.id`
          items:
            type: string
          example:
            - "1900000000000000001"
            - "1900000000000000002"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 32
          pattern: '^(?=.*\S).{6,32}$'
          description: 新密码

    SystemUserBatchDeleteRequest:
      type: object
      required:
        - userIds
      properties:
        userIds:
          type: array
          minItems: 1
          description: 用户 ID 列表，对应 `sys_user.id`
          items:
            type: string
          example:
            - "1900000000000000001"
            - "1900000000000000002"

    SystemUserRoleBindRequest:
      type: object
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          minItems: 1
          items:
            type: string
          description: 角色 ID 列表

    SystemRolePage:
      type: object
      required:
        - records
        - total
        - pageNum
        - pageSize
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SystemRole'
        total:
          type: integer
          example: 1
        pageNum:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10

    SystemRole:
      type: object
      required:
        - roleId
        - roleCode
        - roleName
        - permissionCodes
        - status
        - remark
        - userCount
        - createTime
        - updateTime
      properties:
        roleId:
          type: string
          description: 角色 ID，对应 `sys_role.id`
        roleCode:
          type: string
          maxLength: 64
          description: 角色编码，对应 `sys_role.role_code`
          example: SUPER_ADMIN
        roleName:
          type: string
          minLength: 1
          maxLength: 100
          description: 角色名称，对应 `sys_role.role_name`
          example: 超级管理员
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`；除 `*` 外必须引用启用且未删除的 `sys_permission.permission_code`
          example:
            - "*"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        remark:
          type: string
          maxLength: 500
          description: 备注，对应 `sys_role.remark`
        userCount:
          type: integer
          description: 当前绑定用户数量，由 `sys_user_role` 按角色聚合得到
        createTime:
          type: string
          description: 创建时间，对应 `sys_role.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `sys_role.update_time`

    SystemRoleCreateRequest:
      type: object
      required:
        - roleCode
        - roleName
        - permissionCodes
        - status
        - remark
      properties:
        roleCode:
          type: string
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          description: 角色编码，对应 `sys_role.role_code`
        roleName:
          type: string
          minLength: 1
          maxLength: 100
          description: 角色名称，对应 `sys_role.role_name`
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`；除 `*` 外必须引用启用且未删除的 `sys_permission.permission_code`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        remark:
          type: string
          maxLength: 500
          description: 备注，对应 `sys_role.remark`，无备注时传空字符串

    SystemRoleUpdateRequest:
      type: object
      required:
        - roleCode
        - roleName
        - permissionCodes
        - status
        - remark
      properties:
        roleCode:
          type: string
          maxLength: 64
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          description: 角色编码，对应 `sys_role.role_code`
        roleName:
          type: string
          maxLength: 100
          description: 角色名称，对应 `sys_role.role_name`
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        remark:
          type: string
          maxLength: 500
          description: 备注，对应 `sys_role.remark`，无备注时传空字符串

    SystemRoleStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemRolePermissionUpdateRequest:
      type: object
      required:
        - permissionCodes
      properties:
        permissionCodes:
          type: array
          minItems: 1
          items:
            type: string
          description: 权限码列表，对应 `sys_role.permission_codes`

    SystemRoleBatchStatusRequest:
      type: object
      required:
        - roleIds
        - status
      properties:
        roleIds:
          type: array
          minItems: 1
          description: 角色 ID 列表，对应 `sys_role.id`
          items:
            type: string
          example:
            - "1900000000000001001"
            - "1900000000000001002"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemRoleBatchDeleteRequest:
      type: object
      required:
        - roleIds
      properties:
        roleIds:
          type: array
          minItems: 1
          description: 角色 ID 列表，对应 `sys_role.id`
          items:
            type: string
          example:
            - "1900000000000001001"
            - "1900000000000001002"

    SystemDept:
      type: object
      required:
        - deptId
        - parentId
        - ancestors
        - deptName
        - status
        - userCount
        - createTime
        - updateTime
      properties:
        deptId:
          type: string
          description: 部门 ID，对应 `sys_dept.id`
        parentId:
          type: string
          description: 上级部门 ID，对应 `sys_dept.parent_id`；无上级部门时为 `"0"`
        ancestors:
          type: string
          maxLength: 500
          description: 祖级路径，对应 `sys_dept.ancestors`；前端不依赖该字段组装展示路径，展示路径按 `parentId` 递归计算
        deptName:
          type: string
          minLength: 1
          maxLength: 100
          description: 部门名称，对应 `sys_dept.dept_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        userCount:
          type: integer
          description: 当前员工数量，由 `sys_user.dept_id` 按部门聚合得到
        createTime:
          type: string
          description: 创建时间，对应 `sys_dept.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `sys_dept.update_time`

    SystemDeptCreateRequest:
      type: object
      required:
        - parentId
        - deptName
        - status
      properties:
        parentId:
          type: string
          description: 上级部门 ID，对应 `sys_dept.parent_id`；无上级部门时传 `"0"`
        deptName:
          type: string
          minLength: 1
          maxLength: 100
          description: 部门名称，对应 `sys_dept.dept_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemDeptUpdateRequest:
      type: object
      required:
        - parentId
        - deptName
        - status
      properties:
        parentId:
          type: string
          description: 上级部门 ID，对应 `sys_dept.parent_id`；无上级部门时传 `"0"`；后端需禁止设置为自身或自身下级
        deptName:
          type: string
          minLength: 1
          maxLength: 100
          description: 部门名称，对应 `sys_dept.dept_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用；停用时级联下级，启用时校验全部上级已启用

    SystemDeptStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemDeptBatchStatusRequest:
      type: object
      required:
        - deptIds
        - status
      properties:
        deptIds:
          type: array
          minItems: 1
          description: 部门 ID 列表，对应 `sys_dept.id`
          items:
            type: string
          example:
            - "1900000000000000102"
            - "1900000000000000103"
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用

    SystemDeptBatchDeleteRequest:
      type: object
      required:
        - deptIds
      properties:
        deptIds:
          type: array
          minItems: 1
          description: 部门 ID 列表，对应 `sys_dept.id`
          items:
            type: string
          example:
            - "1900000000000000102"
            - "1900000000000000103"

    PermissionActionType:
      type: string
      enum: [query, create, update, delete, manage, execute]

    SystemPermissionPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SystemPermission' }
        total: { type: integer, format: int64 }
        pageNum: { type: integer }
        pageSize: { type: integer }

    SystemPermission:
      type: object
      required: [permissionId, permissionCode, permissionName, moduleCode, actionType, status, sortOrder, description, roleCount, createTime, updateTime]
      properties:
        permissionId: { type: string }
        permissionCode:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z][a-z0-9]*(?::[a-z][a-z0-9]*){1,3}$'
        permissionName: { type: string, minLength: 1, maxLength: 100 }
        moduleCode: { type: string, minLength: 1, maxLength: 64 }
        actionType: { $ref: '#/components/schemas/PermissionActionType' }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        description: { type: string, maxLength: 500 }
        roleCount: { type: integer, minimum: 0, description: 由后端使用 sys_role.permission_codes JSON 聚合得到；通配符 * 视为引用全部权限码 }
        createTime: { type: string }
        updateTime: { type: string }

    SystemPermissionCreateRequest:
      type: object
      required: [permissionCode, permissionName, moduleCode, actionType, status, sortOrder, description]
      properties:
        permissionCode:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '^[a-z][a-z0-9]*(?::[a-z][a-z0-9]*){1,3}$'
        permissionName: { type: string, minLength: 1, maxLength: 100 }
        moduleCode: { type: string, minLength: 1, maxLength: 64 }
        actionType: { $ref: '#/components/schemas/PermissionActionType' }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        description: { type: string, maxLength: 500 }

    SystemPermissionUpdateRequest:
      type: object
      description: permissionCode 用于鉴权且创建后不可修改，因此更新请求不接收该字段。
      required: [permissionName, moduleCode, actionType, status, sortOrder, description]
      properties:
        permissionName: { type: string, minLength: 1, maxLength: 100 }
        moduleCode: { type: string, minLength: 1, maxLength: 64 }
        actionType: { $ref: '#/components/schemas/PermissionActionType' }
        status: { type: integer, enum: [0, 1] }
        sortOrder: { type: integer, minimum: 0, maximum: 9999 }
        description: { type: string, maxLength: 500 }

    SystemPermissionStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1] }

    SystemPermissionBatchStatusRequest:
      type: object
      required: [permissionIds, status]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { type: string }
        status: { type: integer, enum: [0, 1] }

    SystemPermissionBatchDeleteRequest:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          minItems: 1
          items: { type: string }

    PermissionOptionGroup:
      type: object
      required: [group, codes]
      properties:
        group: { type: string }
        codes:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string }
              label: { type: string }

    RoleOption:
      type: object
      required:
        - roleId
        - roleCode
        - roleName
        - status
      properties:
        roleId:
          type: string
        roleCode:
          type: string
        roleName:
          type: string
        status:
          type: integer
          enum: [0, 1]

    DeptOption:
      type: object
      required:
        - deptId
        - deptName
        - parentId
        - status
      properties:
        deptId:
          type: string
        deptName:
          type: string
        parentId:
          type: string
        status:
          type: integer
          enum: [0, 1]

    OptimisticLockVersionRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 0, description: Current row version for optimistic locking. }

    PurchaseSupplierPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/PurchaseSupplier' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    PurchaseSupplier:
      type: object
      required: [supplierId, supplierCode, supplierName, contactName, contactPhone, address, paymentTerms, overallScore, deliveryScore, qualityScore, priceScore, serviceScore, avgDeliveryDays, onTimeRate, qualifiedRate, status, version, remark, createTime, updateTime]
      properties:
        supplierId: { type: string, description: 对应 `supplier.id`，BIGINT 按字符串传输 }
        supplierCode: { type: string, minLength: 1, maxLength: 64, readOnly: true, description: 对应 `supplier.supplier_code`，由后端生成、全局唯一且创建后不可修改 }
        supplierName: { type: string, minLength: 1, maxLength: 200, description: 对应 `supplier.supplier_name` }
        contactName: { type: string, maxLength: 100, description: 对应 `supplier.contact_name` }
        contactPhone: { type: string, maxLength: 32, description: 对应 `supplier.contact_phone` }
        address: { type: string, maxLength: 255, description: 对应 `supplier.address` }
        paymentTerms: { type: string, maxLength: 100, description: 对应 `supplier.payment_terms` }
        overallScore: { type: number, format: double, minimum: 0, maximum: 100, description: 综合评分展示值；数据库 `supplier.overall_score` 按 100 倍整数存储 }
        deliveryScore: { type: number, format: double, minimum: 0, maximum: 100, description: 交付评分展示值；数据库按 100 倍整数存储 }
        qualityScore: { type: number, format: double, minimum: 0, maximum: 100, description: 质量评分展示值；数据库按 100 倍整数存储 }
        priceScore: { type: number, format: double, minimum: 0, maximum: 100, description: 价格评分展示值；数据库按 100 倍整数存储 }
        serviceScore: { type: number, format: double, minimum: 0, maximum: 100, description: 服务评分展示值；数据库按 100 倍整数存储 }
        avgDeliveryDays: { type: integer, minimum: 0, description: 对应 `supplier.avg_delivery_days` }
        onTimeRate: { type: number, format: double, minimum: 0, maximum: 100, description: 准时率展示值；数据库 `supplier.on_time_rate` 按 100 倍整数存储 }
        qualifiedRate: { type: number, format: double, minimum: 0, maximum: 100, description: 合格率展示值；数据库 `supplier.qualified_rate` 按 100 倍整数存储 }
        status: { type: integer, enum: [0, 1], description: 对应 `supplier.status`，1 启用，0 停用 }
        version: { type: integer, minimum: 0, description: Current `supplier.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `supplier.remark` }
        createTime: { type: string, description: 对应 `supplier.create_time` }
        updateTime: { type: string, description: 对应 `supplier.update_time` }

    PurchaseSupplierFormRequest:
      type: object
      required: [supplierName, contactName, contactPhone, address, paymentTerms, overallScore, deliveryScore, qualityScore, priceScore, serviceScore, avgDeliveryDays, onTimeRate, qualifiedRate, status, remark]
      properties:
        supplierName: { type: string, minLength: 1, maxLength: 200 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        paymentTerms: { type: string, maxLength: 100 }
        overallScore: { type: number, format: double, minimum: 0, maximum: 100 }
        deliveryScore: { type: number, format: double, minimum: 0, maximum: 100 }
        qualityScore: { type: number, format: double, minimum: 0, maximum: 100 }
        priceScore: { type: number, format: double, minimum: 0, maximum: 100 }
        serviceScore: { type: number, format: double, minimum: 0, maximum: 100 }
        avgDeliveryDays: { type: integer, minimum: 0 }
        onTimeRate: { type: number, format: double, minimum: 0, maximum: 100 }
        qualifiedRate: { type: number, format: double, minimum: 0, maximum: 100 }
        status: { type: integer, enum: [0, 1] }
        version: { type: integer, minimum: 0, description: Required when editing an existing supplier; omit on create. }
        remark: { type: string, maxLength: 500 }

    PurchaseSupplierStatusRequest:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 0, description: Current `supplier.version` for optimistic locking. }
        status: { type: integer, enum: [0, 1] }

    PurchaseSupplierBatchStatusRequest:
      type: object
      required: [supplierIds, versionBySupplierId, status]
      properties:
        supplierIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionBySupplierId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of supplierId to current `supplier.version` for optimistic locking.
        status: { type: integer, enum: [0, 1] }

    PurchaseSupplierBatchDeleteRequest:
      type: object
      required: [versionBySupplierId, supplierIds]
      properties:
        supplierIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionBySupplierId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of supplierId to current `supplier.version` for optimistic locking.

    PurchaseSupplierOption:
      type: object
      required: [supplierId, supplierCode, supplierName, status]
      properties:
        supplierId: { type: string, description: 对应 `supplier.id`，BIGINT 按字符串传输 }
        supplierCode: { type: string, maxLength: 64 }
        supplierName: { type: string, maxLength: 200 }
        status: { type: integer, enum: [0, 1] }

    PurchaseSupplierProductPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/PurchaseSupplierProduct' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    PurchaseSupplierProduct:
      type: object
      required: [supplierProductId, supplierId, supplierCode, supplierName, productId, productCode, productName, unitName, supplierProductCode, latestPurchasePrice, minOrderQty, leadTimeDays, deliveryScore, qualityScore, priceScore, aiScore, lastPurchaseAt, status, version, remark, createTime, updateTime]
      properties:
        supplierProductId: { type: string, description: 对应 `supplier_product.id`，BIGINT 按字符串传输 }
        supplierId: { type: string, description: 对应 `supplier_product.supplier_id`，BIGINT 按字符串传输 }
        supplierCode: { type: string, maxLength: 64, description: 对应 `supplier_product.supplier_code` 供应商快照 }
        supplierName: { type: string, maxLength: 200, description: 对应 `supplier_product.supplier_name` 供应商快照 }
        productId: { type: string, description: 对应 `supplier_product.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `supplier_product.product_code` 产品快照 }
        productName: { type: string, maxLength: 200, description: 对应 `supplier_product.product_name` 产品快照 }
        unitName: { type: string, maxLength: 32, description: 对应 `supplier_product.unit_name` 产品单位快照 }
        supplierProductCode: { type: string, maxLength: 100, description: 对应 `supplier_product.supplier_product_code` }
        latestPurchasePrice: { type: number, format: double, minimum: 0, description: 对应 `supplier_product.latest_purchase_price` }
        minOrderQty: { type: number, format: double, minimum: 0, description: 对应 `supplier_product.min_order_qty` }
        leadTimeDays: { type: integer, minimum: 0, description: 对应 `supplier_product.lead_time_days` }
        deliveryScore: { type: number, format: double, minimum: 0, maximum: 100, description: 交付评分展示值；数据库按 100 倍整数存储 }
        qualityScore: { type: number, format: double, minimum: 0, maximum: 100, description: 质量评分展示值；数据库按 100 倍整数存储 }
        priceScore: { type: number, format: double, minimum: 0, maximum: 100, description: 价格评分展示值；数据库按 100 倍整数存储 }
        aiScore: { type: number, format: double, minimum: 0, maximum: 100, description: 推荐分展示值；数据库 `supplier_product.ai_score` 按 100 倍整数存储 }
        lastPurchaseAt: { type: string, nullable: true, description: 对应 `supplier_product.last_purchase_at` }
        status: { type: integer, enum: [0, 1], description: 对应 `supplier_product.status`，1 启用，0 停用 }
        version: { type: integer, minimum: 0, description: Current `supplier_product.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `supplier_product.remark` }
        createTime: { type: string, description: 对应 `supplier_product.create_time` }
        updateTime: { type: string, description: 对应 `supplier_product.update_time` }

    PurchaseSupplierProductFormRequest:
      type: object
      required: [supplierId, productId, supplierProductCode, latestPurchasePrice, minOrderQty, leadTimeDays, deliveryScore, qualityScore, priceScore, aiScore, status, remark]
      properties:
        supplierId: { type: string, description: 启用供应商 ID；后端保存供应商编码和名称快照 }
        productId: { type: string, description: 启用产品 ID；后端保存产品编码、名称和单位快照 }
        supplierProductCode: { type: string, maxLength: 100 }
        latestPurchasePrice: { type: number, format: double, minimum: 0 }
        minOrderQty: { type: number, format: double, minimum: 0 }
        leadTimeDays: { type: integer, minimum: 0 }
        deliveryScore: { type: number, format: double, minimum: 0, maximum: 100 }
        qualityScore: { type: number, format: double, minimum: 0, maximum: 100 }
        priceScore: { type: number, format: double, minimum: 0, maximum: 100 }
        aiScore: { type: number, format: double, minimum: 0, maximum: 100 }
        status: { type: integer, enum: [0, 1] }
        version: { type: integer, minimum: 0, description: Required when editing an existing supplier product; omit on create. }
        remark: { type: string, maxLength: 500 }

    PurchaseSupplierProductBatchStatusRequest:
      type: object
      required: [supplierProductIds, versionBySupplierProductId, status]
      properties:
        supplierProductIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionBySupplierProductId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of supplierProductId to current `supplier_product.version` for optimistic locking.
        status: { type: integer, enum: [0, 1] }

    PurchaseSupplierProductBatchDeleteRequest:
      type: object
      required: [versionBySupplierProductId, supplierProductIds]
      properties:
        supplierProductIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionBySupplierProductId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of supplierProductId to current `supplier_product.version` for optimistic locking.

    PurchaseOrderPage:
      type: object
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrder' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/PurchaseOrderSummary' }

    PurchaseOrderSummary:
      type: object
      required: [draftCount, submittedCount, approvedCount, inboundPendingCount]
      properties:
        draftCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 DRAFT 的订单数 }
        submittedCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 SUBMITTED 的订单数 }
        approvedCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 APPROVED 的订单数 }
        inboundPendingCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 APPROVED 或 PARTIAL_INBOUND 的待入库订单数 }

    PurchaseOrder:
      type: object
      required: [purchaseOrderId, purchaseNo, supplierId, supplierCode, supplierName, warehouseId, warehouseName, status, totalAmount, expectedArrivalDate, createdById, createdByName, submittedAt, approvedById, approvedByName, approvedAt, createTime, updateTime, version, remark, items]
      properties:
        purchaseOrderId: { type: string, description: 对应 `purchase_order.id`，BIGINT 按字符串传输 }
        purchaseNo: { type: string, maxLength: 64, readOnly: true, description: 对应 `purchase_order.purchase_no`，由后端生成、全局唯一 }
        supplierId: { type: string, description: 对应 `purchase_order.supplier_id`，BIGINT 按字符串传输 }
        supplierCode: { type: string, maxLength: 64, description: 对应 `purchase_order.supplier_code` 供应商快照 }
        supplierName: { type: string, maxLength: 200, description: 对应 `purchase_order.supplier_name` 供应商快照 }
        warehouseId: { type: string, description: 对应 `purchase_order.warehouse_id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 对应 `purchase_order.warehouse_name` 仓库快照 }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_INBOUND, INBOUND_DONE, CANCELLED], description: 对应 `purchase_order.status` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `purchase_order.total_amount` }
        expectedArrivalDate: { type: string, nullable: true, description: 对应 `purchase_order.expected_arrival_date`；草稿可为空，提交和审核前必须非空 }
        createdById: { type: string, nullable: true, description: 对应 `purchase_order.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 对应 `purchase_order.created_by_name` }
        submittedAt: { type: string, nullable: true, description: 对应 `purchase_order.submitted_at` }
        approvedById: { type: string, nullable: true, description: 对应 `purchase_order.approved_by_id`，BIGINT 按字符串传输 }
        approvedByName: { type: string, maxLength: 100, description: 对应 `purchase_order.approved_by_name` }
        approvedAt: { type: string, nullable: true, description: 对应 `purchase_order.approved_at` }
        createTime: { type: string, description: 对应 `purchase_order.create_time` }
        updateTime: { type: string, description: 对应 `purchase_order.update_time` }
        version: { type: integer, minimum: 0, description: Current `purchase_order.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `purchase_order.remark` }
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOrderItem' }

    PurchaseOrderDetail:
      allOf:
        - $ref: '#/components/schemas/PurchaseOrder'

    PurchaseOrderItem:
      type: object
      required: [purchaseOrderItemId, purchaseOrderId, purchaseNo, supplierProductId, productId, productCode, productName, unitName, quantity, inboundQty, unitPrice, totalAmount, selectedSupplierScore, remark]
      properties:
        purchaseOrderItemId: { type: string, description: 对应 `purchase_order_item.id`，BIGINT 按字符串传输 }
        purchaseOrderId: { type: string, description: 对应 `purchase_order_item.purchase_order_id`，BIGINT 按字符串传输 }
        purchaseNo: { type: string, maxLength: 64, description: 对应 `purchase_order_item.purchase_no` }
        supplierProductId: { type: string, nullable: true, description: 对应 `purchase_order_item.supplier_product_id`，BIGINT 按字符串传输，可为空 }
        productId: { type: string, description: 对应 `purchase_order_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `purchase_order_item.product_code` 产品快照 }
        productName: { type: string, maxLength: 200, description: 对应 `purchase_order_item.product_name` 产品快照 }
        unitName: { type: string, maxLength: 32, description: 对应 `purchase_order_item.unit_name` 产品单位快照 }
        quantity: { type: number, format: double, exclusiveMinimum: 0, description: 对应 `purchase_order_item.quantity` }
        inboundQty: { type: number, format: double, minimum: 0, description: 对应 `purchase_order_item.inbound_qty` }
        unitPrice: { type: number, format: double, minimum: 0, description: 对应 `purchase_order_item.unit_price` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `purchase_order_item.total_amount` }
        selectedSupplierScore: { type: number, format: double, minimum: 0, maximum: 100, description: 下单时推荐分展示值；数据库 `purchase_order_item.selected_supplier_score` 按 100 倍整数存储 }
        remark: { type: string, maxLength: 500, description: 对应 `purchase_order_item.remark` }

    PurchaseOrderCreateRequest:
      type: object
      required: [supplierId, warehouseId, expectedArrivalDate, remark, items]
      properties:
        supplierId: { type: string, description: 启用供应商 ID；后端保存供应商编码和名称快照 }
        warehouseId: { type: string, description: 启用仓库 ID；后端保存仓库名称快照 }
        expectedArrivalDate: { type: string, nullable: true, description: 对应 `purchase_order.expected_arrival_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderDraftItemRequest' }

    PurchaseOrderUpdateRequest:
      type: object
      required: [version, supplierId, warehouseId, expectedArrivalDate, remark, items]
      properties:
        version: { type: integer, minimum: 0, description: Current `purchase_order.version` for optimistic locking. }
        supplierId: { type: string, description: 供应商 ID；`DRAFT` 可由采购创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存供应商编码和名称快照 }
        warehouseId: { type: string, description: 入库仓库 ID；`DRAFT` 可由采购创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存仓库名称快照 }
        expectedArrivalDate: { type: string, nullable: true, description: 对应 `purchase_order.expected_arrival_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500, description: 对应 `purchase_order.remark` }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderDraftItemRequest' }

    PurchaseOrderDraftItemRequest:
      type: object
      required: [productId, quantity, unitPrice, selectedSupplierScore, remark]
      properties:
        purchaseOrderItemId: { type: string, nullable: true, description: 编辑草稿时传已有明细 ID，对应 `purchase_order_item.id`；新增明细或创建订单时不传 }
        supplierProductId: { type: string, nullable: true, description: 选中的供货关系 ID，对应 `supplier_product.id`；前端应按单头供应商和产品双向过滤后传入，若为空或与 `supplierId`、`productId` 不匹配，后端必须拒绝或按启用供货关系重新校验 }
        productId: { type: string, description: 启用产品 ID；后端保存产品编码、名称和单位快照 }
        quantity: { type: number, format: double, exclusiveMinimum: 0 }
        unitPrice: { type: number, format: double, minimum: 0 }
        selectedSupplierScore: { type: number, format: double, minimum: 0, maximum: 100 }
        remark: { type: string, maxLength: 500 }

    SalesCustomerPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SalesCustomer' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    SalesCustomer:
      type: object
      required: [customerId, customerCode, customerName, contactName, contactPhone, address, creditLimit, status, version, remark, createTime, updateTime]
      properties:
        customerId: { type: string, description: 对应 `customer.id`，BIGINT 按字符串传输 }
        customerCode: { type: string, minLength: 1, maxLength: 64, readOnly: true, description: 对应 `customer.customer_code`，由后端生成、全局唯一且创建后不可修改 }
        customerName: { type: string, minLength: 1, maxLength: 200, description: 对应 `customer.customer_name` }
        contactName: { type: string, maxLength: 100, description: 对应 `customer.contact_name` }
        contactPhone: { type: string, maxLength: 32, description: 对应 `customer.contact_phone` }
        address: { type: string, maxLength: 255, description: 对应 `customer.address` }
        creditLimit: { type: number, format: double, minimum: 0, description: 对应 `customer.credit_limit`，MVP 仅记录不强拦截 }
        status: { type: integer, enum: [0, 1], description: 对应 `customer.status`，1 启用，0 停用 }
        version: { type: integer, minimum: 0, description: Current `customer.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `customer.remark` }
        createTime: { type: string, description: 对应 `customer.create_time` }
        updateTime: { type: string, description: 对应 `customer.update_time` }

    SalesCustomerFormRequest:
      type: object
      required: [customerName, contactName, contactPhone, address, creditLimit, status, remark]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 200 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        creditLimit: { type: number, format: double, minimum: 0 }
        status: { type: integer, enum: [0, 1] }
        version: { type: integer, minimum: 0, description: Required when editing an existing customer; omit on create. }
        remark: { type: string, maxLength: 500 }

    SalesCustomerStatusRequest:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 0, description: Current `customer.version` for optimistic locking. }
        status: { type: integer, enum: [0, 1] }

    SalesCustomerBatchStatusRequest:
      type: object
      required: [customerIds, versionByCustomerId, status]
      properties:
        customerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByCustomerId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of customerId to current `customer.version` for optimistic locking.
        status: { type: integer, enum: [0, 1] }

    SalesCustomerBatchDeleteRequest:
      type: object
      required: [versionByCustomerId, customerIds]
      properties:
        customerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByCustomerId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of customerId to current `customer.version` for optimistic locking.

    SalesCustomerOption:
      type: object
      required: [customerId, customerCode, customerName, status]
      properties:
        customerId: { type: string, description: 对应 `customer.id`，BIGINT 按字符串传输 }
        customerCode: { type: string, maxLength: 64 }
        customerName: { type: string, maxLength: 200 }
        status: { type: integer, enum: [0, 1] }

    SalesOrderPage:
      type: object
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SalesOrder' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/SalesOrderSummary' }

    SalesOrderSummary:
      type: object
      required: [draftCount, submittedCount, approvedCount, outboundPendingCount]
      properties:
        draftCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 DRAFT 的订单数 }
        submittedCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 SUBMITTED 的订单数 }
        approvedCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 APPROVED 的订单数 }
        outboundPendingCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 APPROVED 或 PARTIAL_OUTBOUND 的待出库订单数 }

    SalesOrder:
      type: object
      required: [salesOrderId, salesNo, customerId, customerCode, customerName, warehouseId, warehouseName, status, totalAmount, expectedDeliveryDate, lockedAt, createdById, createdByName, submittedAt, approvedById, approvedByName, approvedAt, createTime, updateTime, version, remark, items]
      properties:
        salesOrderId: { type: string, description: 对应 `sales_order.id`，BIGINT 按字符串传输 }
        salesNo: { type: string, maxLength: 64, readOnly: true, description: 对应 `sales_order.sales_no`，由后端生成、全局唯一 }
        customerId: { type: string, description: 对应 `sales_order.customer_id`，BIGINT 按字符串传输 }
        customerCode: { type: string, maxLength: 64, description: 对应 `sales_order.customer_code` 客户快照 }
        customerName: { type: string, maxLength: 200, description: 对应 `sales_order.customer_name` 客户快照 }
        warehouseId: { type: string, description: 对应 `sales_order.warehouse_id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 对应 `sales_order.warehouse_name` 仓库快照 }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_OUTBOUND, OUTBOUND_DONE, CANCELLED], description: 对应 `sales_order.status` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `sales_order.total_amount` }
        expectedDeliveryDate: { type: string, nullable: true, description: 对应 `sales_order.expected_delivery_date`；草稿可为空，提交和审核前必须非空 }
        lockedAt: { type: string, nullable: true, description: 对应 `sales_order.locked_at`，库存锁定成功后由后端写入 }
        createdById: { type: string, nullable: true, description: 对应 `sales_order.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 对应 `sales_order.created_by_name` }
        submittedAt: { type: string, nullable: true, description: 对应 `sales_order.submitted_at` }
        approvedById: { type: string, nullable: true, description: 对应 `sales_order.approved_by_id`，BIGINT 按字符串传输 }
        approvedByName: { type: string, maxLength: 100, description: 对应 `sales_order.approved_by_name` }
        approvedAt: { type: string, nullable: true, description: 对应 `sales_order.approved_at` }
        createTime: { type: string, description: 对应 `sales_order.create_time` }
        updateTime: { type: string, description: 对应 `sales_order.update_time` }
        version: { type: integer, minimum: 0, description: Current `sales_order.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `sales_order.remark` }
        items:
          type: array
          items: { $ref: '#/components/schemas/SalesOrderItem' }

    SalesOrderDetail:
      allOf:
        - $ref: '#/components/schemas/SalesOrder'

    SalesOrderItem:
      type: object
      required: [salesOrderItemId, salesOrderId, salesNo, productId, productCode, productName, unitName, quantity, lockedQty, outboundQty, unitPrice, totalAmount, remark]
      properties:
        salesOrderItemId: { type: string, description: 对应 `sales_order_item.id`，BIGINT 按字符串传输 }
        salesOrderId: { type: string, description: 对应 `sales_order_item.sales_order_id`，BIGINT 按字符串传输 }
        salesNo: { type: string, maxLength: 64, description: 对应 `sales_order_item.sales_no` }
        productId: { type: string, description: 对应 `sales_order_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `sales_order_item.product_code` 产品快照 }
        productName: { type: string, maxLength: 200, description: 对应 `sales_order_item.product_name` 产品快照 }
        unitName: { type: string, maxLength: 32, description: 对应 `sales_order_item.unit_name` 产品单位快照 }
        quantity: { type: number, format: double, exclusiveMinimum: 0, description: 对应 `sales_order_item.quantity` }
        lockedQty: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.locked_qty`，提交或审核锁定库存后由后端写入 }
        outboundQty: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.outbound_qty`，仓库确认出库后回写 }
        unitPrice: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.unit_price` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.total_amount` }
        remark: { type: string, maxLength: 500, description: 对应 `sales_order_item.remark` }

    SalesOrderCreateRequest:
      type: object
      required: [customerId, warehouseId, expectedDeliveryDate, remark, items]
      properties:
        customerId: { type: string, description: 启用客户 ID；后端保存客户编码和名称快照 }
        warehouseId: { type: string, description: 启用出库仓库 ID；后端保存仓库名称快照 }
        expectedDeliveryDate: { type: string, nullable: true, description: 对应 `sales_order.expected_delivery_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SalesOrderDraftItemRequest' }

    SalesOrderUpdateRequest:
      type: object
      required: [version, customerId, warehouseId, expectedDeliveryDate, remark, items]
      properties:
        version: { type: integer, minimum: 0, description: Current `sales_order.version` for optimistic locking. }
        customerId: { type: string, description: 客户 ID；`DRAFT` 可由销售创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存客户编码和名称快照 }
        warehouseId: { type: string, description: 出库仓库 ID；`DRAFT` 可由销售创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存仓库名称快照 }
        expectedDeliveryDate: { type: string, nullable: true, description: 对应 `sales_order.expected_delivery_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500, description: 对应 `sales_order.remark` }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SalesOrderDraftItemRequest' }

    SalesOrderDraftItemRequest:
      type: object
      required: [productId, quantity, unitPrice, remark]
      properties:
        salesOrderItemId: { type: string, nullable: true, description: 编辑草稿时传已有明细 ID，对应 `sales_order_item.id`；新增明细或创建订单时不传 }
        productId: { type: string, description: 启用产品 ID；后端保存产品编码、名称和单位快照 }
        quantity: { type: number, format: double, exclusiveMinimum: 0 }
        unitPrice: { type: number, format: double, minimum: 0 }
        remark: { type: string, maxLength: 500 }

    WarehouseStockPage:
      type: object
      required: [records, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/WarehouseStock' }
        total: { type: integer, minimum: 0, nullable: true, description: 可选；库存余额默认使用无总数分页，后端不需要返回精确总数 }
        hasNext: { type: boolean, description: 可选；是否存在下一页，未返回时前端按 `records.length >= pageSize` 保守判断 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/WarehouseStockSummary' }

    StockBillDraftItemRequest:
      type: object
      required: [productId, quantity, qualifiedQty, defectiveQty, remark]
      properties:
        stockBillItemId: { type: string, nullable: true, description: 编辑草稿时传明细 ID；新增明细时不传 }
        productId: { type: string, description: 产品 ID，后端保存当前产品编码、名称和单位快照 }
        quantity: { type: number, format: double, exclusiveMinimum: 0, multipleOf: 0.01, description: 本次出入库业务真实值，最多两位小数；后端按产品数量精度校验并按 100 倍整数持久化 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 采购入库或销售退货的合格数量，其他类型传 0 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 采购入库或销售退货的不合格数量，其他类型传 0 }
        remark: { type: string, maxLength: 500 }

    StockBillCreateRequest:
      type: object
      required: [billType, sourceNo, warehouseId, manualReason, items, remark]
      properties:
        billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT], description: 手工补录或库存调整类型 }
        sourceNo: { type: string, maxLength: 64, description: 非调整类型必填原业务单号；调整类型传空字符串，由后端生成调整单号 }
        warehouseId: { type: string, description: 启用状态的仓库 ID }
        manualReason: { type: string, minLength: 1, maxLength: 500, description: 补录原因或库存调整原因，必填 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StockBillDraftItemRequest' }
        remark: { type: string, maxLength: 500 }

    StockBillUpdateRequest:
      type: object
      required: [version, warehouseId, sourceNo, manualReason, items, remark]
      properties:
        version: { type: integer, minimum: 0, description: Current `stock_bill.version` for optimistic locking. }
        warehouseId: { type: string, description: 仓库 ID；仅 `DRAFT` 状态允许修改，`PENDING_CONFIRM` 必须保持原值 }
        sourceNo: { type: string, maxLength: 64, description: 手工补录草稿可维护原业务单号；其他录入方式保持原值 }
        manualReason: { type: string, maxLength: 500, description: 手工补录或调整草稿必填；来源生成草稿保持原值 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StockBillDraftItemRequest' }
        remark: { type: string, maxLength: 500 }

    StockBillPage:
      type: object
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StockBill' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/StockBillSummary' }

    StockBillSummary:
      type: object
      required: [inboundCount, outboundCount, sourceGeneratedCount, pendingCount, confirmedCount, cancelledCount]
      properties:
        inboundCount: { type: integer, minimum: 0, description: 当前页 `records` 中的入库方向数量 }
        outboundCount: { type: integer, minimum: 0, description: 当前页 `records` 中的出库方向数量 }
        sourceGeneratedCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `entryMode = SOURCE_GENERATED` 的单据数 }
        pendingCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 PENDING_CONFIRM 的单据数 }
        confirmedCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 CONFIRMED 的单据数 }
        cancelledCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 CANCELLED 的单据数 }

    StockBill:
      type: object
      required: [stockBillId, billNo, billType, sourceType, sourceId, sourceNo, sourcePartyName, entryMode, warehouseId, warehouseName, status, itemCount, quantitySummary, totalCurrentQty, quantityUnitName, confirmedById, confirmedByName, confirmedAt, createdById, createdByName, responsibleById, responsibleByName, version, createTime, updateTime]
      properties:
        stockBillId: { type: string, description: 入库单、出库单或库存流水 ID，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 入库单号、出库单号或库存流水号 }
        billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT], description: 入库、出库或库存流水类型 }
        sourceType: { type: string, enum: [PURCHASE_ORDER, SALES_ORDER, PURCHASE_RETURN_ORDER, SALES_RETURN_ORDER, STOCK_ADJUST], description: 原业务来源类型 }
        sourceId: { type: string, nullable: true, description: 原业务来源单据 ID，BIGINT 按字符串传输 }
        sourceNo: { type: string, maxLength: 64, description: 原业务来源单号 }
        sourcePartyName: { type: string, maxLength: 200, description: 来源对象名称快照；`PURCHASE_IN`、`PURCHASE_RETURN` 表示供应商，`SALES_OUT`、`SALES_RETURN` 表示客户，`ADJUST_IN`、`ADJUST_OUT` 表示调整仓库名称快照；前端不得再显示为泛化“往来方” }
        entryMode: { type: string, enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT], description: 区分来源生成、手工补录和手工调整 }
        warehouseId: { type: string, description: 仓库 ID，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 仓库名称快照 }
        status: { type: string, enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED], description: 入库单/出库单状态；库存流水只返回 CONFIRMED }
        itemCount: { type: integer, minimum: 0, description: 明细条数 }
        quantitySummary: { type: string, description: 列表入库量/出库量摘要，例如“本次 20 箱”；不同单位时返回简短明细摘要，前端列表按页面方向展示为入库量或出库量，展开明细必须使用 `items.quantity`、`items.qualifiedQty`、`items.defectiveQty`、`items.pendingQty` 独立列展示，不使用拼接质检字段 }
        totalCurrentQty: { type: number, format: double, nullable: true, description: 同单位时的入库量/出库量合计，不同单位返回 null }
        quantityUnitName: { type: string, description: 数量摘要单位；不同单位时返回空字符串 }
        confirmedById: { type: string, nullable: true, description: 对应 `stock_bill.confirmed_by_id`，BIGINT 按字符串传输 }
        confirmedByName: { type: string, maxLength: 100, description: 对应 `stock_bill.confirmed_by_name` }
        confirmedAt: { type: string, nullable: true, description: 对应 `stock_bill.confirmed_at` }
        createdById: { type: string, nullable: true, description: 对应 `stock_bill.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 对应 `stock_bill.created_by_name` }
        responsibleById: { type: string, description: 对应 `stock_bill.responsible_by_id`；手工单据由后端取当前登录用户 }
        responsibleByName: { type: string, maxLength: 100, description: 对应 `stock_bill.responsible_by_name` }
        version: { type: integer, minimum: 0, description: Current `stock_bill.version` for optimistic locking. }
        createTime: { type: string, description: 对应 `stock_bill.create_time` }
        updateTime: { type: string, description: 对应 `stock_bill.update_time` }

    StockBillDetail:
      allOf:
        - $ref: '#/components/schemas/StockBill'
        - type: object
          required: [manualReason, remark, items]
          properties:
            manualReason: { type: string, maxLength: 500, description: 对应 `stock_bill.manual_reason`；来源生成凭证为空字符串 }
            remark: { type: string, maxLength: 500, description: 对应 `stock_bill.remark` }
            items:
              type: array
              items: { $ref: '#/components/schemas/StockBillItem' }

    StockBillItem:
      type: object
      required: [stockBillItemId, stockBillId, billNo, sourceItemId, productId, productCode, productName, unitName, quantityPrecision, planQty, processedQty, pendingQty, quantity, qualifiedQty, defectiveQty, beforeQty, changeQty, afterQty, createTime, updateTime, remark]
      properties:
        stockBillItemId: { type: string, description: 对应 `stock_bill_item.id`，BIGINT 按字符串传输 }
        stockBillId: { type: string, description: 对应 `stock_bill_item.bill_id`，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 对应 `stock_bill_item.bill_no` }
        sourceItemId: { type: string, nullable: true, description: 对应 `stock_bill_item.source_item_id`，BIGINT 按字符串传输 }
        productId: { type: string, description: 对应 `stock_bill_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `stock_bill_item.product_code` }
        productName: { type: string, maxLength: 200, description: 对应 `stock_bill_item.product_name` }
        unitName: { type: string, maxLength: 32, description: 对应 `stock_bill_item.unit_name` }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 对应 `stock_bill_item.quantity_precision`，产品数量精度快照 }
        planQty: { type: number, format: double, nullable: true, minimum: 0, multipleOf: 0.01, description: 来源单据计划数量；库存调整可为 null }
        processedQty: { type: number, format: double, nullable: true, minimum: 0, multipleOf: 0.01, description: 生成本单前来源明细累计已入库或已出库数量；库存调整可为 null }
        pendingQty: { type: number, format: double, nullable: true, minimum: 0, multipleOf: 0.01, description: 确认本单后来源明细预计剩余未入库或未出库数量，由后端按 planQty - processedQty - quantity 计算；库存调整可为 null；前端展开明细独立展示为剩余未入库或剩余未出库列，不允许用户手动提交 }
        quantity: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 本次入库/出库业务真实值；来源生成的待确认单初始为 0 或空业务值，由仓库人员确认前填写，确认时必须大于 0 且不能超过来源剩余数量；数据库 `stock_bill_item.quantity` 按 100 倍整数存储；前端展开明细独立展示为入库量或出库量列 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 合格数量业务真实值；数据库 `stock_bill_item.qualified_qty` 按 100 倍整数存储；前端展开明细独立展示，不得与不合格数量拼接为一个质检字段 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 不合格数量业务真实值；数据库 `stock_bill_item.defective_qty` 按 100 倍整数存储；前端展开明细独立展示，不得与合格数量拼接为一个质检字段 }
        beforeQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.before_qty` 按 100 倍整数存储 }
        changeQty: { type: number, format: double, multipleOf: 0.01, description: 业务真实值，入库为正、出库为负；数据库按 100 倍整数存储 }
        afterQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库 `stock_bill_item.after_qty` 按 100 倍整数存储 }
        createTime: { type: string, description: 对应 `stock_bill_item.create_time` }
        updateTime: { type: string, description: 对应 `stock_bill_item.update_time` }
        remark: { type: string, maxLength: 500, description: 对应 `stock_bill_item.remark` }

    WarehouseStock:
      type: object
      required: [stockId, warehouseId, warehouseCode, warehouseName, productId, productCode, productName, unitName, stockQty, lockedQty, availableQty, safetyStockQty, version, updateTime]
      properties:
        stockId:
          type: string
          description: 库存 ID，对应 `warehouse_stock.id`，BIGINT 按字符串传输
        warehouseId:
          type: string
          description: 仓库 ID，对应 `warehouse_stock.warehouse_id`，BIGINT 按字符串传输
        warehouseCode: { type: string, maxLength: 64, description: 对应 `warehouse_stock.warehouse_code` }
        warehouseName: { type: string, maxLength: 100, description: 对应 `warehouse_stock.warehouse_name` }
        productId:
          type: string
          description: 产品 ID，对应 `warehouse_stock.product_id`，BIGINT 按字符串传输
        productCode: { type: string, maxLength: 64, description: 对应 `warehouse_stock.product_code` }
        productName: { type: string, maxLength: 200, description: 对应 `warehouse_stock.product_name` }
        unitName: { type: string, maxLength: 32, description: 对应 `warehouse_stock.unit_name` }
        stockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 当前库存业务真实值；数据库 `warehouse_stock.stock_qty` 按 100 倍整数存储 }
        lockedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 锁定库存业务真实值；数据库 `warehouse_stock.locked_qty` 按 100 倍整数存储 }
        availableQty: { type: number, format: double, minimum: 0, description: 服务层计算 `stock_qty - locked_qty` }
        safetyStockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 安全库存业务真实值；数据库 `product.safety_stock_qty` 按 100 倍整数存储 }
        version: { type: integer, minimum: 0, description: Current `warehouse_stock.version` for optimistic locking/diagnostics. }
        updateTime: { type: string, description: 对应 `warehouse_stock.update_time` }

    WarehouseStockSummary:
      type: object
      required: [warehouseCount, productCount, lowStockCount, noAvailableCount, lockedCount]
      properties:
        warehouseCount: { type: integer, minimum: 0, description: 当前页 `records` 中的去重仓库数 }
        productCount: { type: integer, minimum: 0, description: 当前页 `records` 中的去重产品数 }
        lowStockCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `0 < available_qty <= safety_stock_qty` 的记录数 }
        noAvailableCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `available_qty = 0` 的记录数 }
        lockedCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `locked_qty > 0` 的记录数 }

    WarehousePage:
      type: object
      required: [records, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Warehouse' }
        total: { type: integer, minimum: 0, nullable: true, description: 可选；仓库列表默认使用无总数分页，后端不需要返回精确总数 }
        hasNext: { type: boolean, description: 可选；是否存在下一页，未返回时前端按 `records.length >= pageSize` 保守判断 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    Warehouse:
      type: object
      required: [warehouseId, warehouseCode, warehouseName, contactName, contactPhone, address, status, version, remark, createTime, updateTime]
      properties:
        warehouseId:
          type: string
          description: 仓库 ID，对应 `warehouse.id`，BIGINT 按字符串传输
        warehouseCode:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
          description: 仓库编码，对应 `warehouse.warehouse_code`，由后端生成、全局唯一且创建后不可修改
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        version: { type: integer, minimum: 0, description: Current `warehouse.version` for optimistic locking. }
        remark: { type: string, maxLength: 500 }
        createTime: { type: string }
        updateTime: { type: string }

    WarehouseCreateRequest:
      type: object
      required: [warehouseName, contactName, contactPhone, address, status, remark]
      properties:
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    WarehouseUpdateRequest:
      type: object
      required: [version, warehouseName, contactName, contactPhone, address, status, remark]
      properties:
        version: { type: integer, minimum: 0, description: Current `warehouse.version` for optimistic locking. }
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    WarehouseStatusRequest:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 0, description: Current `warehouse.version` for optimistic locking. }
        status: { type: integer, enum: [0, 1] }

    WarehouseBatchStatusRequest:
      type: object
      required: [warehouseIds, versionByWarehouseId, status]
      properties:
        warehouseIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByWarehouseId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of warehouseId to current `warehouse.version` for optimistic locking.
        status: { type: integer, enum: [0, 1] }

    WarehouseBatchDeleteRequest:
      type: object
      required: [versionByWarehouseId, warehouseIds]
      properties:
        warehouseIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByWarehouseId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of warehouseId to current `warehouse.version` for optimistic locking.

    ProductPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    Product:
      type: object
      required:
        - productId
        - productCode
        - productName
        - categoryName
        - brandName
        - unitName
        - quantityPrecision
        - specification
        - referencePurchasePrice
        - referenceSalePrice
        - safetyStockQty
        - status
        - remark
        - createTime
        - updateTime
      properties:
        productId:
          type: string
          description: 产品 ID，对应 `product.id`
        productCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 产品编码，对应 `product.product_code`，由后端生成、全局唯一且创建后不可修改
        productName:
          type: string
          minLength: 1
          maxLength: 200
          description: 产品名称，对应 `product.product_name`
        categoryId:
          type: string
          nullable: true
          description: 分类 ID，对应 `product.category_id`
        categoryName:
          type: string
          nullable: true
          readOnly: true
          description: 分类展示名称，由后端按 `category_id` 关联 `product_category.category_name` 返回，不在产品表冗余存储；未分类时返回 `null`，无需拼装为空字符串或层级路径
        brandName:
          type: string
          maxLength: 100
        unitName:
          type: string
          minLength: 1
          maxLength: 32
        quantityPrecision:
          type: integer
          minimum: 0
          maximum: 2
          description: 产品数量允许的小数位，箱、瓶、个等离散单位通常为 0，最多保留两位小数
        specification:
          type: string
          maxLength: 255
        barcode:
          type: string
          nullable: true
          maxLength: 64
        referencePurchasePrice:
          type: number
          format: double
          minimum: 0
        referenceSalePrice:
          type: number
          format: double
          minimum: 0
        safetyStockQty:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: 业务真实值；数据库按 100 倍整数存储
        status:
          type: integer
          enum: [0, 1]
        remark:
          type: string
          maxLength: 500
        createTime: { type: string }
        updateTime: { type: string }

    ProductFormRequest:
      type: object
      required:
        - productName
        - categoryId
        - brandName
        - unitName
        - quantityPrecision
        - specification
        - barcode
        - referencePurchasePrice
        - referenceSalePrice
        - safetyStockQty
        - status
        - remark
      properties:
        productName: { type: string, minLength: 1, maxLength: 200 }
        categoryId:
          type: string
          nullable: true
        brandName: { type: string, maxLength: 100 }
        unitName: { type: string, minLength: 1, maxLength: 32 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2 }
        specification: { type: string, maxLength: 255 }
        barcode:
          type: string
          nullable: true
          maxLength: 64
        referencePurchasePrice: { type: number, format: double, minimum: 0 }
        referenceSalePrice: { type: number, format: double, minimum: 0 }
        safetyStockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库按 100 倍整数存储 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    ProductStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1] }

    ProductBatchStatusRequest:
      type: object
      required: [productIds, status]
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status: { type: integer, enum: [0, 1] }

    ProductBatchDeleteRequest:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    ProductCategory:
      type: object
      required: [categoryId, parentId, categoryName, status, productCount, createTime, updateTime]
      properties:
        categoryId:
          type: string
          description: 分类 ID，对应 `product_category.id`
        parentId:
          type: string
          description: 上级分类 ID，对应 `product_category.parent_id`；顶级分类为 `"0"`
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，对应 `product_category.category_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        productCount:
          type: integer
          minimum: 0
          description: 当前分类直接关联的未删除产品数量，通过 `product.category_id` 聚合，不包含下级分类产品
        createTime:
          type: string
          description: 创建时间，对应 `product_category.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `product_category.update_time`

    ProductCategoryCreateRequest:
      type: object
      required: [parentId, categoryName, status]
      properties:
        parentId:
          type: string
          description: 上级分类 ID；顶级分类传 `"0"`
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，提交前去除首尾空格，同一上级下不能重复
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryUpdateRequest:
      type: object
      required: [parentId, categoryName, status]
      properties:
        parentId:
          type: string
          description: 上级分类 ID；禁止设置为自身或自身下级
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，提交前去除首尾空格，同一上级下不能重复
        status:
          type: integer
          enum: [0, 1]
          description: 状态修改必须遵守分类父子级联约束

    ProductCategoryStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryBatchStatusRequest:
      type: object
      required: [categoryIds, status]
      properties:
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryBatchDeleteRequest:
      type: object
      required: [categoryIds]
      properties:
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
