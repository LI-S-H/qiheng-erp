openapi: 3.0.3
info:
  title: 启衡 ERP 接口文档
  version: 0.2.0
  description: |
    本文档用于启衡 ERP 前后端接口约定，可直接导入 Apifox 使用。
    当前版本包含登录模块和系统权限下的用户管理、角色管理模块。
    MVP 阶段认证使用 Sa-Token 原始 token，前端登录成功后通过 `satoken` 请求头传递 token。
servers:
  - url: http://localhost:8080/api
    description: 本地开发环境
tags:
  - name: Auth
    description: 登录、退出和当前用户接口
  - name: SystemUser
    description: 系统权限 - 用户管理
  - name: SystemRole
    description: 系统权限 - 角色管理
  - name: SystemOption
    description: 系统权限 - 页面下拉选项
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                code: 0
                message: success
                data:
                  token: 5f4dcc3b-0000-4000-9000-000000000001
                  tokenName: satoken
                  user:
                    userId: "1900000000000000001"
                    username: admin
                    realName: 系统管理员
                    deptId: "1900000000000000100"
                    deptName: 总部
                    isAdmin: true
                    roleCodes:
                      - SUPER_ADMIN
                    permissionCodes:
                      - "*"
                    lastLoginAt: "2026-06-08 09:12:30"
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags:
        - Auth
      summary: 获取当前登录用户
      operationId: authMe
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CurrentUser'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: 退出登录
      operationId: authLogout
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /system/users:
    get:
      tags:
        - SystemUser
      summary: 分页查询用户
      operationId: systemUserPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 账号、姓名或部门关键词
        - name: deptId
          in: query
          required: false
          schema:
            type: string
          description: 所属部门 ID，对应 `sys_user.dept_id`
        - name: roleId
          in: query
          required: false
          schema:
            type: string
          description: 绑定角色 ID，对应 `sys_user_role.role_id`
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: 状态，1 启用，0 停用
        - name: pageNum
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每页条数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUserPage'
              example:
                code: 0
                message: success
                data:
                  records:
                    - userId: "1900000000000000001"
                      username: admin
                      realName: 系统管理员
                      deptId: "1900000000000000100"
                      deptName: 总部
                      isAdmin: true
                      status: 1
                      roleIds:
                        - "1900000000000001001"
                      roleNames:
                        - 超级管理员
                      lastLoginAt: "2026-06-08 09:12:30"
                      createdAt: "2026-06-05 20:30:00"
                      updatedAt: "2026-06-08 09:12:30"
                  total: 1
                  pageNum: 1
                  pageSize: 10
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - SystemUser
      summary: 新增用户
      operationId: systemUserCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserCreateRequest'
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUser'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/batch/status:
    patch:
      tags:
        - SystemUser
      summary: 批量修改用户状态
      description: 根据用户 ID 列表批量启用或停用账号
      operationId: systemUserBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserBatchStatusRequest'
      responses:
        "200":
          description: 批量修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/batch/password:
    patch:
      tags:
        - SystemUser
      summary: 批量重置用户密码
      description: 根据用户 ID 列表批量设置新密码
      operationId: systemUserBatchPassword
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserBatchPasswordResetRequest'
      responses:
        "200":
          description: 批量重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/batch/delete:
    post:
      tags:
        - SystemUser
      summary: 批量删除用户
      description: 根据用户 ID 列表批量逻辑删除账号，对应 `sys_user.deleted = 1`
      operationId: systemUserBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserBatchDeleteRequest'
      responses:
        "200":
          description: 批量删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/users/{userId}:
    get:
      tags:
        - SystemUser
      summary: 获取用户详情
      operationId: systemUserDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUser'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - SystemUser
      summary: 编辑用户
      operationId: systemUserUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserUpdateRequest'
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemUser'
    delete:
      tags:
        - SystemUser
      summary: 删除用户
      description: 逻辑删除用户，对应 `sys_user.deleted = 1`
      operationId: systemUserDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/users/{userId}/status:
    patch:
      tags:
        - SystemUser
      summary: 修改用户状态
      operationId: systemUserStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserStatusRequest'
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/users/{userId}/password:
    patch:
      tags:
        - SystemUser
      summary: 重置用户密码
      operationId: systemUserPassword
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserPasswordResetRequest'
      responses:
        "200":
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/users/{userId}/roles:
    put:
      tags:
        - SystemUser
      summary: 绑定用户角色
      operationId: systemUserBindRoles
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUserRoleBindRequest'
      responses:
        "200":
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'

  /system/roles:
    get:
      tags:
        - SystemRole
      summary: 分页查询角色
      operationId: systemRolePage
      security:
        - SaTokenAuth: []
      parameters:
        - name: roleCode
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: 角色编码筛选，对应 `sys_role.role_code`
        - name: roleName
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: 角色名称筛选，对应 `sys_role.role_name`
        - name: status
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: 状态，1 启用，0 停用
        - name: pageNum
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 页码
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: 每页条数
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRolePage'
              example:
                code: 0
                message: success
                data:
                  records:
                    - roleId: "1900000000000001001"
                      roleCode: SUPER_ADMIN
                      roleName: 超级管理员
                      permissionCodes:
                        - "*"
                      status: 1
                      remark: 拥有系统全部访问和维护权限
                      userCount: 1
                      createdAt: "2026-06-05 20:30:00"
                      updatedAt: "2026-06-08 09:12:30"
                  total: 1
                  pageNum: 1
                  pageSize: 10
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - SystemRole
      summary: 新增角色
      operationId: systemRoleCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleCreateRequest'
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRole'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/roles/batch/status:
    patch:
      tags:
        - SystemRole
      summary: 批量修改角色状态
      operationId: systemRoleBatchStatus
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleBatchStatusRequest'
      responses:
        "200":
          description: 批量修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/roles/batch/delete:
    post:
      tags:
        - SystemRole
      summary: 批量删除角色
      description: 逻辑删除角色，对应 `sys_role.deleted = 1`。已绑定用户的角色需要先解除 `sys_user_role` 关系后再删除。
      operationId: systemRoleBatchDelete
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleBatchDeleteRequest'
      responses:
        "200":
          description: 批量删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /system/roles/{roleId}:
    get:
      tags:
        - SystemRole
      summary: 获取角色详情
      operationId: systemRoleDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRole'
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - SystemRole
      summary: 编辑角色
      operationId: systemRoleUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleUpdateRequest'
      responses:
        "200":
          description: 编辑成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SystemRole'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - SystemRole
      summary: 删除角色
      description: 逻辑删除角色，对应 `sys_role.deleted = 1`。已绑定用户的角色需要先解除 `sys_user_role` 关系后再删除。
      operationId: systemRoleDelete
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /system/roles/{roleId}/status:
    patch:
      tags:
        - SystemRole
      summary: 修改角色状态
      operationId: systemRoleStatus
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRoleStatusRequest'
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /system/roles/{roleId}/permissions:
    patch:
      tags:
        - SystemRole
      summary: 配置角色权限码
      operationId: systemRolePermissions
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemRolePermissionUpdateRequest'
      responses:
        "200":
          description: 配置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResult'
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /system/roles/options:
    get:
      tags:
        - SystemOption
      summary: 获取角色下拉选项
      operationId: systemRoleOptions
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoleOption'

  /system/depts/options:
    get:
      tags:
        - SystemOption
      summary: 获取部门下拉选项
      operationId: systemDeptOptions
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeptOption'

components:
  securitySchemes:
    SaTokenAuth:
      type: apiKey
      in: header
      name: satoken
      description: Sa-Token 原始 token，前端登录后通过 satoken 请求头传递
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: 用户 ID，对应 `sys_user.id`
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: 角色 ID，对应 `sys_role.id`
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Unauthorized:
      description: 未登录或登录态已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    Forbidden:
      description: 没有访问权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
    NotFound:
      description: 数据不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResult'
  schemas:
    Result:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功
          example: 0
        message:
          type: string
          description: 响应消息
          example: success
        data:
          nullable: true
          description: 响应数据

    EmptyResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    ErrorResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              nullable: true
              example: null

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          description: 登录账号，对应 `sys_user.username`
          example: admin
        password:
          type: string
          format: password
          description: 登录密码，后端与 `sys_user.password_hash` 比对
          example: "123456"

    LoginResponse:
      type: object
      required:
        - token
        - tokenName
        - user
      properties:
        token:
          type: string
          description: Sa-Token 原始 token
        tokenName:
          type: string
          example: satoken
        user:
          $ref: '#/components/schemas/CurrentUser'

    CurrentUser:
      type: object
      required:
        - userId
        - username
        - realName
        - isAdmin
        - roleCodes
        - permissionCodes
      properties:
        userId:
          type: string
          description: 用户 ID，对应 `sys_user.id`
        username:
          type: string
          description: 登录账号
        realName:
          type: string
          description: 用户姓名
        deptId:
          type: string
          nullable: true
          description: 部门 ID
        deptName:
          type: string
          nullable: true
          description: 部门名称
        isAdmin:
          type: boolean
          description: 是否超级管理员
        roleCodes:
          type: array
          items:
            type: string
          description: 角色编码列表
        permissionCodes:
