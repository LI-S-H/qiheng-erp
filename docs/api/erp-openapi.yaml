        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/outbound-bills/{outboundBillId}:
    get:
      tags: [WarehouseStockBill]
      summary: 获取出库单详情
      description: 仅查询 `outbound_bill` 及其明细。人工补录可不关联系统来源；未关联时 `sourceId`、`sourceNo` 和明细 `sourceItemId` 为空，来源对象仍保留线下业务快照。关联来源时 ID 与单号成对存在，前端优先展示 `sourceNo`、`sourcePartyName` 快照。已确认库存流水请使用只读的 `/warehouse/stock-bills` 查询接口；需要 `warehouse:query` 权限。
      operationId: outboundBillDetail
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OutboundBillId' }]
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [WarehouseStockBill]
      summary: 编辑出库单草稿或待确认单
      description: 仅编辑 `outbound_bill`。`DRAFT` 可修改仓库；人工补录草稿可修改来源对象和来源关联，来源单仅支持搜索选择，可显式清除关联；调整出库草稿可修改来源仓库但调整单号保持不变；系统生成单据必须保持来源不变。`PENDING_CONFIRM` 锁定仓库、来源和产品结构，仅允许调整数量、质量数量和备注；仅调整出库编辑数量、产品或草稿仓库时，后端会在同一事务内调整本单预占的 `lockedQty`；需要 `warehouse:manage` 权限。
      operationId: outboundBillUpdate
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OutboundBillId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockBillUpdateRequest' }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/outbound-bills/{outboundBillId}/submit:
    post:
      tags: [WarehouseStockBill]
      summary: 提交出库单草稿为待确认
      description: 仅允许 `DRAFT -> PENDING_CONFIRM`，不改变库存、不生成库存流水；需要 `warehouse:manage` 权限并保证幂等。
      operationId: outboundBillSubmit
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OutboundBillId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' } } } }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/outbound-bills/{outboundBillId}/confirm:
    post:
      tags: [WarehouseStockBill]
      summary: 确认出库单
      description: 仅允许 `PENDING_CONFIRM -> CONFIRMED`。后端在同一事务内校验出库单与库存、生成库存流水并扣减库存；销售出库、采购退货出库和调整出库均同时扣减对应的 `lockedQty`。系统生成采购退货单必须已由来源审核流程预占，锁定量不足时确认失败且不生成库存事实；`pendingQty` 为只读结果，前端不得提交；需要 `warehouse:manage` 权限并保证幂等。
      operationId: outboundBillConfirm
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OutboundBillId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' } } } }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/outbound-bills/{outboundBillId}/cancel:
    post:
      tags: [WarehouseStockBill]
      summary: 取消出库单草稿或待确认单
      description: 仅允许手工 `DRAFT/PENDING_CONFIRM -> CANCELLED`，不改变实际库存；仅手工调整出库会释放本单已预占的 `lockedQty`。`SOURCE_GENERATED` 的采购退货单不得调用本接口，必须由采购退货业务在同一事务内取消来源单、取消工作单并释放剩余锁定量。需要 `warehouse:manage` 权限并保证幂等。
      operationId: outboundBillCancel
      security: [{ SaTokenAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OutboundBillId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OptimisticLockVersionRequest' } } } }
      responses:
        "200": { $ref: '#/components/responses/StockBillDetailSuccess' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/warehouses:
    get:
      tags: [Warehouse]
      summary: 分页查询仓库
      description: |
        查询未删除的 `warehouse` 数据。仓库编码、仓库名称、联系人和联系电话分别使用包含匹配，状态使用精确匹配，多个有效条件按 AND 组合。
        仓库列表使用无总数分页，后端不需要返回精确 `total`，也不需要为了分页执行额外 `COUNT(*)`；前端只展示当前页、上一页和下一页。
