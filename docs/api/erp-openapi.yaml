        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
  /ai/scheduled-tasks:
    get:
      tags: [AIAssistant]
      summary: 获取经营任务中心数据
      description: |
        返回经营任务中心首屏数据，包括任务摘要、内置模板、已配置任务和最近执行记录。任务由后端调度器触发多智能体协同分析，执行结果直接在本页面展示。
        任务配置必须允许指定商品范围、仓库范围、接收人和分析目标。例如采购补货建议任务应明确关注商品，不能只有一个泛化定时器。
      operationId: aiScheduledTaskPage
      security:
        - SaTokenAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTaskPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [AIAssistant]
      summary: 新增经营任务
      description: 新增用户自定义经营任务。任务可以由内置模板带入，也可以完全自定义；保存后进入调度配置，不立即写入业务单据。
      operationId: aiScheduledTaskCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiScheduledTaskUpdateRequest'
      responses:
        "200":
          description: 新增成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /ai/scheduled-tasks/{taskId}:
    patch:
      tags: [AIAssistant]
      summary: 编辑经营任务配置
      description: |
        修改经营任务的可编辑配置，包括任务名称、执行频率、cron、关注商品、关注仓库、接收人和分析目标。
        不允许通过本接口修改系统生成字段、执行结果、审计字段或任务执行状态；启停状态使用 `/ai/scheduled-tasks/{taskId}/status`。
      operationId: aiScheduledTaskUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
          description: AI 定时任务 ID，BIGINT 或稳定任务编码按字符串传输
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiScheduledTaskUpdateRequest'
            example:
              taskName: 采购补货建议
              frequency: DAILY
              cronExpression: "0 0 10 * * ?"
              productIds: ["1920000000000000007", "1920000000000000013", "1920000000000000008"]
              warehouseIds: ["1930000000000000001", "1930000000000000002"]
              recipientRoleIds: ["1880000000000000002"]
              analysisGoal: 根据指定商品的销量预测、当前库存、安全库存、在途采购和供应商评分给出补货建议。
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTask' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /ai/scheduled-tasks/{taskId}/run:
    post:
      tags: [AIAssistant]
      summary: 立即执行经营任务
      description: 手动触发一次定时经营任务。后端创建执行记录并异步调度多智能体协同分析，接口只返回已受理的执行标识；执行结果写入最近执行记录，不直接生成正式业务单据。
      operationId: aiScheduledTaskRun
      security:
        - SaTokenAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
          description: AI 定时任务 ID，BIGINT 或稳定任务编码按字符串传输
      responses:
        "200":
          description: 已受理执行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiScheduledTaskRunAccepted' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

