        supplierId: { type: string, description: 对应 `purchase_order.supplier_id`，BIGINT 按字符串传输 }
        supplierCode: { type: string, maxLength: 64, description: 对应 `purchase_order.supplier_code` 供应商快照 }
        supplierName: { type: string, maxLength: 200, description: 对应 `purchase_order.supplier_name` 供应商快照 }
        warehouseId: { type: string, description: 对应 `purchase_order.warehouse_id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 对应 `purchase_order.warehouse_name` 仓库快照 }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_INBOUND, INBOUND_DONE, CANCELLED], description: 对应 `purchase_order.status` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `purchase_order.total_amount` }
        expectedArrivalDate: { type: string, nullable: true, description: 对应 `purchase_order.expected_arrival_date`；草稿可为空，提交和审核前必须非空 }
        createdById: { type: string, nullable: true, description: 对应 `purchase_order.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 对应 `purchase_order.created_by_name` }
        submittedAt: { type: string, nullable: true, description: 对应 `purchase_order.submitted_at` }
        approvedById: { type: string, nullable: true, description: 对应 `purchase_order.approved_by_id`，BIGINT 按字符串传输 }
        approvedByName: { type: string, maxLength: 100, description: 对应 `purchase_order.approved_by_name` }
        approvedAt: { type: string, nullable: true, description: 对应 `purchase_order.approved_at` }
        createTime: { type: string, description: 对应 `purchase_order.create_time` }
        updateTime: { type: string, description: 对应 `purchase_order.update_time` }
        version: { type: integer, minimum: 0, description: Current `purchase_order.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `purchase_order.remark` }
    PurchaseOrderDetail:
      allOf:
        - $ref: '#/components/schemas/PurchaseOrder'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PurchaseOrderItem' }

    PurchaseOrderItem:
      type: object
      required: [purchaseOrderItemId, purchaseOrderId, purchaseNo, supplierProductId, productId, productCode, productName, unitName, quantityPrecision, quantity, inboundQty, unitPrice, totalAmount, selectedSupplierScore, remark]
      properties:
        purchaseOrderItemId: { type: string, description: 对应 `purchase_order_item.id`，BIGINT 按字符串传输 }
        purchaseOrderId: { type: string, description: 对应 `purchase_order_item.purchase_order_id`，BIGINT 按字符串传输 }
        purchaseNo: { type: string, maxLength: 64, description: 对应 `purchase_order_item.purchase_no` }
        supplierProductId: { type: string, nullable: true, description: 对应 `purchase_order_item.supplier_product_id`，BIGINT 按字符串传输，可为空 }
        productId: { type: string, description: 对应 `purchase_order_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `purchase_order_item.product_code` 产品快照 }
        productName: { type: string, maxLength: 200, description: 对应 `purchase_order_item.product_name` 产品快照 }
        unitName: { type: string, maxLength: 32, description: 对应 `purchase_order_item.unit_name` 产品单位快照 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 下单时固化的产品数量精度快照；只读，前端不得提交修改 }
        quantity: { type: number, format: double, minimum: 0, exclusiveMinimum: true, description: 对应 `purchase_order_item.quantity`；小数位不得超过该明细的 `quantityPrecision`，0 时仅允许整数 }
        inboundQty: { type: number, format: double, minimum: 0, description: 对应 `purchase_order_item.inbound_qty` }
        unitPrice: { type: number, format: double, minimum: 0, description: 对应 `purchase_order_item.unit_price` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `purchase_order_item.total_amount` }
        selectedSupplierScore: { type: number, format: double, minimum: 0, maximum: 100, description: 下单时推荐分展示值；数据库 `purchase_order_item.selected_supplier_score` 按 100 倍整数存储 }
        remark: { type: string, maxLength: 500, description: 对应 `purchase_order_item.remark` }

    PurchaseOrderCreateRequest:
      type: object
      required: [supplierId, warehouseId, expectedArrivalDate, remark, items]
      properties:
        supplierId: { type: string, description: 启用供应商 ID；后端保存供应商编码和名称快照 }
        warehouseId: { type: string, description: 启用仓库 ID；后端保存仓库名称快照 }
        expectedArrivalDate: { type: string, nullable: true, description: 对应 `purchase_order.expected_arrival_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderDraftItemRequest' }

    PurchaseOrderUpdateRequest:
      type: object
      required: [version, supplierId, warehouseId, expectedArrivalDate, remark, items]
      properties:
        version: { type: integer, minimum: 0, description: Current `purchase_order.version` for optimistic locking. }
        supplierId: { type: string, description: 供应商 ID；`DRAFT` 可由采购创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存供应商编码和名称快照 }
        warehouseId: { type: string, description: 入库仓库 ID；`DRAFT` 可由采购创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存仓库名称快照 }
        expectedArrivalDate: { type: string, nullable: true, description: 对应 `purchase_order.expected_arrival_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500, description: 对应 `purchase_order.remark` }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseOrderDraftItemRequest' }

    PurchaseOrderDraftItemRequest:
      type: object
      required: [productId, quantity, unitPrice, selectedSupplierScore, remark]
      properties:
        purchaseOrderItemId: { type: string, nullable: true, description: 编辑草稿时传已有明细 ID，对应 `purchase_order_item.id`；新增明细或创建订单时不传 }
        supplierProductId: { type: string, nullable: true, description: 选中的供货关系 ID，对应 `supplier_product.id`；前端应按单头供应商和产品双向过滤后传入，若为空或与 `supplierId`、`productId` 不匹配，后端必须拒绝或按启用供货关系重新校验 }
        productId: { type: string, description: 启用产品 ID；后端保存产品编码、名称和单位快照 }
        quantity: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        unitPrice: { type: number, format: double, minimum: 0 }
        selectedSupplierScore: { type: number, format: double, minimum: 0, maximum: 100 }
        remark: { type: string, maxLength: 500 }

    ReturnOrderPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/ReturnOrder' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    ReturnOrder:
      type: object
      required: [returnOrderId, returnNo, returnType, sourceOrderId, sourceOrderNo, partyId, partyCode, partyName, warehouseId, warehouseName, expectedExecutionDate, handlingType, reasonCode, returnReason, totalAmount, status, statusReason, createdById, createdByName, submittedAt, approvedById, approvedByName, approvedAt, createTime, updateTime, remark, version]
      properties:
        returnOrderId: { type: string, readOnly: true, description: 对应 `return_order.id`，BIGINT 按字符串传输 }
        returnNo: { type: string, maxLength: 64, readOnly: true, description: 对应 `return_order.return_no`，由后端生成、唯一 }
        returnType: { type: string, enum: [SALES_RETURN, PURCHASE_RETURN], readOnly: true, description: 对应 `return_order.return_type`；创建后不可修改 }
        sourceOrderId: { type: string, description: 对应 `return_order.source_order_id`，BIGINT 按字符串传输 }
        sourceOrderNo: { type: string, maxLength: 64, readOnly: true, description: 对应 `return_order.source_order_no` 原订单号快照 }
        partyId: { type: string, readOnly: true, description: 对应 `return_order.party_id`，BIGINT 按字符串传输；采购退回为供应商 ID，销售退货为客户 ID }
        partyCode: { type: string, maxLength: 64, readOnly: true, description: 对应 `return_order.party_code` 往来单位编码快照 }
        partyName: { type: string, maxLength: 200, readOnly: true, description: 对应 `return_order.party_name` 往来单位名称快照 }
        warehouseId: { type: string, description: 对应 `return_order.warehouse_id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, readOnly: true, description: 对应 `return_order.warehouse_name` 仓库名称快照 }
        expectedExecutionDate: { type: string, format: date, nullable: true, description: 对应 `return_order.expected_execution_date`；草稿可空，提交前必填 }
        handlingType: { type: string, enum: [REFUND, EXCHANGE, OTHER], description: 对应 `return_order.handling_type` }
        reasonCode: { type: string, enum: [QUALITY_ISSUE, DAMAGED, WRONG_ITEM, QUANTITY_ERROR, SPEC_MISMATCH, NO_LONGER_NEEDED, OTHER], description: 对应 `return_order.reason_code` }
        returnReason: { type: string, maxLength: 500, description: 对应 `return_order.return_reason`；原因选择 OTHER 时必填 }
        totalAmount: { type: number, format: double, minimum: 0, readOnly: true, description: 对应 `return_order.total_amount`，由后端按状态汇总明细；取消单保留取消前按申请数量计算的金额快照，仅用于历史追溯 }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_EXECUTED, COMPLETED, CANCELLED], readOnly: true, description: 对应 `return_order.status` }
        statusReason: { type: string, maxLength: 500, readOnly: true, description: 对应 `return_order.status_reason`，仅记录最近一次审核退回或取消原因 }
        createdById: { type: string, nullable: true, readOnly: true, description: 对应 `return_order.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, readOnly: true, description: 对应 `return_order.created_by_name` }
        submittedAt: { type: string, nullable: true, readOnly: true, description: 对应 `return_order.submitted_at` }
        approvedById: { type: string, nullable: true, readOnly: true, description: 对应 `return_order.approved_by_id`，BIGINT 按字符串传输 }
        approvedByName: { type: string, maxLength: 100, readOnly: true, description: 对应 `return_order.approved_by_name` }
        approvedAt: { type: string, nullable: true, readOnly: true, description: 对应 `return_order.approved_at` }
        createTime: { type: string, readOnly: true, description: 对应 `return_order.create_time` }
        updateTime: { type: string, readOnly: true, description: 对应 `return_order.update_time` }
        remark: { type: string, maxLength: 500, description: 对应 `return_order.remark` }
        version: { type: integer, minimum: 0, description: 对应 `return_order.version`，更新和动作使用的乐观锁版本 }

    ReturnOrderDetail:
      allOf:
        - $ref: '#/components/schemas/ReturnOrder'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ReturnOrderItem' }

    ReturnOrderItem:
      type: object
      required: [returnOrderItemId, returnOrderId, sourceOrderItemId, productId, productCode, productName, unitName, quantityPrecision, sourceFulfilledQty, availableReturnQty, requestedQty, approvedQty, processedQty, unitPrice, totalAmount, createTime, updateTime, remark]
      properties:
        returnOrderItemId: { type: string, readOnly: true, description: 对应 `return_order_item.id`，BIGINT 按字符串传输 }
        returnOrderId: { type: string, readOnly: true, description: 对应 `return_order_item.return_order_id`，BIGINT 按字符串传输 }
        sourceOrderItemId: { type: string, description: 对应 `return_order_item.source_order_item_id`，BIGINT 按字符串传输 }
        productId: { type: string, readOnly: true, description: 对应 `return_order_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, readOnly: true, description: 对应 `return_order_item.product_code` 产品快照 }
        productName: { type: string, maxLength: 200, readOnly: true, description: 对应 `return_order_item.product_name` 产品快照 }
        unitName: { type: string, maxLength: 32, readOnly: true, description: 对应 `return_order_item.unit_name` 单位快照 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, readOnly: true, description: 对应 `return_order_item.quantity_precision` 数量精度快照 }
        sourceFulfilledQty: { type: number, format: double, exclusiveMinimum: true, minimum: 0, readOnly: true, description: 对应 `return_order_item.source_fulfilled_qty`；采购退回取原采购明细累计已入库数量，销售退货取原销售明细累计已出库数量 }
        availableReturnQty: { type: number, format: double, minimum: 0, readOnly: true, description: 服务端查询派生的当前剩余可退数量，不落 `return_order_item`；提交和审核时仍需重新聚合 }
        requestedQty: { type: number, format: double, exclusiveMinimum: true, minimum: 0, description: 对应 `return_order_item.requested_qty` }
        approvedQty: { type: number, format: double, minimum: 0, readOnly: true, description: 对应 `return_order_item.approved_qty`，仅审核接口可提交 }
        processedQty: { type: number, format: double, minimum: 0, readOnly: true, description: 对应 `return_order_item.processed_qty`，由仓库确认回写 }
        unitPrice: { type: number, format: double, minimum: 0, readOnly: true, description: 对应 `return_order_item.unit_price` 原订单单价快照 }
        totalAmount: { type: number, format: double, minimum: 0, readOnly: true, description: 对应 `return_order_item.total_amount`，由后端计算 }
        createTime: { type: string, readOnly: true, description: 对应 `return_order_item.create_time` }
        updateTime: { type: string, readOnly: true, description: 对应 `return_order_item.update_time` }
        remark: { type: string, maxLength: 500, description: 对应 `return_order_item.remark` }

    ReturnableSourceOrderPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/ReturnableSourceOrder' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    ReturnableSourceOrder:
      type: object
      required: [sourceOrderId, sourceOrderNo, partyId, partyCode, partyName, warehouseId, warehouseName, fulfilledItemCount, totalAvailableReturnQty]
      properties:
        sourceOrderId: { type: string, description: 原采购或销售订单 ID，BIGINT 按字符串传输 }
        sourceOrderNo: { type: string, maxLength: 64, description: 原订单号 }
        partyId: { type: string, description: 供应商或客户 ID，BIGINT 按字符串传输 }
        partyCode: { type: string, maxLength: 64, description: 供应商或客户编码快照 }
        partyName: { type: string, maxLength: 200, description: 供应商或客户名称快照 }
        warehouseId: { type: string, description: 原订单执行仓库 ID，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 原订单执行仓库名称快照 }
        fulfilledItemCount: { type: integer, minimum: 1, description: 仍有剩余可退数量的来源明细数，由服务端查询聚合 }
        totalAvailableReturnQty: { type: number, format: double, exclusiveMinimum: true, minimum: 0, description: 各来源明细剩余可退数量之和，仅用于选择器摘要；不同单位不得用于业务总量决策 }

    ReturnableSourceOrderItem:
      type: object
      required: [sourceOrderItemId, productId, productCode, productName, unitName, quantityPrecision, sourceFulfilledQty, occupiedQty, availableReturnQty, unitPrice]
      properties:
        sourceOrderItemId: { type: string, description: 原采购或销售明细 ID，BIGINT 按字符串传输 }
        productId: { type: string, description: 产品 ID，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 原订单明细产品编码快照 }
        productName: { type: string, maxLength: 200, description: 原订单明细产品名称快照 }
        unitName: { type: string, maxLength: 32, description: 原订单明细单位快照 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 产品数量精度；退回数量只允许 0～2 位小数 }
        sourceFulfilledQty: { type: number, format: double, exclusiveMinimum: true, minimum: 0, description: 原订单累计履约数量；采购取 `purchase_order_item.inbound_qty`，销售取 `sales_order_item.outbound_qty` }
        occupiedQty: { type: number, format: double, minimum: 0, description: 其他同类型有效退货单占用数量，服务端查询派生，不落退货明细 }
        availableReturnQty: { type: number, format: double, exclusiveMinimum: true, minimum: 0, description: "sourceFulfilledQty - occupiedQty，服务端查询派生，前端不得自行跨单计算" }
        unitPrice: { type: number, format: double, minimum: 0, description: 原采购或销售订单明细单价快照 }

    PurchaseReturnOrderCreateRequest:
      type: object
      required: [returnType, sourceOrderId, warehouseId, expectedExecutionDate, handlingType, reasonCode, returnReason, remark, items]
      properties:
        returnType: { type: string, enum: [PURCHASE_RETURN], description: 由采购退回 API adapter 固定注入，页面不可编辑；后端必须校验与路径业务类型一致 }
        sourceOrderId: { type: string, description: 原采购订单 ID，BIGINT 按字符串传输 }
        warehouseId: { type: string, description: 退货出库仓库 ID，BIGINT 按字符串传输 }
        expectedExecutionDate: { type: string, format: date, nullable: true, description: 草稿可空，提交前必须非空 }
        handlingType: { type: string, enum: [REFUND, EXCHANGE, OTHER] }
        reasonCode: { type: string, enum: [QUALITY_ISSUE, DAMAGED, WRONG_ITEM, QUANTITY_ERROR, SPEC_MISMATCH, NO_LONGER_NEEDED, OTHER] }
        returnReason: { type: string, maxLength: 500, description: 原因选择 OTHER 时必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReturnOrderDraftItemRequest' }

    SalesReturnOrderCreateRequest:
      type: object
      required: [returnType, sourceOrderId, warehouseId, expectedExecutionDate, handlingType, reasonCode, returnReason, remark, items]
      properties:
        returnType: { type: string, enum: [SALES_RETURN], description: 由销售退货 API adapter 固定注入，页面不可编辑；后端必须校验与路径业务类型一致 }
        sourceOrderId: { type: string, description: 原销售订单 ID，BIGINT 按字符串传输 }
        warehouseId: { type: string, description: 退货入库仓库 ID，BIGINT 按字符串传输 }
        expectedExecutionDate: { type: string, format: date, nullable: true, description: 草稿可空，提交前必须非空 }
        handlingType: { type: string, enum: [REFUND, EXCHANGE, OTHER] }
        reasonCode: { type: string, enum: [QUALITY_ISSUE, DAMAGED, WRONG_ITEM, QUANTITY_ERROR, SPEC_MISMATCH, NO_LONGER_NEEDED, OTHER] }
        returnReason: { type: string, maxLength: 500, description: 原因选择 OTHER 时必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReturnOrderDraftItemRequest' }

    ReturnOrderUpdateRequest:
      type: object
      required: [version, sourceOrderId, warehouseId, expectedExecutionDate, handlingType, reasonCode, returnReason, remark, items]
      properties:
        version: { type: integer, minimum: 0, description: 当前 `return_order.version` }
        sourceOrderId: { type: string, description: 原订单 ID，BIGINT 按字符串传输 }
        warehouseId: { type: string, description: 退货执行仓库 ID，BIGINT 按字符串传输 }
        expectedExecutionDate: { type: string, format: date, nullable: true, description: 草稿可空，提交前必须非空 }
        handlingType: { type: string, enum: [REFUND, EXCHANGE, OTHER] }
        reasonCode: { type: string, enum: [QUALITY_ISSUE, DAMAGED, WRONG_ITEM, QUANTITY_ERROR, SPEC_MISMATCH, NO_LONGER_NEEDED, OTHER] }
        returnReason: { type: string, maxLength: 500, description: 原因选择 OTHER 时必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReturnOrderDraftItemRequest' }

    ReturnOrderDraftItemRequest:
      type: object
      required: [sourceOrderItemId, requestedQty, remark]
      properties:
        sourceOrderItemId: { type: string, description: 原订单明细 ID，BIGINT 按字符串传输 }
        requestedQty: { type: number, format: double, exclusiveMinimum: true, minimum: 0, description: 申请退回数量，不得超过服务端重新计算的剩余可退数量，且小数位不得超过数量精度 }
        remark: { type: string, maxLength: 500 }

    ReturnOrderApproveRequest:
      type: object
      required: [version, items]
      properties:
        version: { type: integer, minimum: 0, description: 当前 `return_order.version` }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [returnOrderItemId, approvedQty]
            properties:
              returnOrderItemId: { type: string, description: 退回明细 ID，BIGINT 按字符串传输 }
              approvedQty: { type: number, format: double, minimum: 0, description: 审核通过数量，不得超过对应 `requestedQty` }

    ReturnOrderReasonActionRequest:
      type: object
      required: [version, reason]
      properties:
        version: { type: integer, minimum: 0, description: 当前 `return_order.version` }
        reason: { type: string, minLength: 1, maxLength: 500, description: 审核退回或取消原因，写入 `return_order.status_reason` }

    SalesCustomerPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SalesCustomer' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    SalesCustomer:
      type: object
      required: [customerId, customerCode, customerName, contactName, contactPhone, address, creditLimit, status, version, remark, createTime, updateTime]
      properties:
        customerId: { type: string, description: 对应 `customer.id`，BIGINT 按字符串传输 }
        customerCode: { type: string, minLength: 1, maxLength: 64, readOnly: true, description: 对应 `customer.customer_code`，由后端生成、全局唯一且创建后不可修改 }
        customerName: { type: string, minLength: 1, maxLength: 200, description: 对应 `customer.customer_name` }
        contactName: { type: string, maxLength: 100, description: 对应 `customer.contact_name` }
        contactPhone: { type: string, maxLength: 32, description: 对应 `customer.contact_phone` }
        address: { type: string, maxLength: 255, description: 对应 `customer.address` }
        creditLimit: { type: number, format: double, minimum: 0, description: 对应 `customer.credit_limit`，MVP 仅记录不强拦截 }
        status: { type: integer, enum: [0, 1], description: 对应 `customer.status`，1 启用，0 停用 }
        version: { type: integer, minimum: 0, description: Current `customer.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `customer.remark` }
        createTime: { type: string, description: 对应 `customer.create_time` }
        updateTime: { type: string, description: 对应 `customer.update_time` }

    SalesCustomerFormRequest:
      type: object
      required: [customerName, contactName, contactPhone, address, creditLimit, status, remark]
      properties:
        customerName: { type: string, minLength: 1, maxLength: 200 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        creditLimit: { type: number, format: double, minimum: 0 }
        status: { type: integer, enum: [0, 1] }
        version: { type: integer, minimum: 0, description: Required when editing an existing customer; omit on create. }
        remark: { type: string, maxLength: 500 }

    SalesCustomerStatusRequest:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 0, description: Current `customer.version` for optimistic locking. }
        status: { type: integer, enum: [0, 1] }

    SalesCustomerBatchStatusRequest:
      type: object
      required: [customerIds, versionByCustomerId, status]
      properties:
        customerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByCustomerId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of customerId to current `customer.version` for optimistic locking.
        status: { type: integer, enum: [0, 1] }

    SalesCustomerBatchDeleteRequest:
      type: object
      required: [versionByCustomerId, customerIds]
      properties:
        customerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByCustomerId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of customerId to current `customer.version` for optimistic locking.

    SalesOrderPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/SalesOrder' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
    SalesOrder:
      type: object
      required: [salesOrderId, salesNo, customerId, customerCode, customerName, warehouseId, warehouseName, status, totalAmount, expectedDeliveryDate, lockedAt, createdById, createdByName, submittedAt, approvedById, approvedByName, approvedAt, createTime, updateTime, version, remark]
      properties:
        salesOrderId: { type: string, description: 对应 `sales_order.id`，BIGINT 按字符串传输 }
        salesNo: { type: string, maxLength: 64, readOnly: true, description: 对应 `sales_order.sales_no`，由后端生成、全局唯一 }
        customerId: { type: string, description: 对应 `sales_order.customer_id`，BIGINT 按字符串传输 }
        customerCode: { type: string, maxLength: 64, description: 对应 `sales_order.customer_code` 客户快照 }
        customerName: { type: string, maxLength: 200, description: 对应 `sales_order.customer_name` 客户快照 }
        warehouseId: { type: string, description: 对应 `sales_order.warehouse_id`，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 对应 `sales_order.warehouse_name` 仓库快照 }
        status: { type: string, enum: [DRAFT, SUBMITTED, APPROVED, PARTIAL_OUTBOUND, OUTBOUND_DONE, CANCELLED], description: 对应 `sales_order.status` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `sales_order.total_amount` }
        expectedDeliveryDate: { type: string, nullable: true, description: 对应 `sales_order.expected_delivery_date`；草稿可为空，提交和审核前必须非空 }
        lockedAt: { type: string, nullable: true, description: 对应 `sales_order.locked_at`，库存锁定成功后由后端写入 }
        createdById: { type: string, nullable: true, description: 对应 `sales_order.created_by_id`，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 对应 `sales_order.created_by_name` }
        submittedAt: { type: string, nullable: true, description: 对应 `sales_order.submitted_at` }
        approvedById: { type: string, nullable: true, description: 对应 `sales_order.approved_by_id`，BIGINT 按字符串传输 }
        approvedByName: { type: string, maxLength: 100, description: 对应 `sales_order.approved_by_name` }
        approvedAt: { type: string, nullable: true, description: 对应 `sales_order.approved_at` }
        createTime: { type: string, description: 对应 `sales_order.create_time` }
        updateTime: { type: string, description: 对应 `sales_order.update_time` }
        version: { type: integer, minimum: 0, description: Current `sales_order.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `sales_order.remark` }
    SalesOrderDetail:
      allOf:
        - $ref: '#/components/schemas/SalesOrder'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/SalesOrderItem' }

    SalesOrderItem:
      type: object
      required: [salesOrderItemId, salesOrderId, salesNo, productId, productCode, productName, unitName, quantityPrecision, quantity, lockedQty, outboundQty, unitPrice, totalAmount, remark]
      properties:
        salesOrderItemId: { type: string, description: 对应 `sales_order_item.id`，BIGINT 按字符串传输 }
        salesOrderId: { type: string, description: 对应 `sales_order_item.sales_order_id`，BIGINT 按字符串传输 }
        salesNo: { type: string, maxLength: 64, description: 对应 `sales_order_item.sales_no` }
        productId: { type: string, description: 对应 `sales_order_item.product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应 `sales_order_item.product_code` 产品快照 }
        productName: { type: string, maxLength: 200, description: 对应 `sales_order_item.product_name` 产品快照 }
        unitName: { type: string, maxLength: 32, description: 对应 `sales_order_item.unit_name` 产品单位快照 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 下单时固化的产品数量精度快照；只读，前端不得提交修改 }
        quantity: { type: number, format: double, minimum: 0, exclusiveMinimum: true, description: 对应 `sales_order_item.quantity`；小数位不得超过该明细的 `quantityPrecision`，0 时仅允许整数 }
        lockedQty: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.locked_qty`，提交或审核锁定库存后由后端写入 }
        outboundQty: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.outbound_qty`，仓库确认出库后回写 }
        unitPrice: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.unit_price` }
        totalAmount: { type: number, format: double, minimum: 0, description: 对应 `sales_order_item.total_amount` }
        remark: { type: string, maxLength: 500, description: 对应 `sales_order_item.remark` }

    SalesOrderCreateRequest:
      type: object
      required: [customerId, warehouseId, expectedDeliveryDate, remark, items]
      properties:
        customerId: { type: string, description: 启用客户 ID；后端保存客户编码和名称快照 }
        warehouseId: { type: string, description: 启用出库仓库 ID；后端保存仓库名称快照 }
        expectedDeliveryDate: { type: string, nullable: true, description: 对应 `sales_order.expected_delivery_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SalesOrderDraftItemRequest' }

    SalesOrderUpdateRequest:
      type: object
      required: [version, customerId, warehouseId, expectedDeliveryDate, remark, items]
      properties:
        version: { type: integer, minimum: 0, description: Current `sales_order.version` for optimistic locking. }
        customerId: { type: string, description: 客户 ID；`DRAFT` 可由销售创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存客户编码和名称快照 }
        warehouseId: { type: string, description: 出库仓库 ID；`DRAFT` 可由销售创建权限修改，`SUBMITTED` 仅允许审核/审批权限修改，后端重新保存仓库名称快照 }
        expectedDeliveryDate: { type: string, nullable: true, description: 对应 `sales_order.expected_delivery_date`；草稿可为空，提交和审核前必须非空 }
        remark: { type: string, maxLength: 500, description: 对应 `sales_order.remark` }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SalesOrderDraftItemRequest' }

    SalesOrderDraftItemRequest:
      type: object
      required: [productId, quantity, unitPrice, remark]
      properties:
        salesOrderItemId: { type: string, nullable: true, description: 编辑草稿时传已有明细 ID，对应 `sales_order_item.id`；新增明细或创建订单时不传 }
        productId: { type: string, description: 启用产品 ID；后端保存产品编码、名称和单位快照 }
        quantity: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        unitPrice: { type: number, format: double, minimum: 0 }
        remark: { type: string, maxLength: 500 }

    WarehouseStockPage:
      type: object
      required: [records, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/WarehouseStock' }
        total: { type: integer, minimum: 0, nullable: true, description: 可选；库存余额默认使用无总数分页，后端不需要返回精确总数 }
        hasNext: { type: boolean, description: 可选；是否存在下一页，未返回时前端按 `records.length >= pageSize` 保守判断 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/WarehouseStockSummary' }

    StockBillDraftItemRequest:
      type: object
      description: 工作单明细写入 DTO；保留历史 schema 名称仅为前端类型兼容，不表示直接写入 `stock_bill_item`。
      required: [productId, currentQty, qualifiedQty, defectiveQty, remark]
      properties:
        workBillItemId: { type: string, nullable: true, description: 编辑草稿时传明细 ID；新增明细时不传 }
        productId: { type: string, description: 产品 ID，后端保存当前产品编码、名称和单位快照 }
        currentQty: { type: number, format: double, minimum: 0, exclusiveMinimum: true, multipleOf: 0.01, description: 本次出入库业务真实值，最多两位小数；后端按产品数量精度校验并按 100 倍整数持久化 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 采购入库或销售退货的合格数量，其他类型传 0 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 采购入库或销售退货的不合格数量，其他类型传 0 }
        remark: { type: string, maxLength: 500 }

    StockBillCreateRequest:
      type: object
      description: 入库/出库工作单创建 DTO；实际落库到 `inbound_bill` 或 `outbound_bill` 及其明细表。
      required: [billType, sourceNo, warehouseId, manualReason, items, remark]
      properties:
        billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT], description: 手工补录或库存调整类型 }
        sourceNo: { type: string, maxLength: 64, description: 非调整类型必填原业务单号；调整类型传空字符串，由后端生成调整单号 }
        warehouseId: { type: string, description: 启用状态的仓库 ID }
        sourcePartyId: { type: string, nullable: true, description: 来源对象 ID；采购入库/采购退货出库为供应商 ID，销售出库/销售退货为客户 ID，调整入库/出库为来源仓库 ID。必填，由前端下拉选择 }
        sourcePartyName: { type: string, nullable: true, maxLength: 200, description: 来源对象名称快照；由前端在选中 sourcePartyId 后附带提交，后端直接存入主表，不跨模块查询 }
        manualReason: { type: string, minLength: 1, maxLength: 500, description: 补录原因或库存调整原因，必填 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StockBillDraftItemRequest' }
        remark: { type: string, maxLength: 500 }

    InboundBillCreateRequest:
      allOf:
        - $ref: '#/components/schemas/StockBillCreateRequest'
        - type: object
          properties:
            billType: { type: string, enum: [PURCHASE_IN, SALES_RETURN, ADJUST_IN], description: 入库单类型 }

    OutboundBillCreateRequest:
      allOf:
        - $ref: '#/components/schemas/StockBillCreateRequest'
        - type: object
          properties:
            billType: { type: string, enum: [SALES_OUT, PURCHASE_RETURN, ADJUST_OUT], description: 出库单类型 }

    StockBillUpdateRequest:
      type: object
      description: 入库/出库工作单更新 DTO；不直接更新确认后的库存流水。
      required: [version, items]
      properties:
        version: { type: integer, minimum: 0, description: 当前入库单或出库单工作单版本，用于乐观锁。 }
        warehouseId: { type: string, description: 仓库 ID；仅 `DRAFT` 状态允许修改，`PENDING_CONFIRM` 必须保持原值 }
        sourceNo: { type: string, maxLength: 64, description: 手工补录草稿可维护原业务单号；其他录入方式保持原值 }
        manualReason: { type: string, maxLength: 500, description: 手工补录或调整草稿必填；系统生成单据保持原值 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/StockBillDraftItemRequest' }
        remark: { type: string, maxLength: 500 }

    InboundBillPage:
      type: object
      description: 入库单分页。
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/InboundBillListItem' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/StockBillSummary' }

    OutboundBillPage:
      type: object
      description: 出库单分页。
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/OutboundBillListItem' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/StockBillSummary' }

    InboundBillListItem:
      description: 入库单列表响应，billType 仅包含入库类型。
      allOf:
        - $ref: '#/components/schemas/StockBill'
        - type: object
          required: [billType]
          properties:
            billType: { type: string, enum: [PURCHASE_IN, SALES_RETURN, ADJUST_IN], description: 入库类型，对应 inbound_bill.inbound_type }

    OutboundBillListItem:
      description: 出库单列表响应，billType 仅包含出库类型。
      allOf:
        - $ref: '#/components/schemas/StockBill'
        - type: object
          required: [billType]
          properties:
            billType: { type: string, enum: [SALES_OUT, PURCHASE_RETURN, ADJUST_OUT], description: 出库类型，对应 outbound_bill.outbound_type }

    StockBillPage:
      type: object
      description: 入库/出库工作单分页；已确认库存流水使用 `StockLedgerPage`。
      required: [records, total, pageNum, pageSize, summary]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StockBill' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        summary: { $ref: '#/components/schemas/StockBillSummary' }

    StockBillSummary:
      type: object
      required: [sourceGeneratedCount, pendingCount, confirmedCount, cancelledCount]
      properties:
        sourceGeneratedCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `entryMode = SOURCE_GENERATED` 的单据数 }
        pendingCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 PENDING_CONFIRM 的单据数 }
        confirmedCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 CONFIRMED 的单据数 }
        cancelledCount: { type: integer, minimum: 0, description: 当前页 `records` 中状态为 CANCELLED 的单据数 }

    StockBill:
      type: object
      description: 入库或出库工作单响应。保留历史 schema 名称仅为前端类型兼容；确认后生成的库存事实不通过本 schema 查询。
      required: [workBillId, billNo, sourceType, sourceId, sourceNo, sourcePartyId, sourcePartyName, entryMode, warehouseId, warehouseName, status, itemCount, quantitySummary, totalCurrentQty, quantityUnitName, confirmedById, confirmedByName, confirmedAt, createdById, createdByName, responsibleById, responsibleByName, version, createTime, updateTime]
      properties:
        workBillId: { type: string, description: 工作单稳定 ID，对应入库单或出库单主表主键，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 入库单号或出库单号 }
        sourceType: { type: string, enum: [PURCHASE_ORDER, SALES_ORDER, PURCHASE_RETURN_ORDER, SALES_RETURN_ORDER, STOCK_ADJUST], description: 原业务来源类型 }
        sourceId: { type: string, nullable: true, description: 原业务来源单据 ID，BIGINT 按字符串传输 }
        sourceNo: { type: string, maxLength: 64, description: 原业务来源单号 }
        sourcePartyId: { type: string, nullable: true, description: 来源对象 ID，BIGINT 按字符串传输；采购入库为供应商 ID，销售退货为客户 ID，库存调整为受影响仓库 ID }
        sourcePartyName: { type: string, maxLength: 200, description: 来源对象名称快照；采购相关单据表示供应商，销售相关单据表示客户，`ADJUST_IN`、`ADJUST_OUT` 表示发生调整的来源仓库名称快照，前端统一显示在“来源对象”列，调整单详情和编辑态标注为“来源仓库” }
        entryMode: { type: string, enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT], description: 前端显示为系统生成、人工补录和人工调整 }
        warehouseId: { type: string, description: 仓库 ID，BIGINT 按字符串传输 }
        warehouseName: { type: string, maxLength: 100, description: 仓库名称快照 }
        status: { type: string, enum: [DRAFT, PENDING_CONFIRM, CONFIRMED, CANCELLED], description: 入库单或出库单工作单状态 }
        itemCount: { type: integer, minimum: 0, description: 明细条数 }
        quantitySummary: { type: string, description: 列表入库量/出库量摘要，例如“本次 20 箱”；不同单位时返回简短明细摘要，前端列表按页面方向展示为入库量或出库量，展开明细必须使用 `items.currentQty`、`items.qualifiedQty`、`items.defectiveQty`、`items.pendingQty` 独立列展示，不使用拼接质检字段 }
        totalCurrentQty: { type: number, format: double, nullable: true, description: 同单位时的入库量/出库量合计，不同单位返回 null }
        quantityUnitName: { type: string, description: 数量摘要单位；不同单位时返回空字符串 }
        confirmedById: { type: string, nullable: true, description: 工作单确认人 ID，BIGINT 按字符串传输 }
        confirmedByName: { type: string, maxLength: 100, description: 工作单确认人名称快照 }
        confirmedAt: { type: string, nullable: true, description: 工作单确认时间 }
        createdById: { type: string, nullable: true, description: 工作单创建人 ID，BIGINT 按字符串传输 }
        createdByName: { type: string, maxLength: 100, description: 工作单创建人名称快照 }
        responsibleById: { type: string, description: 工作单负责人 ID；手工单据由后端取当前登录用户 }
        responsibleByName: { type: string, maxLength: 100, description: 工作单负责人名称快照 }
        version: { type: integer, minimum: 0, description: 当前工作单版本，用于乐观锁。 }
        createTime: { type: string, description: 工作单创建时间 }
        updateTime: { type: string, description: 工作单更新时间 }

    StockBillDetail:
      allOf:
        - $ref: '#/components/schemas/StockBill'
        - type: object
          required: [billType, manualReason, remark, items]
          properties:
            billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT], description: 入库或出库工作单类型 }
            manualReason: { type: string, maxLength: 500, description: 对应入库单或出库单的补录/调整原因；系统生成单据为空字符串 }
            remark: { type: string, maxLength: 500, description: 对应工作单备注 }
            items:
              type: array
              items: { $ref: '#/components/schemas/StockBillItem' }

    StockBillItem:
      type: object
      description: 工作单明细响应；`beforeQty`、`changeQty`、`afterQty` 仅在确认后作为关联库存流水快照返回，不能提交修改。
      required: [workBillItemId, workBillId, billNo, sourceItemId, productId, productCode, productName, unitName, quantityPrecision, planQty, processedQty, currentQty, pendingQty, qualifiedQty, defectiveQty, stockBillItemId, beforeQty, changeQty, afterQty, createTime, updateTime, remark]
      properties:
        workBillItemId: { type: string, description: 工作单明细稳定 ID，对应 `inbound_bill_item` 或 `outbound_bill_item` 主键，BIGINT 按字符串传输 }
        workBillId: { type: string, description: 所属工作单稳定 ID，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 所属入库单号或出库单号 }
        sourceItemId: { type: string, nullable: true, description: 原业务来源明细 ID，BIGINT 按字符串传输 }
        productId: { type: string, description: 对应入库或出库工作单明细的 `product_id`，BIGINT 按字符串传输 }
        productCode: { type: string, maxLength: 64, description: 对应入库或出库工作单明细的 `product_code` 快照 }
        productName: { type: string, maxLength: 200, description: 对应入库或出库工作单明细的 `product_name` 快照 }
        unitName: { type: string, maxLength: 32, description: 对应入库或出库工作单明细的 `unit_name` 快照 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2, description: 对应入库或出库工作单明细的 `quantity_precision`，产品数量精度快照 }
        planQty: { type: number, format: double, nullable: true, minimum: 0, multipleOf: 0.01, description: 来源单据计划数量；库存调整可为 null }
        processedQty: { type: number, format: double, nullable: true, minimum: 0, multipleOf: 0.01, description: 生成本单前来源明细累计已入库或已出库数量；库存调整可为 null }
        pendingQty: { type: number, format: double, nullable: true, minimum: 0, multipleOf: 0.01, description: 确认本单后来源明细预计剩余未入库或未出库数量，由后端按 planQty - processedQty - currentQty 计算；库存调整可为 null；前端展开明细独立展示为剩余未入库或剩余未出库列，不允许用户手动提交 }
        currentQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 入库或出库工作单的本次业务数量，对应工作单明细 `current_qty`；系统生成的待确认单初始为 0 或空业务值，由仓库人员确认前填写，确认时必须大于 0 且不能超过来源剩余数量；数据库按 100 倍整数存储；前端展开明细独立展示为入库量或出库量列 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 工作单的合格数量业务真实值；数据库按 100 倍整数存储；前端展开明细独立展示，不得与不合格数量拼接为一个质检字段 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 工作单的不合格数量业务真实值；数据库按 100 倍整数存储；前端展开明细独立展示，不得与合格数量拼接为一个质检字段 }
        beforeQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 变动前库存业务真实值。已确认工作单从关联库存流水 stock_bill_item.before_qty 返回；未确认工作单由后端从 warehouse_stock.stock_qty 取当前库存参考值返回。数据库按 100 倍整数存储 }
        changeQty: { type: number, format: double, multipleOf: 0.01, description: 库存变动数量，入库为正、出库为负。已确认工作单从 stock_bill_item.change_qty 返回；未确认工作单返回 0（尚未产生实际库存变动）。数据库按 100 倍整数存储 }
        afterQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 变动后库存业务真实值。已确认工作单从 stock_bill_item.after_qty 返回；未确认工作单与 beforeQty 相同（尚未产生实际库存变动）。数据库按 100 倍整数存储 }
        stockBillItemId: { type: string, nullable: true, description: 确认后关联的库存流水明细 ID，BIGINT 按字符串传输；对应 inbound_bill_item.stock_bill_item_id 或 outbound_bill_item.stock_bill_item_id；未确认时为 null }
        createTime: { type: string, description: 对应入库或出库工作单明细的 `create_time` }
        updateTime: { type: string, description: 对应入库或出库工作单明细的 `update_time` }
        remark: { type: string, maxLength: 500, description: 对应入库或出库工作单明细的 `remark` }

    StockLedgerPage:
      type: object
      description: 已确认库存流水分页；与仍可编辑、提交或确认的入库/出库工作单分页相互独立。
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/StockLedgerListItem' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    StockLedgerListItem:
      type: object
      description: 已经确认并产生库存变动的只读库存流水，不承载草稿、提交或取消状态。
      required: [stockLedgerId, billNo, billType, entryMode, sourceType, sourceId, sourceNo, warehouseId, warehouseName, itemCount, confirmedById, confirmedByName, confirmedAt, createTime]
      properties:
        stockLedgerId: { type: string, description: 对应 `stock_bill.id`，BIGINT 按字符串传输 }
        billNo: { type: string, maxLength: 64, description: 对应 `stock_bill.bill_no` }
        billType: { type: string, enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT] }
        entryMode: { type: string, enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT], description: 对应 `stock_bill.entry_mode`，确认时从工作单复制的历史快照 }
        sourceType: { type: string, readOnly: true, enum: [PURCHASE_ORDER, SALES_ORDER, PURCHASE_RETURN_ORDER, SALES_RETURN_ORDER, STOCK_ADJUST], description: 由 billType 派生：采购入库、销售出库、采购退货出库、销售退货入库、调整入出库分别对应采购订单、销售订单、采购退货单、销售退货单、库存调整单；不对应 stock_bill 持久化字段 }
        sourceId: { type: string, nullable: true, description: 原业务单据 ID }
        sourceNo: { type: string, maxLength: 64, description: 原业务单号或调整单号 }
        warehouseId: { type: string }
        warehouseName: { type: string, maxLength: 100 }
        itemCount: { type: integer, minimum: 0 }
        confirmedById: { type: string, nullable: true }
        confirmedByName: { type: string, maxLength: 100 }
        confirmedAt: { type: string }
        createTime: { type: string }
    StockLedgerDetail:
      description: 已确认库存流水的只读详情；仅详情接口返回完整 `items`。
      allOf:
        - $ref: '#/components/schemas/StockLedgerListItem'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              readOnly: true
              items: { $ref: '#/components/schemas/StockLedgerItem' }

    StockLedgerItem:
      type: object
      description: 库存流水明细，只记录本次变动及变动前后库存，不包含工作单的计划、累计处理和待处理字段。
      required: [stockLedgerItemId, stockLedgerId, productId, productCode, productName, unitName, beforeQty, qualifiedQty, defectiveQty, changeQty, afterQty]
      properties:
        stockLedgerItemId: { type: string, description: 对应 `stock_bill_item.id` }
        stockLedgerId: { type: string, description: 对应 `stock_bill_item.bill_id` }
        productId: { type: string }
        productCode: { type: string, maxLength: 64 }
        productName: { type: string, maxLength: 200 }
        unitName: { type: string, maxLength: 32 }
        beforeQty: { type: number, format: double, minimum: 0, multipleOf: 0.01 }
        qualifiedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 合格数量；采购入库、销售退货按实际记录返回，其他出入库类型返回 0 }
        defectiveQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 不合格数量；采购入库、销售退货按实际记录返回，其他出入库类型返回 0 }
        changeQty: { type: number, format: double, multipleOf: 0.01, description: 对应 `stock_bill_item.change_qty`；入库为正，出库为负，其绝对值等于关联工作单的本次数量 }
        afterQty: { type: number, format: double, minimum: 0, multipleOf: 0.01 }
        remark: { type: string, maxLength: 500 }

    WarehouseStock:
      type: object
      required: [stockId, warehouseId, warehouseCode, warehouseName, productId, productCode, productName, unitName, stockQty, lockedQty, availableQty, safetyStockQty, version, updateTime]
      properties:
        stockId:
          type: string
          description: 库存 ID，对应 `warehouse_stock.id`，BIGINT 按字符串传输
        warehouseId:
          type: string
          description: 仓库 ID，对应 `warehouse_stock.warehouse_id`，BIGINT 按字符串传输
        warehouseCode: { type: string, maxLength: 64, description: 对应 `warehouse_stock.warehouse_code` }
        warehouseName: { type: string, maxLength: 100, description: 对应 `warehouse_stock.warehouse_name` }
        productId:
          type: string
          description: 产品 ID，对应 `warehouse_stock.product_id`，BIGINT 按字符串传输
        productCode: { type: string, maxLength: 64, description: 对应 `warehouse_stock.product_code` }
        productName: { type: string, maxLength: 200, description: 对应 `warehouse_stock.product_name` }
        unitName: { type: string, maxLength: 32, description: 对应 `warehouse_stock.unit_name` }
        stockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 当前库存业务真实值；数据库 `warehouse_stock.stock_qty` 按 100 倍整数存储 }
        lockedQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 锁定库存业务真实值；数据库 `warehouse_stock.locked_qty` 按 100 倍整数存储 }
        availableQty: { type: number, format: double, minimum: 0, description: 服务层计算 `stock_qty - locked_qty` }
        safetyStockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 安全库存业务真实值；数据库 `product.safety_stock_qty` 按 100 倍整数存储 }
        version: { type: integer, minimum: 0, description: Current `warehouse_stock.version` for optimistic locking/diagnostics. }
        updateTime: { type: string, description: 对应 `warehouse_stock.update_time` }

    WarehouseStockSummary:
      type: object
      required: [warehouseCount, productCount, lowStockCount, noAvailableCount, lockedCount]
      properties:
        warehouseCount: { type: integer, minimum: 0, description: 当前页 `records` 中的去重仓库数 }
        productCount: { type: integer, minimum: 0, description: 当前页 `records` 中的去重产品数 }
        lowStockCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `0 < available_qty <= safety_stock_qty` 的记录数 }
        noAvailableCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `available_qty = 0` 的记录数 }
        lockedCount: { type: integer, minimum: 0, description: 当前页 `records` 中 `locked_qty > 0` 的记录数 }

    WarehousePage:
      type: object
      required: [records, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Warehouse' }
        total: { type: integer, minimum: 0, nullable: true, description: 可选；仓库列表默认使用无总数分页，后端不需要返回精确总数 }
        hasNext: { type: boolean, description: 可选；是否存在下一页，未返回时前端按 `records.length >= pageSize` 保守判断 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    Warehouse:
      type: object
      required: [warehouseId, warehouseCode, warehouseName, contactName, contactPhone, address, status, version, remark, createTime, updateTime]
      properties:
        warehouseId:
          type: string
          description: 仓库 ID，对应 `warehouse.id`，BIGINT 按字符串传输
        warehouseCode:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
          description: 仓库编码，对应 `warehouse.warehouse_code`，由后端生成、全局唯一且创建后不可修改
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        version: { type: integer, minimum: 0, description: Current `warehouse.version` for optimistic locking. }
        remark: { type: string, maxLength: 500 }
        createTime: { type: string }
        updateTime: { type: string }

    WarehouseCreateRequest:
      type: object
      required: [warehouseName, contactName, contactPhone, address, status]
      properties:
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500, description: 选填；省略或传空字符串均表示没有备注 }

    WarehouseUpdateRequest:
      type: object
      required: [version, warehouseName, contactName, contactPhone, address, status, remark]
      properties:
        version: { type: integer, minimum: 0, description: Current `warehouse.version` for optimistic locking. }
        warehouseName: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 100 }
        contactPhone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 255 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    WarehouseStatusRequest:
      type: object
      required: [version, status]
      properties:
        version: { type: integer, minimum: 0, description: Current `warehouse.version` for optimistic locking. }
        status: { type: integer, enum: [0, 1] }

    WarehouseBatchStatusRequest:
      type: object
      required: [warehouseIds, versionByWarehouseId, status]
      properties:
        warehouseIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByWarehouseId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of warehouseId to current `warehouse.version` for optimistic locking.
        status: { type: integer, enum: [0, 1] }

    WarehouseBatchDeleteRequest:
      type: object
      required: [versionByWarehouseId, warehouseIds]
      properties:
        warehouseIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        versionByWarehouseId:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Map of warehouseId to current `warehouse.version` for optimistic locking.

    ProductPage:
      type: object
      required: [records, total, pageNum, pageSize]
      properties:
        records:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        total: { type: integer, minimum: 0 }
        pageNum: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }

    Product:
      type: object
      required:
        - productId
        - productCode
        - productName
        - categoryName
        - brandName
        - unitName
        - quantityPrecision
        - specification
        - referencePurchasePrice
        - referenceSalePrice
        - safetyStockQty
        - status
        - remark
        - createTime
        - updateTime
      properties:
        productId:
          type: string
          description: 产品 ID，对应 `product.id`
        productCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 产品编码，对应 `product.product_code`，由后端生成、全局唯一且创建后不可修改
        productName:
          type: string
          minLength: 1
          maxLength: 200
          description: 产品名称，对应 `product.product_name`
        categoryId:
          type: string
          nullable: true
          description: 分类 ID，对应 `product.category_id`
        categoryName:
          type: string
          nullable: true
          readOnly: true
          description: 分类展示名称，由后端按 `category_id` 关联 `product_category.category_name` 返回，不在产品表冗余存储；未分类时返回 `null`，无需拼装为空字符串或层级路径
        brandName:
          type: string
          maxLength: 100
        unitName:
          type: string
          minLength: 1
          maxLength: 32
        quantityPrecision:
          type: integer
          minimum: 0
          maximum: 2
          description: 产品数量允许的小数位，箱、瓶、个等离散单位通常为 0，最多保留两位小数
        specification:
          type: string
          maxLength: 255
        barcode:
          type: string
          nullable: true
          maxLength: 64
        referencePurchasePrice:
          type: number
          format: double
          minimum: 0
        referenceSalePrice:
          type: number
          format: double
          minimum: 0
        safetyStockQty:
          type: number
          format: double
          minimum: 0
          multipleOf: 0.01
          description: 业务真实值；数据库按 100 倍整数存储
        status:
          type: integer
          enum: [0, 1]
        remark:
          type: string
          maxLength: 500
        createTime: { type: string }
        updateTime: { type: string }

    ProductFormRequest:
      type: object
      required:
        - productName
        - categoryId
        - brandName
        - unitName
        - quantityPrecision
        - specification
        - barcode
        - referencePurchasePrice
        - referenceSalePrice
        - safetyStockQty
        - status
        - remark
      properties:
        productName: { type: string, minLength: 1, maxLength: 200 }
        categoryId:
          type: string
          nullable: true
        brandName: { type: string, maxLength: 100 }
        unitName: { type: string, minLength: 1, maxLength: 32 }
        quantityPrecision: { type: integer, minimum: 0, maximum: 2 }
        specification: { type: string, maxLength: 255 }
        barcode:
          type: string
          nullable: true
          maxLength: 64
        referencePurchasePrice: { type: number, format: double, minimum: 0 }
        referenceSalePrice: { type: number, format: double, minimum: 0 }
        safetyStockQty: { type: number, format: double, minimum: 0, multipleOf: 0.01, description: 业务真实值；数据库按 100 倍整数存储 }
        status: { type: integer, enum: [0, 1] }
        remark: { type: string, maxLength: 500 }

    ProductStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [0, 1] }

    ProductBatchStatusRequest:
      type: object
      required: [productIds, status]
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status: { type: integer, enum: [0, 1] }

    ProductBatchDeleteRequest:
      type: object
      required: [productIds]
      properties:
        productIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }

    ProductCategory:
      type: object
      required: [categoryId, parentId, categoryName, status, productCount, createTime, updateTime]
      properties:
        categoryId:
          type: string
          description: 分类 ID，对应 `product_category.id`
        parentId:
          type: string
          description: 上级分类 ID，对应 `product_category.parent_id`；顶级分类为 `"0"`
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，对应 `product_category.category_name`
        status:
          type: integer
          enum: [0, 1]
          description: 状态，1 启用，0 停用
        productCount:
          type: integer
          minimum: 0
          description: 当前分类直接关联的未删除产品数量，通过 `product.category_id` 聚合，不包含下级分类产品
        createTime:
          type: string
          description: 创建时间，对应 `product_category.create_time`
        updateTime:
          type: string
          description: 更新时间，对应 `product_category.update_time`

    ProductCategoryCreateRequest:
      type: object
      required: [parentId, categoryName, status]
      properties:
        parentId:
          type: string
          description: 上级分类 ID；顶级分类传 `"0"`
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，提交前去除首尾空格，同一上级下不能重复
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryUpdateRequest:
      type: object
      required: [parentId, categoryName, status]
      properties:
        parentId:
          type: string
          description: 上级分类 ID；禁止设置为自身或自身下级
        categoryName:
          type: string
          minLength: 1
          maxLength: 100
          description: 分类名称，提交前去除首尾空格，同一上级下不能重复
        status:
          type: integer
          enum: [0, 1]
          description: 状态修改必须遵守分类父子级联约束

    ProductCategoryStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryBatchStatusRequest:
      type: object
      required: [categoryIds, status]
      properties:
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
        status:
          type: integer
          enum: [0, 1]

    ProductCategoryBatchDeleteRequest:
      type: object
      required: [categoryIds]
      properties:
        categoryIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
