        serviceScore: { type: number, format: double, minimum: 0, maximum: 100, description: 服务评分展示值；数据库按 100 倍整数存储 }
        avgDeliveryDays: { type: number, format: double, minimum: 0, description: 对应 `supplier.avg_delivery_days`，平均交付天数，保留 2 位小数 }
        onTimeRate: { type: number, format: double, minimum: 0, maximum: 100, description: 准时率展示值；数据库 `supplier.on_time_rate` 按 100 倍整数存储 }
        qualifiedRate: { type: number, format: double, minimum: 0, maximum: 100, description: 合格率展示值；数据库 `supplier.qualified_rate` 按 100 倍整数存储 }
        status: { type: integer, enum: [0, 1], description: 对应 `supplier.status`，1 启用，0 停用 }
        version: { type: integer, minimum: 0, description: Current `supplier.version` for optimistic locking. }
        remark: { type: string, maxLength: 500, description: 对应 `supplier.remark` }
