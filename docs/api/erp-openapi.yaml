  /warehouse/stocks:
    get:
      tags: [WarehouseStock]
      summary: 分页查询当前库存
      description: |
        查询 `warehouse_stock` 当前库存余额，并关联 `product.safety_stock_qty` 用于库存健康判断。
        `availableQty` 由服务层按 `stock_qty - locked_qty` 计算；不同单位的库存数量不得跨产品汇总。
        仓库使用 `warehouseId` 精确匹配，产品编码和产品名称分别使用包含匹配；库存健康与占用情况是两个独立派生维度，多个有效条件按 AND 组合。
        库存健康：`NORMAL` 表示 `available_qty > safety_stock_qty`，`LOW_STOCK` 表示 `0 < available_qty <= safety_stock_qty`，`NO_AVAILABLE` 表示 `stock_qty > 0` 且 `available_qty = 0`，`OUT_OF_STOCK` 表示 `stock_qty = 0`。
        占用情况：`UNLOCKED` 表示 `locked_qty = 0`，`PARTIALLY_LOCKED` 表示 `0 < locked_qty < stock_qty`，`FULLY_LOCKED` 表示 `stock_qty > 0` 且 `locked_qty = stock_qty`。
        上述状态均为查询时派生，不在 `warehouse_stock` 中增加单一状态字段。
        本接口需要 `warehouse:query` 权限。
      operationId: warehouseStockPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `warehouse_stock.warehouse_id`，使用精确匹配
        - name: productCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 产品编码，对应 `warehouse_stock.product_code`，使用包含匹配
        - name: productName
          in: query
          schema: { type: string, maxLength: 200 }
          description: 产品名称，对应 `warehouse_stock.product_name`，使用包含匹配
        - name: inventoryHealth
          in: query
          schema:
            type: string
            enum: [NORMAL, LOW_STOCK, NO_AVAILABLE, OUT_OF_STOCK]
          description: 库存健康，由可用库存、当前库存和产品安全库存派生
        - name: reservationState
          in: query
          schema:
            type: string
            enum: [UNLOCKED, PARTIALLY_LOCKED, FULLY_LOCKED]
          description: 占用情况，由当前库存和锁定库存派生
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WarehouseStockPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /warehouse/stock-bills:
    get:
      tags: [WarehouseStockBill]
      summary: 分页查询出入库记录
      description: |
        查询 `stock_bill` 出入库流水主表，并按 `stock_bill_item.bill_id` 聚合返回 `itemCount`；列表不跨不同产品单位汇总数量。
        流水号和来源单号分别使用包含匹配，仓库、出入库类型、录入方式和状态使用精确匹配，多个有效条件按 AND 组合。
        查询库存调整凭证时，可提交 `entryMode=MANUAL_ADJUSTMENT`；调整方向使用 `billType=ADJUST_IN` 或 `billType=ADJUST_OUT` 进一步精确筛选。
        列表摘要基于当前全部筛选结果统计单据数、入库单数、出库单数和已确认单数，不只统计当前分页。
        入库类型为 `PURCHASE_IN`、`SALES_RETURN`、`ADJUST_IN`；出库类型为 `SALES_OUT`、`PURCHASE_RETURN`、`ADJUST_OUT`。
        本接口只用于追溯库存凭证，不直接创建、确认或取消流水，需要 `warehouse:query` 权限。
      operationId: stockBillPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: billNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 出入库流水号，对应 `stock_bill.bill_no`，使用包含匹配
        - name: sourceNo
          in: query
          schema: { type: string, maxLength: 64 }
          description: 来源单号，对应 `stock_bill.source_no`，使用包含匹配
        - name: warehouseId
          in: query
          schema: { type: string }
          description: 仓库 ID，对应 `stock_bill.warehouse_id`，使用精确匹配
        - name: billType
          in: query
          schema:
            type: string
            enum: [PURCHASE_IN, SALES_OUT, PURCHASE_RETURN, SALES_RETURN, ADJUST_IN, ADJUST_OUT]
          description: 出入库类型，对应 `stock_bill.bill_type`，使用精确匹配
        - name: entryMode
          in: query
          schema:
            type: string
            enum: [SOURCE_GENERATED, MANUAL_SUPPLEMENT, MANUAL_ADJUSTMENT]
          description: 录入方式，对应 `stock_bill.entry_mode`，使用精确匹配；分别表示系统自动录入、人工补录和人工调整
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, CONFIRMED, CANCELLED]
          description: 流水状态，对应 `stock_bill.status`，使用精确匹配
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [WarehouseStockBill]
      summary: 新增手工出入库草稿
      description: |
        允许创建 `ADJUST_IN`、`ADJUST_OUT` 库存调整，或在原采购、销售、退货业务遗漏登记时补录对应出入库凭证。
        非调整类型必须提交原业务单号和补录原因，后端设置 `entryMode=MANUAL_SUPPLEMENT`、按 `billType` 推导 `sourceType`，且 `sourceId` 为空；调整类型由后端生成调整单号并设置 `entryMode=MANUAL_ADJUSTMENT`。
        `billNo`、负责人、创建人、创建时间和产品快照由后端生成或按当前登录上下文填充；负责人字段不接受前端提交。
        保存后状态为 `DRAFT`，不立即改变库存；需要 `warehouse:manage` 权限。
      operationId: stockBillCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockBillCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }

  /warehouse/stock-bills/{stockBillId}:
    get:
      tags: [WarehouseStockBill]
      summary: 获取出入库记录详情
      description: 返回 `stock_bill` 主表信息及按 `stock_bill_item.bill_id` 查询的全部明细，用于追溯来源单据、确认信息、产品数量和库存变动。本接口需要 `warehouse:query` 权限。
      operationId: stockBillDetail
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
      responses:
        "200":
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockBillDetail' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      tags: [WarehouseStockBill]
      summary: 编辑出入库草稿
      description: |
        仅 `DRAFT` 状态允许编辑数量和备注。来源业务单据生成的草稿不能在本接口增删或更换产品，也不能修改来源、仓库和出入库类型；库存调整草稿允许维护产品明细。
        流水号、来源信息、审计字段、变动前后库存均由后端维护，前端不得提交；需要 `warehouse:manage` 权限。
      operationId: stockBillUpdate
      security:
        - SaTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/StockBillId'
