                    ancestors: "0"
                    deptName: 行政部
                    status: 1
                    userCount: 1
                    createTime: "2026-06-05 20:10:00"
                    updateTime: "2026-06-08 09:10:00"
                  - deptId: "1900000000000000102"
                    parentId: "0"
                    ancestors: "0"
                    deptName: 采购部
                    status: 1
                    userCount: 1
                    createTime: "2026-06-05 20:13:00"
                    updateTime: "2026-06-07 17:24:11"
                  - deptId: "1900000000000000106"
                    parentId: "1900000000000000102"
                    ancestors: "0,1900000000000000102"
                    deptName: 供应商维护组
                    status: 1
                    userCount: 0
                    createTime: "2026-06-07 09:30:00"
                    updateTime: "2026-06-07 09:30:00"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
