      description: 仓库编码由后端统一生成并通过唯一索引保证不重复，前端创建请求不提交仓库编码；生成后的编码不可修改。备注为选填字段，未填写时创建请求可以省略 `remark`。本接口需要 `warehouse:manage` 权限。
      operationId: warehouseCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreateRequest' }
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
