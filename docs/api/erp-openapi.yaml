  /products:
    get:
      tags: [Product]
      summary: 分页查询产品档案
      description: 产品编码、产品名称、品牌名称分别使用包含匹配，条码使用精确匹配；多个有效条件按 AND 组合。传入 `categoryId` 时，后端必须根据 `product_category.parent_id` 查询该分类及全部后代分类 ID，再筛选这些分类下的产品。分类名称由后端通过 `product.category_id` 单次关联查询返回，分类层级路径由前端根据分类扁平数据计算。本接口需要 `product:query` 权限。
      operationId: productPage
      security:
        - SaTokenAuth: []
      parameters:
        - name: productCode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 产品编码，对应 `product.product_code`，使用包含匹配
        - name: productName
          in: query
          schema: { type: string, maxLength: 200 }
          description: 产品名称，对应 `product.product_name`，使用包含匹配
        - name: brandName
          in: query
          schema: { type: string, maxLength: 100 }
          description: 品牌名称，对应 `product.brand_name`，使用包含匹配
        - name: barcode
          in: query
          schema: { type: string, maxLength: 64 }
          description: 产品条码，对应 `product.barcode`，使用精确匹配
        - name: categoryId
          in: query
          schema: { type: string }
          description: 产品分类 ID；查询范围包含当前分类及其全部后代分类，前端只传分类 ID，不传路径或后代 ID 集合
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1] }
        - name: pageNum
          in: query
          required: true
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductPage' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Product]
      summary: 新增产品档案
      description: 产品编码由后端统一生成并通过唯一索引保证不重复，前端创建请求不提交产品编码；启用产品不能归属停用分类。本接口需要 `product:manage` 权限。
      operationId: productCreate
      security:
        - SaTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductFormRequest' }
      responses:
        "200":
          description: 创建成功
