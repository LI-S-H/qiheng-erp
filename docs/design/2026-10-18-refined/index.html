<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云仓 ERP · 精修预览</title>
  <link rel="stylesheet" href="design.css">
  <script defer src="../2026-10-16-agent-desktop/icons.js"></script>
  <script defer src="preview.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <a class="brand" href="#purchase"><img src="../../../erp-web/src/assets/brand/yuncang-logo.png" alt=""><span>云仓 <b>ERP</b><small>云端仓储智能管理台</small></span></a>
      <nav id="navigation" aria-label="业务导航"></nav>
      <div class="sidebar-bottom"><div class="profile"><span class="avatar">系</span><span>系统管理员</span></div></div>
    </aside>
    <div class="sidebar-shade" id="sidebar-shade"></div>
    <div class="workspace">
