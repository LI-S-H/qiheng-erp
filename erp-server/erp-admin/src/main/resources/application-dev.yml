spring:
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:13307/erp?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# 开发环境连接云端 RocketMQ；需放行当前公网出口 IP 的 9876、10911、10909 端口。
# 各业务生产者组和公共发送参数继承 application.yml，无需重复注册默认组。
rocketmq:
  name-server: 8.154.27.144:9876

# MyBatis-Plus 开发环境打印 SQL
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# AI 取数专用只读账号（开发环境）。
# 口令与上面的 root 一样放在开发配置里；生产走 deploy/docker/application-container.yaml 的环境变量。
# 也可以改用本地 .env.ai.yaml 里的 ERP_AI_SQL_PASSWORD 环境变量形式，两者取其一。
erp:
  ai:
    sql:
      datasource:
        url: jdbc:mysql://localhost:13307/erp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=false
        username: erp_ai_ro
        password: erp_ai_ro_2026

