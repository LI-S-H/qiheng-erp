server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: erp-admin

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  global-config:
    db-config:
      # 主键类型
      id-type: assign_id
      # 逻辑删除字段
      logic-delete-field: deleted
      # 逻辑删除字段值
      logic-delete-value: 1
      # 逻辑删除值
      logic-not-delete-value: 0
      # 开启表名下划线映射
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true

# Sa-Token 配置
sa-token:
  # token 前缀
  token-name: satoken
  # token 存储方式（默认：memory）
  timeout: 2592000
  # token 有效时间（默认：2592000ms）
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 样式（默认：uuid）
  token-style: uuid
  # 是否开启日志（默认：true）
  is-log: true

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 系统管理
      packages-to-scan: com.qiheng.erp.system.controller
    - group: 产品管理
      packages-to-scan: com.qiheng.erp.product.controller
    - group: 仓库库存
      packages-to-scan: com.qiheng.erp.warehouse.controller
    - group: 采购管理
      packages-to-scan: com.qiheng.erp.purchase.controller
    - group: 销售管理
      packages-to-scan: com.qiheng.erp.sales.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

