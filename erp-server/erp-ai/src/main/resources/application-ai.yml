# 本地密钥文件不入库；模型按开关和密钥装配，旧规划入口保持停用。
spring:
  config:
    import: optional:file:./.env.ai.yaml

logging:
  level:
    # 该版本沙箱库的 INFO 启动日志包含运行时认证令牌。
    io.agentscope.runtime.sandbox.manager.SandboxService: WARN

erp:
  ai:
    enabled: ${ERP_AI_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:${OPENAI_COMPAT_API_KEY:}}
    base-url: ${OPENAI_COMPAT_BASE_URL:https://api.deepseek.com}
    temperature: ${ERP_AI_TEMPERATURE:0.2}
    # 技能目录：其下按 shared、main、analysis 分组，每个技能一个子目录和 SKILL.md。
    # 只在外部目录读取，不打包进 jar；修改后按下述间隔检查并重新加载。
    skills:
      dir: ${ERP_AI_SKILLS_DIR:./skills}
      refresh-ms: ${ERP_AI_SKILLS_REFRESH_MS:30000}
    model:
      # 模型名：换供应商时只改这里（或同名环境变量），不用改代码
      pro: ${OPENAI_COMPAT_MODEL_PRO:deepseek-v4-pro}
      flash: ${OPENAI_COMPAT_MODEL_FLASH:deepseek-flash}
      # 是否允许模型先思考：空=不传（OpenAI/DeepSeek 不认这个参数），false=显式关闭（通义系建议关）
      enable-thinking: ${OPENAI_COMPAT_ENABLE_THINKING:}
      read-timeout-seconds: 300
      flash-read-timeout-seconds: 60
    # 会话上下文压缩：超过阈值时保留最近原文并生成交接摘要。
    # 阈值按百万窗口的六成设置；摘要模型单独装配，读取超时不沿用对话模型。
    context:
      enabled: ${ERP_AI_CONTEXT_ENABLED:true}
      max-tokens-before-summary: ${ERP_AI_CONTEXT_MAX_TOKENS:650000}
      keep-tokens: ${ERP_AI_CONTEXT_KEEP_TOKENS:60000}
      min-keep-messages: ${ERP_AI_CONTEXT_MIN_KEEP:8}
      keep-first-user-message: ${ERP_AI_CONTEXT_KEEP_FIRST_USER:false}
      summary-model: ${ERP_AI_CONTEXT_SUMMARY_MODEL:flash}
      summary-timeout-seconds: ${ERP_AI_CONTEXT_SUMMARY_TIMEOUT:480}
      summary-max-output-tokens: ${ERP_AI_CONTEXT_SUMMARY_MAX_OUTPUT:8000}
      summary-input-max-tokens: ${ERP_AI_CONTEXT_SUMMARY_INPUT_TOKENS:800000}
      source-tool-clip-chars: ${ERP_AI_CONTEXT_TOOL_CLIP:1000}
      source-message-clip-chars: ${ERP_AI_CONTEXT_MESSAGE_CLIP:2000}
    # 经验提取：每天从已完成任务提炼做法与避坑，合并后注入目录摘要。
    experience:
      enabled: ${ERP_AI_EXPERIENCE_ENABLED:true}
      cron: "${ERP_AI_EXPERIENCE_CRON:0 10 3 * * ?}"
      extraction-input-max-tokens: ${ERP_AI_EXPERIENCE_INPUT_TOKENS:600000}
      extraction-max-output-tokens: ${ERP_AI_EXPERIENCE_OUTPUT_TOKENS:4000}
      merge-input-max-tokens: ${ERP_AI_EXPERIENCE_MERGE_INPUT_TOKENS:80000}
      merge-max-output-tokens: ${ERP_AI_EXPERIENCE_MERGE_OUTPUT_TOKENS:35000}
      merge-page-size: ${ERP_AI_EXPERIENCE_MERGE_PAGE_SIZE:100}
      extraction-worker-threads: ${ERP_AI_EXPERIENCE_WORKERS:2}
      transient-retry-backoff-millis: ${ERP_AI_EXPERIENCE_RETRY_BACKOFF_MS:1000}
      transient-max-attempts-per-run: ${ERP_AI_EXPERIENCE_TRANSIENT_ATTEMPTS:3}
      extraction-max-accepted: ${ERP_AI_EXPERIENCE_MAX_ACCEPTED:10}
      max-text-chars: ${ERP_AI_EXPERIENCE_MAX_TEXT_CHARS:400}
      summary-max-chars: ${ERP_AI_EXPERIENCE_SUMMARY_CHARS:400}
      search-limit: ${ERP_AI_EXPERIENCE_SEARCH_LIMIT:10}
      cache-seconds: ${ERP_AI_EXPERIENCE_CACHE_SECONDS:60}
      model: ${ERP_AI_EXPERIENCE_MODEL:flash}
    # AI 取数底座：独立只读连接池 + SQL 守卫 + 执行器。
    # 与模型配置分开：取数底座不依赖模型密钥，模型没配也不影响底座开关。
    sql:
      # 取数能力总开关：AI 模块打开时默认启用，可单独关掉。
      enabled: true
      datasource:
        # 开发默认值在 application-dev.yml 覆盖；生产走 deploy/docker/application-container.yaml 的环境变量。
        # allowMultiQueries 必须为 false：多语句由 wall 过滤器与驱动两层拦。
        url: ${ERP_AI_SQL_URL:jdbc:mysql://localhost:13307/erp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=false}
        username: ${ERP_AI_SQL_USERNAME:erp_ai_ro}
        password: ${ERP_AI_SQL_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: erp-ai-readonly
        initial-size: 1
        min-idle: 1
        # 取数池独立于业务池：慢查询与大结果不占业务连接。
        max-active: 2
        max-wait-ms: 3000
        validation-query: SELECT 1
        # 慢 SQL 观察阈值（毫秒），超过即记入 Druid 统计。
        slow-sql-millis: 1000
      # 会话级只读保险：账号本身只读时这行冗余，账号还没建时靠它兜底。
      session-read-only: true
      # 每页行数，同时也是"没写 LIMIT 时要不要让模型补声明"的阈值。
      page-size: 200
      # 单次查询允许的最大行数（超过就明确失败，不静默截断）。
      max-total-rows: 2000
      # 最多翻几页。
      max-pages: 10
      # 单条查询超时（秒）。
      query-timeout-seconds: 10
      graph:
        # 工作线程执行 SQL 子图；队列中的任务也计入整体超时。
        worker-threads: ${ERP_AI_SQL_GRAPH_WORKER_THREADS:8}
        queue-capacity: ${ERP_AI_SQL_GRAPH_QUEUE_CAPACITY:8}
        timeout-seconds: ${ERP_AI_SQL_GRAPH_TIMEOUT_SECONDS:600}

    # 数据集是取数中间产物：按天过期，0 表示不自动过期。
    dataset:
      directory: ${ERP_AI_DATASET_DIRECTORY:./data/ai-datasets}
      ttl-days: ${ERP_AI_DATASET_TTL_DAYS:15}

    # Python 分析产物：交付给用户的结果文件保留更久。
    python:
      result-directory: ${ERP_AI_RESULT_DIRECTORY:./data/ai-python-results}
      result-ttl-days: ${ERP_AI_RESULT_TTL_DAYS:30}
      # 单实例沙箱回收：一小时无活动后检查，每五分钟重试。
      sandbox-idle-timeout: ${ERP_AI_SANDBOX_IDLE_TIMEOUT:PT1H}
      sandbox-cleanup-interval-ms: ${ERP_AI_SANDBOX_CLEANUP_INTERVAL_MS:300000}
