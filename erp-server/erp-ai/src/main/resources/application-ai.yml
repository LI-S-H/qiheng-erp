# 本地密钥文件不入库；没有启用 AI 或没有 Key 时不装配模型与图。
spring:
  config:
    import: optional:file:./.env.ai.yaml

erp:
  ai:
    enabled: ${ERP_AI_ENABLED:false}
    api-key: ${DEEPSEEK_API_KEY:${OPENAI_COMPAT_API_KEY:}}
    base-url: ${OPENAI_COMPAT_BASE_URL:https://api.deepseek.com}
    temperature: ${ERP_AI_TEMPERATURE:0.2}
    model:
      # 模型名：换供应商时只改这里（或同名环境变量），不用改代码
      pro: ${OPENAI_COMPAT_MODEL_PRO:deepseek-v4-pro}
      flash: ${OPENAI_COMPAT_MODEL_FLASH:deepseek-flash}
      # 是否允许模型先思考：空=不传（OpenAI/DeepSeek 不认这个参数），false=显式关闭（通义系建议关）
      enable-thinking: ${OPENAI_COMPAT_ENABLE_THINKING:}
      read-timeout-seconds: 300
      flash-read-timeout-seconds: 60
    graph:
      # 首次生成不占重试额度，默认最多生成三次。
      max-format-retries: 2
      # 需求上限：同时未完成的需求数。需求跑完释放名额。
      max-user-needs: 3
      max-derived-needs: 6
      # 业务完整性审阅的回流轮次：一次修不完是常态，真实模型实测要两轮才能补齐。
      max-review-rounds: 6
    # AI 取数底座：独立只读连接池 + SQL 守卫 + 执行器。
    # 与模型配置分开：取数底座不依赖模型密钥，模型没配也不影响底座开关。
    sql:
      # 取数能力总开关：AI 模块打开时默认启用，可单独关掉。
      enabled: true
      datasource:
        # 开发默认值在 application-dev.yml 覆盖；生产走 deploy/docker/application-container.yaml 的环境变量。
        # allowMultiQueries 必须为 false：多语句由 wall 过滤器与驱动两层拦。
        url: ${ERP_AI_SQL_URL:jdbc:mysql://localhost:13307/erp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=false}
        username: ${ERP_AI_SQL_USERNAME:erp_ai_ro}
        password: ${ERP_AI_SQL_PASSWORD:}
        driver-class-name: com.mysql.cj.jdbc.Driver
        pool-name: erp-ai-readonly
        initial-size: 1
        min-idle: 1
        # 取数池独立于业务池：慢查询与大结果不占业务连接。
        max-active: 2
        max-wait-ms: 3000
        validation-query: SELECT 1
        # 慢 SQL 观察阈值（毫秒），超过即记入 Druid 统计。
        slow-sql-millis: 1000
      # 会话级只读保险：账号本身只读时这行冗余，账号还没建时靠它兜底。
      session-read-only: true
      # 每页行数，同时也是"没写 LIMIT 时要不要让模型补声明"的阈值。
      page-size: 200
      # 单个证据项允许的最大行数（超过就明确失败，不静默截断）。
      max-total-rows: 5000
      # 最多翻几页。
      max-pages: 10
      # 单条查询超时（秒）。
      query-timeout-seconds: 10
    # Planner 读取节点工作记忆；超过阈值时摘要早期历史，保留最近消息。
    # 工作记忆按会话累积（跨任务），阈值决定模型还能看到多少历史，不是纯技术参数。
    memory:
      summary-trigger-tokens: ${ERP_AI_SUMMARY_TRIGGER_TOKENS:200000}
      messages-to-keep: 20
      # 摘要长度按待压缩历史的固定比例给，同时受下面两个硬上限约束。
      summary-max-history-ratio: 0.10
      summary-max-tokens: 50000
      summary-provider-max-output-tokens: ${ERP_AI_SUMMARY_PROVIDER_MAX_OUTPUT_TOKENS:50000}
      summary-timeout-seconds: 300
